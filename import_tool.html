<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRK Bulk Import Tool | WRK System</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Anuphan','sans-serif'] } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Anuphan', sans-serif; }
        .swal2-popup { font-family: 'Anuphan', sans-serif !important; border-radius: 1rem !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-10 flex flex-col items-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl">
        <h1 class="text-2xl font-bold text-blue-700 mb-2">เครื่องมือนำเข้าครู (Ninja Bypass)</h1>
        <p class="text-sm text-red-500 mb-6 font-bold">*หลอก Firewall ด้วย Anon Key แล้วทะลวงสิทธิ์ด้วย Secret Key</p>
        
        <label class="block text-sm font-bold text-gray-700 mb-1">1. Supabase URL</label>
        <input type="text" id="sbUrl" placeholder="https://xxxx.supabase.co" class="border border-gray-300 rounded p-2 w-full mb-4 outline-none focus:border-blue-500">
        
        <label class="block text-sm font-bold text-gray-700 mb-1">2. Publishable Key (กุญแจสาธารณะ - ตัวบนสุด)</label>
        <input type="text" id="sbAnonKey" placeholder="sb_publishable_..." class="border border-gray-300 rounded p-2 w-full mb-4 outline-none focus:border-blue-500">
        
        <label class="block text-sm font-bold text-gray-700 mb-1">3. Service Role Key (กุญแจลับ - ตัวล่างสุด)</label>
        <input type="password" id="sbSecretKey" placeholder="sb_secret_..." class="border border-gray-300 rounded p-2 w-full mb-6 outline-none focus:border-blue-500">
        
        <label class="block text-sm font-bold text-gray-700 mb-1">4. เลือกไฟล์ Excel รายชื่อครู</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-6">
        
        <button onclick="startImport()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-3 rounded-lg transition-colors">🚀 เริ่มสร้างบัญชีและนำเข้าข้อมูล</button>
        
        <div id="log" class="mt-6 text-sm font-mono bg-gray-900 text-green-400 p-4 rounded-lg h-64 overflow-y-auto whitespace-pre-wrap">ระบบพร้อมทำงาน...</div>
    </div>

    <script>
        async function startImport() {
            let url = document.getElementById('sbUrl').value.trim();
            const anonKey = document.getElementById('sbAnonKey').value.trim();
            const secretKey = document.getElementById('sbSecretKey').value.trim();
            const file = document.getElementById('excelFile').files[0];
            const logBox = document.getElementById('log');

            if(!url || !anonKey || !secretKey || !file) return alert("กรุณากรอกข้อมูลและเลือกไฟล์ให้ครบถ้วน!");
            if(url.endsWith('/')) url = url.slice(0, -1);

            logBox.innerHTML = "กำลังเตรียมระบบ...\n";
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                const wb = XLSX.read(e.target.result, {type: 'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                
                for(let i=0; i<rows.length; i++) {
                    const row = rows[i];
                    const email = row['email'] || row['อีเมล'] || row['Email'];
                    const pwd = row['password'] || row['รหัสผ่าน'] || '123456';
                    const fname = row['first_name'] || row['ชื่อ'] || row['ชื่อจริง'];
                    const lname = row['last_name'] || row['นามสกุล'];
                    const prefix = row['prefix'] || row['คำนำหน้า'] || '';
                    const role = row['role'] || row['สิทธิ์'] || 'teacher';

                    if(!email) continue;
                    logBox.innerHTML += `[${i+1}/${rows.length}] กำลังสร้าง: ${email}... `;
                    logBox.scrollTop = logBox.scrollHeight;

                    try {
                        // 1. ยิง API สร้าง User 
                        const authRes = await fetch(`${url}/auth/v1/admin/users`, {
                            method: 'POST',
                            headers: {
                                'apikey': anonKey, // 🥷 ใช้ Anon หลอกยามหน้าประตู
                                'Authorization': `Bearer ${secretKey}`, // 🥷 ใช้ Secret ทะลวงฐานข้อมูล
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ email: email, password: String(pwd), email_confirm: true })
                        });

                        const authData = await authRes.json();

                        if(!authRes.ok) {
                            logBox.innerHTML += `<span class="text-red-500">❌ พลาด (Auth): ${authData.message || authData.msg || 'Error'}</span>\n`;
                            continue;
                        }

                        // 2. ยิง API บันทึกลงตารางโรงเรียน
                        const dbRes = await fetch(`${url}/rest/v1/core_personnel`, {
                            method: 'POST',
                            headers: {
                                'apikey': anonKey, // 🥷 ใช้ Anon หลอกยามหน้าประตู
                                'Authorization': `Bearer ${secretKey}`, // 🥷 ใช้ Secret ทะลวงฐานข้อมูล
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                id: authData.id, 
                                email: email,
                                first_name: fname || '-',
                                last_name: lname || '-',
                                prefix: prefix || '',
                                role: role
                            })
                        });

                        if(!dbRes.ok) {
                            const dbErr = await dbRes.json();
                            logBox.innerHTML += `<span class="text-red-500">❌ พลาด (DB): ${dbErr.message || 'Error'}</span>\n`;
                        } else {
                            logBox.innerHTML += `<span class="text-blue-300">✅ สำเร็จ!</span>\n`;
                        }

                    } catch (err) {
                        logBox.innerHTML += `<span class="text-red-500">❌ ระบบขัดข้อง: ${err.message}</span>\n`;
                    }
                }
                logBox.innerHTML += `\n🎉 นำเข้าเสร็จสมบูรณ์ 100%! คุณสามารถไปทดสอบล็อกอินหน้าเว็บหลักได้เลยครับ`;
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
