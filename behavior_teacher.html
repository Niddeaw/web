<!DOCTYPE html>
<html lang="th">

<head>
    <title>ครูที่ปรึกษา | ระบบงานปกครอง</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen pb-10">

    <nav
        class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-red-100 px-4 md:px-6 py-3 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" alt="Logo"
                class="w-10 h-10 object-contain hidden md:block">
            <div>
                <h1 class="font-bold text-red-900 leading-tight text-lg flex items-center gap-2">
                    <i class="fa-solid fa-gavel md:hidden"></i> ระบบงานปกครอง
                </h1>
                <div class="text-[10px] md:text-xs text-red-600 font-bold flex items-center gap-1">
                    ครูที่ปรึกษา: <span id="my_room"
                        class="bg-red-100 px-2 py-0.5 rounded-full text-red-700">กำลังโหลด...</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <span id="user_display"
                class="text-sm font-bold text-slate-600 mr-2 hidden md:inline bg-slate-100 px-3 py-1 rounded-full"></span>

            <!-- ✅ ปุ่มแดชบอร์ด (เพิ่ม id) -->
            <button id="btnDashboard" onclick="window.location.href='behavior_dashboard.html'"
                class="hidden h-10 px-3 flex items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 hover:bg-emerald-100 transition border border-emerald-200 shadow-sm">
                <i class="fa-solid fa-chart-pie sm:mr-1"></i> <span
                    class="hidden sm:inline text-sm font-bold">แดชบอร์ด</span>
            </button>

            <button id="btnAdminMode" onclick="window.location.href='behavior_admin.html'"
                class="hidden h-10 px-3 items-center justify-center rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-100 transition border border-purple-200 shadow-sm"
                title="สลับโหมด">
                <i class="fa-solid fa-user-shield sm:mr-1"></i> <span
                    class="hidden sm:inline text-sm font-bold">โหมดแอดมิน</span>
            </button>

            <button onclick="window.location.href='index.html'"
                class="h-10 w-10 flex items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition border border-indigo-200 shadow-sm">
                <i class="fa-solid fa-house text-sm"></i>
            </button>
            <button onclick="logout()"
                class="bg-rose-50 text-rose-600 h-10 w-10 flex items-center justify-center rounded-xl hover:bg-rose-100 transition-colors shadow-sm">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-users text-red-600"></i> รายชื่อนักเรียนในความดูแล
            </h3>
            <button onclick="exportTeacherExcel()"
                class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-file-excel"></i> ส่งออกข้อมูล Excel
            </button>
        </div>

        <div class="glass p-6 rounded-3xl">
            <table id="teacherTable" class="w-full text-sm">
                <thead>
                    <tr>
                        <th class="py-3 px-4 text-left">เลขที่</th>
                        <th class="py-3 px-4 text-left">เลขประจำตัว</th>
                        <th class="py-3 px-4 text-left">ชื่อ-นามสกุล</th>
                        <th class="py-3 px-4 text-center">คะแนนปัจจุบัน</th>
                        <th class="py-3 px-4 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="teacherBody">
                    <tr>
                        <td colspan="5" class="text-center py-8 text-gray-400">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // ==========================================================================
        // behavior_teacher.js - ระบบงานปกครอง (ครูที่ปรึกษา)
        // - ใช้ checkSessionAndRole() แทน checkAuth() เดิม
        // - ใช้ isAdminUser(), hasModuleAccess() ตรวจสอบสิทธิ์
        // - ใช้ applyVisibilityByRole() ควบคุมปุ่ม
        // - ใช้ logUserAction() บันทึกประวัติการเข้าใช้งาน
        // - รองรับ Admin, หัวหน้างานปกครอง, หัวหน้าระดับ
        // ==========================================================================

        let myClassroom = null;
        let studentData = [];
        let currentUser = null;
        let actualRole = '';
        let isAdminMode = false;
        let isDisciplineHead = false;
        let managedGrades = [];
        let dataTable = null;

        // ============================================================
        // เริ่มต้น
        // ============================================================
        $(document).ready(async () => {
            try {
                Swal.fire({ title: 'กำลังโหลดข้อมูล...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

                // 1. ตรวจสอบเซสชันและสิทธิ์ด้วย config.js
                const session = await checkSessionAndRole('ระบบงานปกครอง (ครูที่ปรึกษา)');
                if (!session) return;

                const { user, personnel, role, isAdmin, isTeacher, isOffice, isAdminMode: sessionMode } = session;
                currentUser = personnel;
                actualRole = role;
                isAdminMode = sessionMode;

                // 2. ใช้ applyVisibilityByRole เพื่อควบคุมปุ่มต่าง ๆ
                applyVisibilityByRole(role, isAdminMode, {
                    settingsBtn: null,
                    toggleBtn: null,
                    adminManagerBtn: null
                });

                // 3. ตรวจสอบสิทธิ์เพิ่มเติม: หัวหน้างานปกครอง, หัวหน้าระดับ, ครูที่ปรึกษา
                const { data: sInfo } = await db.from('core_school_info')
                    .select('current_academic_year')
                    .single();
                if (sInfo?.current_academic_year) {
                    const { data: discHead } = await db.from('core_discipline_heads')
                        .select('id')
                        .eq('personnel_id', user.id)
                        .eq('academic_year', sInfo.current_academic_year)
                        .maybeSingle();
                    isDisciplineHead = !!discHead;
                }
                const { data: gradeHeads } = await db.from('behavior_grade_heads')
                    .select('grade_level')
                    .eq('teacher_id', user.id);
                managedGrades = gradeHeads ? gradeHeads.map(g => g.grade_level) : [];

                // ✅ ตรวจสอบว่าเป็นครูที่ปรึกษา (มีห้องใน core_classrooms)
                const { data: adviserRoom } = await db.from('core_classrooms')
                    .select('id')
                    .or(`adviser_id_1.eq.${user.id},adviser_id_2.eq.${user.id}`)
                    .maybeSingle();
                const hasClassroom = !!adviserRoom;

                // 4. ตรวจสอบสิทธิ์เข้าโมดูล (ถ้าไม่ใช่ admin)
                if (!isAdmin) {
                    const hasAccess = await hasModuleAccess(role, 'behavior', user.id);
                    // ✅ เพิ่ม hasClassroom — ครูที่ปรึกษาเข้าได้โดยไม่ต้องอยู่ใน core_module_admins
                    const hasSpecialAccess = isDisciplineHead || managedGrades.length > 0 || hasClassroom;
                    if (!hasAccess && !hasSpecialAccess) {
                        await Swal.fire({
                            icon: 'warning',
                            title: 'ไม่มีสิทธิ์เข้าใช้งาน',
                            text: 'คุณไม่ได้รับอนุญาตให้ใช้งานระบบงานปกครอง กรุณาติดต่อผู้ดูแลระบบ',
                            confirmButtonText: 'กลับหน้าหลัก'
                        });
                        window.location.href = 'index.html';
                        return;
                    }
                }

                // 5. ปุ่มแดชบอร์ดและโหมดแอดมิน
                const hasAdminAccess = isAdmin || isDisciplineHead || managedGrades.length > 0;
                const hasDashboardAccess = hasAdminAccess;

                const btnDashboard = document.getElementById('btnDashboard');
                if (btnDashboard) {
                    btnDashboard.classList.toggle('hidden', !hasDashboardAccess);
                    btnDashboard.classList.toggle('flex', hasDashboardAccess);
                }

                const btnAdminMode = document.getElementById('btnAdminMode');
                if (btnAdminMode) {
                    btnAdminMode.classList.toggle('hidden', !hasAdminAccess);
                    btnAdminMode.classList.toggle('flex', hasAdminAccess);
                }

                // 6. แสดงชื่อผู้ใช้
                const userDisplay = document.getElementById('user_display');
                if (userDisplay) {
                    userDisplay.innerHTML = `<i class="fas fa-user-tie mr-2 text-blue-500"></i>ครู${currentUser.first_name} ${currentUser.last_name}`;
                }

                // 7. บันทึก Log การเข้าใช้งาน
                await logUserAction('เข้าสู่ระบบงานปกครอง (ครูที่ปรึกษา)', 'behavior');

                // 8. ดึงห้องที่ปรึกษา
                const { data: classroom } = await db.from('core_classrooms')
                    .select('*')
                    .or(`adviser_id_1.eq.${user.id},adviser_id_2.eq.${user.id}`)
                    .single();

                if (!classroom) {
                    if (hasAdminAccess) {
                        window.location.replace('behavior_admin.html');
                        return;
                    } else {
                        await Swal.fire({
                            icon: 'warning',
                            title: 'ไม่พบสิทธิ์ครูที่ปรึกษา',
                            text: 'คุณยังไม่ได้ถูกระบุเป็นครูที่ปรึกษาในระบบ กรุณาติดต่อผู้ดูแลระบบ',
                            confirmButtonText: 'กลับหน้าหลัก'
                        });
                        window.location.href = 'index.html';
                        return;
                    }
                }

                myClassroom = classroom;
                document.getElementById('my_room').textContent = `ม.${classroom.grade_level}/${classroom.room_number}`;

                // 9. โหลดนักเรียน
                await loadMyStudents();

                Swal.close();
                console.log('✅ behavior_teacher.js initialized successfully');

            } catch (err) {
                console.error('Initialization error:', err);
                Swal.fire('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถเริ่มระบบได้', 'error');
            }
        });

        // ============================================================
        // ออกจากระบบ (ใช้ฟังก์ชันจาก config.js)
        // ============================================================
        async function logout() {
            await db.auth.signOut();
            window.location.replace('index.html');
        }

        // ============================================================
        // โหลดนักเรียนในห้องที่ปรึกษา
        // ============================================================
        async function loadMyStudents() {
            try {
                const { data: enrolls, error } = await db.from('student_enrollments')
                    .select(`
                student_number,
                core_students (
                    id,
                    student_id_card,
                    prefix,
                    first_name,
                    last_name,
                    avatar_students_url,
                    behavior_logs ( score_change )
                )
            `)
                    .eq('classroom_id', myClassroom.id)
                    .order('student_number', { ascending: true });

                if (error) throw error;

                if (!enrolls || enrolls.length === 0) {
                    document.getElementById('teacherBody').innerHTML = `
                <tr><td colspan="5" class="text-center py-16 text-slate-400 font-bold">
                    <i class="fas fa-user-slash text-4xl mb-3 block text-slate-300"></i>
                    ยังไม่มีนักเรียนในห้องนี้
                </td></tr>
            `;
                    return;
                }

                studentData = enrolls.map(item => {
                    const s = item.core_students;
                    const logs = s?.behavior_logs || [];
                    const totalScore = 100 + logs.reduce((sum, l) => sum + (l.score_change || 0), 0);
                    return {
                        id: s?.id || '',
                        no: item.student_number || '-',
                        sid: s?.student_id_card || '-',
                        name: `${s?.prefix || ''}${s?.first_name || ''} ${s?.last_name || ''}`.trim() || 'ไม่ระบุชื่อ',
                        score: totalScore,
                        avatar: s?.avatar_students_url || null
                    };
                });

                renderTable();

            } catch (err) {
                console.error('Error loading students:', err);
                document.getElementById('teacherBody').innerHTML = `
            <tr><td colspan="5" class="text-center py-8 text-red-500 font-bold">
                <i class="fas fa-exclamation-triangle mr-2"></i> เกิดข้อผิดพลาด: ${err.message}
            </td></tr>
        `;
            }
        }

        // ============================================================
        // แสดงตารางด้วย DataTable
        // ============================================================
        function renderTable() {
            const tbody = document.getElementById('teacherBody');
            if (!tbody) return;

            if ($.fn.DataTable.isDataTable('#teacherTable')) {
                $('#teacherTable').DataTable().destroy();
            }

            let html = '';
            studentData.forEach(s => {
                const scoreClass = s.score < 50 ? 'bg-red-100 text-red-600'
                    : (s.score >= 100 ? 'bg-green-100 text-green-700'
                        : 'bg-orange-100 text-orange-600');

                const avatarHtml = s.avatar
                    ? `<img src="${s.avatar}" class="w-8 h-8 rounded-full object-cover border-2 border-slate-200 shadow-sm" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=ebd9fc&color=7c3aed&font-size=0.4&bold=true'">`
                    : `<div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-bold">${s.name.charAt(0) || '?'}</div>`;

                html += `
            <tr class="hover:bg-blue-50/50 transition-colors border-b border-slate-50 cursor-pointer" onclick="viewHistory('${s.id}')" title="คลิกเพื่อดูประวัติ">
                <td class="py-3 px-4 text-center font-bold text-slate-600">${s.no}</td>
                <td class="py-3 px-4">
                    <div class="flex items-center gap-3">
                        ${avatarHtml}
                        <span class="font-medium text-slate-600">${s.sid}</span>
                    </div>
                </td>
                <td class="py-3 px-4 font-bold text-blue-800">${s.name}</td>
                <td class="py-3 px-4 text-center">
                    <span class="px-3 py-1.5 rounded-xl text-sm font-black ${scoreClass}">${s.score}</span>
                </td>
                <td class="py-3 px-4 text-center">
                    <button onclick="event.stopPropagation(); viewHistory('${s.id}')" 
                            class="bg-white border border-blue-200 text-blue-600 px-4 py-1.5 rounded-xl text-xs font-bold hover:bg-blue-50 transition shadow-sm">
                        <i class="fas fa-eye mr-1"></i> ประวัติ
                    </button>
                </td>
            </tr>
        `;
            });

            tbody.innerHTML = html;

            $('#teacherTable').DataTable({
                responsive: true,
                pageLength: 25,
                lengthMenu: [[10, 25, 50, 100], [10, 25, 50, 100]],
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/2.3.7/i18n/th.json'
                },
                columnDefs: [
                    { responsivePriority: 1, targets: 2 },
                    { responsivePriority: 2, targets: 4 },
                    { responsivePriority: 3, targets: 0 },
                ],
                order: [[0, 'asc']]
            });
        }

        // ============================================================
        // ดูประวัติ
        // ============================================================
        function viewHistory(id) {
            if (!id) return;
            window.location.href = `behavior_history.html?id=${id}`;
        }

        // ============================================================
        // ส่งออก Excel
        // ============================================================
        function exportTeacherExcel() {
            if (studentData.length === 0) {
                Swal.fire('ไม่มีข้อมูล', 'ไม่พบข้อมูลนักเรียนในห้องนี้', 'warning');
                return;
            }

            const exportData = studentData.map(s => ({
                'เลขที่': s.no,
                'เลขประจำตัว': s.sid,
                'ชื่อ-นามสกุล': s.name,
                'คะแนนปัจจุบัน': s.score
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const cols = Object.keys(exportData[0] || {}).map(key => ({ wch: Math.max(key.length * 2, 12) }));
            ws['!cols'] = cols;
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'คะแนนความประพฤติ');
            XLSX.writeFile(wb, `คะแนนความประพฤติ_ม.${myClassroom.grade_level}_${myClassroom.room_number}.xlsx`);

            logUserAction(`ส่งออก Excel ห้อง ม.${myClassroom.grade_level}/${myClassroom.room_number}`, 'behavior');

            Swal.fire({
                icon: 'success',
                title: 'ส่งออก Excel สำเร็จ',
                timer: 1500,
                showConfirmButton: false
            });
        }

        // ============================================================
        // ประกาศฟังก์ชัน global
        // ============================================================
        window.viewHistory = viewHistory;
        window.exportTeacherExcel = exportTeacherExcel;
        window.logout = logout;

        console.log('✅ behavior_teacher.js (ฉบับสมบูรณ์) loaded with config.js integration');
    </script>
</body>

</html>
