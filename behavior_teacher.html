<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ครูที่ปรึกษา | ระบบงานปกครอง</title>

    <script src="core_head.js"></script>
    <script src="config.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="text-gray-800 min-h-screen opacity-0 transition-opacity duration-500" id="mainBody">

    <div class="d-app">
        <aside class="d-sidebar" id="dSidebar"></aside>
        <div class="d-overlay" id="dOverlay" onclick="toggleSidebar(false)"></div>

        <main class="d-main" id="dMain">
            <header class="d-topbar" id="dTopbar"></header>

            <div style="padding:0 0 12px;" class="space-y-4">

                <div class="d-card">
                    <div class="d-card-head">
                        <div>
                            <div class="d-card-title">👥 รายชื่อนักเรียนในความดูแล</div>
                            <div class="d-sub">คลิกที่แถวเพื่อดูประวัติความประพฤติ</div>
                        </div>
                        <button onclick="exportTeacherExcel()"
                            class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors flex items-center gap-2">
                            <i class="fas fa-file-excel"></i> ส่งออก Excel
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table id="teacherTable" class="w-full text-sm display">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                                    <th class="py-3 px-4 text-center">เลขที่</th>
                                    <th class="py-3 px-4 text-left">เลขประจำตัว</th>
                                    <th class="py-3 px-4 text-left">ชื่อ-นามสกุล</th>
                                    <th class="py-3 px-4 text-center">คะแนนปัจจุบัน</th>
                                    <th class="py-3 px-4 text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="teacherBody">
                                <tr>
                                    <td colspan="5" class="text-center py-8 text-gray-400">
                                        <i class="fas fa-spinner fa-spin mr-2"></i>กำลังโหลดข้อมูล...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="dashboard_ui.js"></script>
    <script src="dashboard_sidebar.js"></script>

    <script>
        function getBehaviorFallbackCommon() {
            return {
                brand: { logo: 'https://i.ibb.co/94wLv5v/WRK-PNG-200px.png', name: 'งานปกครอง', subtitle: 'ระบบงานปกครอง' },
                mainMenuTitle: 'เมนูหลัก',
                mainMenuCollapsible: false,
                mainMenu: [{ id: 'nav-home', icon: 'fa-house', label: 'หน้าหลัก', href: 'index.html' }],
                showAllDepartments: false,
                departmentsTitle: '',
                departments: [],
                moduleMenus: [
                    {
                        title: 'ระบบงานปกครอง',
                        sectionId: 'sec-behavior',
                        collapsible: false,
                        defaultOpen: true,
                        items: [
                            { id: 'navDashboard', icon: 'fa-chart-pie', label: 'ภาพรวม', href: 'behavior_dashboard.html' },
                            { id: 'navAdmin', icon: 'fa-users-cog', label: 'จัดการนักเรียน', href: 'behavior_admin.html' },
                            { id: 'navTeacher', icon: 'fa-user-tie', label: 'ครูที่ปรึกษา', href: 'behavior_teacher.html' }
                        ]
                    },
                    {
                        title: 'การตั้งค่า',
                        sectionId: 'sec-behavior-settings',
                        collapsible: false,
                        defaultOpen: true,
                        items: [
                            { id: 'navSettings', icon: 'fa-gear', label: 'ตั้งค่าระบบ', href: 'behavior_settings.html', roles: ['super_admin', 'admin'] }
                        ]
                    }
                ],
                footerMenuTitle: '',
                footerCollapsible: false,
                footerMenu: [],
                logoutItem: { icon: 'fa-power-off', label: 'ออกจากระบบ', onclick: 'logout()', class: 'logout' },
                facebook: { href: 'https://www.facebook.com/WRKOfficial', icon: 'fa-brands fa-facebook', label: 'ติดตามเพจโรงเรียน' }
            };
        }

        async function applyBehaviorRoleFilterLocal() {
            if (window.currentUserRole && typeof isAdminUser === 'function' && isAdminUser(window.currentUserRole, false)) return;
            try {
                const { data: { user } } = await db.auth.getUser();
                if (!user) return;
                const { data: sInfo } = await db.from('core_school_info').select('current_academic_year').single();
                const year = sInfo?.current_academic_year;
                const [discHead, gradeHead] = await Promise.all([
                    year ? db.from('core_discipline_heads').select('id').eq('personnel_id', user.id).eq('academic_year', year).maybeSingle() : Promise.resolve({ data: null }),
                    db.from('behavior_grade_heads').select('grade_level').eq('teacher_id', user.id)
                ]);
                const hasAdmin = !!discHead.data || (gradeHead.data && gradeHead.data.length > 0);
                if (!hasAdmin) {
                    ['navDashboard', 'navAdmin'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.remove();
                    });
                }
            } catch (e) { console.warn('applyBehaviorRoleFilterLocal error:', e); }
        }

        // =======================================================
        // ✅ Helper: Refresh Topbar UI (เรียกทุกครั้งหลัง re-render)
        //     แก้ปัญหา ชื่อ/role/avatar/ปุ่ม หายหลัง initModuleSidebar re-render
        // =======================================================
        function refreshBehaviorTopbarUI() {
            // 1) วันที่
            if (typeof setTodayChip === 'function') {
                try { setTodayChip(); } catch (e) { /* ignore */ }
            }

            // 2) ข้อมูลผู้ใช้
            try {
                if (typeof currentUser !== 'undefined' && currentUser) {
                    if (typeof setUserDisplayName === 'function') setUserDisplayName(currentUser);
                    if (typeof updateUserRoleLabel === 'function') updateUserRoleLabel(actualRole || currentUser.role || '');
                    if (typeof renderUserAvatar === 'function') renderUserAvatar(currentUser);
                }
            } catch (e) { /* TDZ — ignore */ }

            // 3) Sidebar visibility (re-apply role filter)
            if (typeof applyBehaviorRoleFilterLocal === 'function') {
                try { applyBehaviorRoleFilterLocal(); } catch (e) { /* ignore */ }
            }
        }
        window.refreshBehaviorTopbarUI = refreshBehaviorTopbarUI;

        initModuleSidebar({
            moduleKey: 'behavior',
            pageTitle: 'ครูที่ปรึกษา',
            activeId: 'navTeacher',
            topbarButtons: [{
                id: 'btnModeAdmin',
                icon: 'fas fa-user-shield',
                label: 'โหมดแอดมิน',
                onclick: "window.location.href='behavior_admin.html'",
                class: 'hidden d-btn-mode admin'
            }],
            fallbackConfig: getBehaviorFallbackCommon(),
            onReady: async () => {
                refreshBehaviorTopbarUI();
                setTimeout(refreshBehaviorTopbarUI, 800);
                if (typeof window.updateRoomDisplay === 'function') {
                    window.updateRoomDisplay();
                }
            }
        });
    </script>

    <script>
        // ============================================================
        // behavior_teacher — Inline Logic
        // ============================================================
        let myClassroom = null;
        let studentData = [];
        let currentUser = null;
        let actualRole = '';
        let isAdminMode = false;
        let isDisciplineHead = false;
        let managedGrades = [];
        let dataTable = null;

        $(document).ready(async () => {
            try {
                Swal.fire({ title: 'กำลังโหลดข้อมูล...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

                const session = await checkSessionAndRole('ระบบงานปกครอง (ครูที่ปรึกษา)');
                if (!session) return;

                const { user, personnel, role, isAdmin, isAdminMode: sessionMode } = session;
                currentUser = personnel;
                actualRole = role;
                isAdminMode = sessionMode;

                setUserDisplayName(personnel);
                updateUserRoleLabel(role);
                renderUserAvatar(personnel);

                const { data: sInfo } = await db.from('core_school_info')
                    .select('current_academic_year').single();
                if (sInfo?.current_academic_year) {
                    const { data: discHead } = await db.from('core_discipline_heads')
                        .select('id')
                        .eq('personnel_id', user.id)
                        .eq('academic_year', sInfo.current_academic_year)
                        .maybeSingle();
                    isDisciplineHead = !!discHead;
                }

                const { data: gradeHeads } = await db.from('behavior_grade_heads')
                    .select('grade_level').eq('teacher_id', user.id);
                managedGrades = gradeHeads ? gradeHeads.map(g => g.grade_level) : [];

                const { data: adviserRoom } = await db.from('core_classrooms')
                    .select('id')
                    .or(`adviser_id_1.eq.${user.id},adviser_id_2.eq.${user.id}`)
                    .maybeSingle();
                const hasClassroom = !!adviserRoom;

                if (!isAdmin) {
                    const hasAccess = await hasModuleAccess(role, 'behavior', user.id);
                    const hasSpecialAccess = isDisciplineHead || managedGrades.length > 0 || hasClassroom;
                    if (!hasAccess && !hasSpecialAccess) {
                        await Swal.fire({
                            icon: 'warning',
                            title: 'ไม่มีสิทธิ์เข้าใช้งาน',
                            text: 'คุณไม่ได้รับอนุญาตให้ใช้งานระบบงานปกครอง',
                            confirmButtonText: 'กลับหน้าหลัก'
                        });
                        window.location.href = 'index.html';
                        return;
                    }
                }

                await logUserAction('เข้าสู่ระบบงานปกครอง (ครูที่ปรึกษา)', 'behavior');

                const { data: classroom } = await db.from('core_classrooms')
                    .select('*')
                    .or(`adviser_id_1.eq.${user.id},adviser_id_2.eq.${user.id}`)
                    .single();

                if (!classroom) {
                    const hasAdminAccess = isAdmin || isDisciplineHead || managedGrades.length > 0;
                    if (hasAdminAccess) {
                        window.location.replace('behavior_admin.html');
                        return;
                    }
                    await Swal.fire({
                        icon: 'warning',
                        title: 'ไม่พบสิทธิ์ครูที่ปรึกษา',
                        text: 'คุณยังไม่ได้ถูกระบุเป็นครูที่ปรึกษาในระบบ กรุณาติดต่อผู้ดูแลระบบ',
                        confirmButtonText: 'กลับหน้าหลัก'
                    });
                    window.location.href = 'index.html';
                    return;
                }

                myClassroom = classroom;
                await loadMyStudents();

                // อัปเดต pageTitle
                if (typeof updateRoomDisplay === 'function') updateRoomDisplay();

                Swal.close();
                console.log('✅ behavior_teacher initialized');

            } catch (err) {
                console.error('Initialization error:', err);
                Swal.fire('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถเริ่มระบบได้', 'error');
            } finally {
                document.getElementById('mainBody').classList.replace('opacity-0', 'opacity-100');
            }
        });

        async function loadMyStudents() {
            try {
                const { data: enrolls, error } = await db.from('student_enrollments')
                    .select(`
                        student_number,
                        core_students (
                            id,
                            student_id_card,
                            prefix,
                            first_name,
                            last_name,
                            avatar_students_url,
                            behavior_logs ( score_change )
                        )
                    `)
                    .eq('classroom_id', myClassroom.id)
                    .order('student_number', { ascending: true });

                if (error) throw error;

                if (!enrolls || enrolls.length === 0) {
                    document.getElementById('teacherBody').innerHTML = `
                        <tr><td colspan="5" class="text-center py-16 text-slate-400 font-bold">
                            <i class="fas fa-user-slash text-4xl mb-3 block text-slate-300"></i>
                            ยังไม่มีนักเรียนในห้องนี้
                        </td></tr>
                    `;
                    return;
                }

                studentData = enrolls.map(item => {
                    const s = item.core_students || {};
                    const logs = s.behavior_logs || [];
                    const totalScore = 100 + logs.reduce((sum, l) => sum + (l.score_change || 0), 0);
                    return {
                        id: s.id || '',
                        no: item.student_number || '-',
                        sid: s.student_id_card || '-',
                        name: `${s.prefix || ''}${s.first_name || ''} ${s.last_name || ''}`.trim() || 'ไม่ระบุชื่อ',
                        score: totalScore,
                        avatar: s.avatar_students_url || null,
                        raw: s
                    };
                });

                renderTable();

            } catch (err) {
                console.error('Error loading students:', err);
                document.getElementById('teacherBody').innerHTML = `
                    <tr><td colspan="5" class="text-center py-8 text-red-500 font-bold">
                        <i class="fas fa-exclamation-triangle mr-2"></i> เกิดข้อผิดพลาด: ${err.message}
                    </td></tr>
                `;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('teacherBody');
            if (!tbody) return;

            if ($.fn.DataTable.isDataTable('#teacherTable')) {
                $('#teacherTable').DataTable().destroy();
            }

            let html = '';
            studentData.forEach(s => {
                const scoreClass = s.score < 50 ? 'bg-red-100 text-red-600'
                    : (s.score >= 100 ? 'bg-green-100 text-green-700'
                        : 'bg-orange-100 text-orange-600');

                const avatarHtml = (typeof renderStudentAvatar === 'function')
                    ? renderStudentAvatar(s.raw || { avatar_students_url: s.avatar, first_name: s.name }, { size: 32, name: s.name, border: true })
                    : '';

                html += `
                    <tr class="hover:bg-blue-50/50 transition-colors border-b border-slate-50 cursor-pointer"
                        onclick="viewHistory('${s.id}')" title="คลิกเพื่อดูประวัติ">
                        <td class="py-3 px-4 text-center font-bold text-slate-600">${s.no}</td>
                        <td class="py-3 px-4">
                            <div class="flex items-center gap-3">
                                ${avatarHtml}
                                <span class="font-medium text-slate-600">${s.sid}</span>
                            </div>
                        </td>
                        <td class="py-3 px-4 font-bold text-blue-800">${s.name}</td>
                        <td class="py-3 px-4 text-center">
                            <span class="px-3 py-1.5 rounded-xl text-sm font-black ${scoreClass}">${s.score}</span>
                        </td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="event.stopPropagation(); viewHistory('${s.id}')"
                                    class="bg-white border border-blue-200 text-blue-600 px-4 py-1.5 rounded-xl text-xs font-bold hover:bg-blue-50 transition shadow-sm">
                                <i class="fas fa-eye mr-1"></i> ประวัติ
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;

            dataTable = $('#teacherTable').DataTable({
                responsive: true,
                pageLength: 25,
                lengthMenu: [[10, 25, 50, 100], [10, 25, 50, 100]],
                language: { url: 'https://cdn.datatables.net/plug-ins/2.3.7/i18n/th.json' },
                columnDefs: [
                    { responsivePriority: 1, targets: 2 },
                    { responsivePriority: 2, targets: 4 },
                    { responsivePriority: 3, targets: 0 }
                ],
                order: [[0, 'asc']]
            });
        }

        function viewHistory(id) {
            if (!id) return;
            window.location.href = `behavior_history.html?id=${id}`;
        }

        function exportTeacherExcel() {
            if (studentData.length === 0) {
                Swal.fire('ไม่มีข้อมูล', 'ไม่พบข้อมูลนักเรียนในห้องนี้', 'warning');
                return;
            }

            const exportData = studentData.map(s => ({
                'เลขที่': s.no,
                'เลขประจำตัว': s.sid,
                'ชื่อ-นามสกุล': s.name,
                'คะแนนปัจจุบัน': s.score
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const cols = Object.keys(exportData[0] || {}).map(key => ({ wch: Math.max(key.length * 2, 12) }));
            ws['!cols'] = cols;
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'คะแนนความประพฤติ');
            XLSX.writeFile(wb, `คะแนนความประพฤติ_ม.${myClassroom.grade_level}_${myClassroom.room_number}.xlsx`);

            logUserAction(`ส่งออก Excel ห้อง ม.${myClassroom.grade_level}/${myClassroom.room_number}`, 'behavior');

            Swal.fire({ icon: 'success', title: 'ส่งออก Excel สำเร็จ', timer: 1500, showConfirmButton: false });
        }

        function updateRoomDisplay() {
            if (!myClassroom) return;
            const el = document.getElementById('pageTitle');
            if (el) {
                el.innerHTML = `ครูที่ปรึกษา: <span id="my_room" class="text-red-600">ม.${myClassroom.grade_level}/${myClassroom.room_number}</span>`;
            }
        }

        window.viewHistory = viewHistory;
        window.exportTeacherExcel = exportTeacherExcel;
        window.updateRoomDisplay = updateRoomDisplay;

        console.log('✅ behavior_teacher loaded');
    </script>
</body>

</html>
