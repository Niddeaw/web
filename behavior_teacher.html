<!DOCTYPE html>
<html lang="th">

<head>
    <title>ครูที่ปรึกษา | ระบบงานปกครอง</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen pb-10">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-red-100 px-4 md:px-6 py-3 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" alt="Logo" class="w-10 h-10 object-contain hidden md:block">
            <div>
                <h1 class="font-bold text-red-900 leading-tight text-lg flex items-center gap-2">
                    <i class="fa-solid fa-gavel md:hidden"></i> ระบบงานปกครอง
                </h1>
                <div class="text-[10px] md:text-xs text-red-600 font-bold flex items-center gap-1">
                    ครูที่ปรึกษา: <span id="my_room" class="bg-red-100 px-2 py-0.5 rounded-full text-red-700">กำลังโหลด...</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <span id="user_display" class="text-sm font-bold text-slate-600 mr-2 hidden md:inline bg-slate-100 px-3 py-1 rounded-full"></span>

            <button id="btnAdminMode" onclick="window.location.href='behavior_admin.html'"
                class="hidden h-10 px-3 flex items-center justify-center rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-100 transition border border-purple-200 shadow-sm">
                <i class="fa-solid fa-user-shield sm:mr-1"></i> <span class="hidden sm:inline text-sm font-bold">โหมดแอดมิน</span>
            </button>

            <button onclick="window.location.href='index.html'"
                class="h-10 w-10 flex items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition border border-indigo-200 shadow-sm">
                <i class="fa-solid fa-house text-sm"></i>
            </button>
            <button onclick="logout()"
                class="bg-rose-50 text-rose-600 h-10 w-10 flex items-center justify-center rounded-xl hover:bg-rose-100 transition-colors shadow-sm">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-users text-red-600"></i> รายชื่อนักเรียนในความดูแล
            </h3>
            <button onclick="exportTeacherExcel()"
                class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-file-excel"></i> ส่งออกข้อมูล Excel
            </button>
        </div>

        <div class="glass p-6 rounded-3xl">
            <table id="teacherTable" class="w-full text-sm">
                <thead>
                    <tr>
                        <th class="py-3 px-4 text-left">เลขที่</th>
                        <th class="py-3 px-4 text-left">เลขประจำตัว</th>
                        <th class="py-3 px-4 text-left">ชื่อ-นามสกุล</th>
                        <th class="py-3 px-4 text-center">คะแนนปัจจุบัน</th>
                        <th class="py-3 px-4 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="teacherBody">
                    <tr><td colspan="5" class="text-center py-8 text-gray-400">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        let myClassroom = null;
        let studentData = [];

        $(document).ready(async () => { await checkAuth(); });

        async function checkAuth() {
            Swal.fire({ title: 'กำลังตรวจสอบ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.replace('index.html'); return; }

            const { data: profile } = await db.from('core_personnel').select('*').eq('id', session.user.id).single();
            const userDisplayName = `ครู${profile.first_name} ${profile.last_name}`;
            $('#user_display').html(`<i class="fas fa-user-tie mr-2 text-blue-500"></i>${userDisplayName}`);

            // รวบรวมสถานะ admin (ผู้ที่มีสิทธิ์เห็นปุ่มไปหน้าแอดมิน)
            let hasAdminRight = (profile.role === 'super_admin' || profile.role === 'admin');

            // --- 1. ตรวจสอบหัวหน้างานปกครอง (core_discipline_heads) ---
            const { data: sInfo } = await db.from('core_school_info').select('current_academic_year').single();
            if (sInfo?.current_academic_year) {
                const { data: discHead } = await db.from('core_discipline_heads')
                    .select('id')
                    .eq('personnel_id', session.user.id)
                    .eq('academic_year', sInfo.current_academic_year)
                    .maybeSingle();
                if (discHead) hasAdminRight = true;
            }

            // --- 2. ตรวจสอบหัวหน้าระดับ (behavior_grade_heads) ---
            const { data: gradeHead } = await db.from('behavior_grade_heads')
                .select('id')
                .eq('teacher_id', session.user.id)
                .maybeSingle();
            if (gradeHead) hasAdminRight = true;

            // แสดงปุ่มโหมดแอดมินถ้ามีสิทธิ์
            if (hasAdminRight) $('#btnAdminMode').removeClass('hidden').addClass('flex');

            // ดึงห้องที่ปรึกษา
            const { data: classroom } = await db.from('core_classrooms')
                .select('*')
                .or(`adviser_id_1.eq.${session.user.id},adviser_id_2.eq.${session.user.id}`)
                .single();

            if (!classroom) {
                if (hasAdminRight) {
                    // ❗️ มีสิทธิ์ admin แต่ไม่ใช่ครูที่ปรึกษา → ไปหน้าแอดมินโดยตรง ไม่มี popup
                    window.location.replace('behavior_admin.html');
                } else {
                    Swal.fire('ไม่พบสิทธิ์', 'คุณยังไม่ได้ถูกระบุเป็นครูที่ปรึกษา', 'info')
                        .then(() => window.location.replace('index.html'));
                }
                return;
            }

            myClassroom = classroom;
            $('#my_room').text(`ม.${classroom.grade_level}/${classroom.room_number}`);
            await loadMyStudents();
        }

        async function logout() {
            await db.auth.signOut();
            window.location.replace('index.html');
        }

        async function loadMyStudents() {
            const { data: enrolls } = await db.from('student_enrollments')
                .select(`student_number, core_students ( id, student_id_card, prefix, first_name, last_name, behavior_logs ( score_change ) )`)
                .eq('classroom_id', myClassroom.id).order('student_number', { ascending: true });

            if (enrolls) {
                studentData = enrolls.map(item => {
                    const s = item.core_students;
                    const totalScore = 100 + (s.behavior_logs?.reduce((sum, l) => sum + l.score_change, 0) || 0);
                    return { no: item.student_number || '-', sid: s.student_id_card || '-', name: `${s.prefix || ''}${s.first_name} ${s.last_name}`, score: totalScore, id: s.id };
                });
            }

            $('#teacherTable').DataTable({
                data: studentData.map(s => [
                    `<div class="text-center font-bold text-gray-600">${s.no}</div>`,
                    `<div class="font-medium text-gray-700">${s.sid}</div>`,
                    `<div class="font-bold text-blue-800">${s.name}</div>`,
                    `<div class="text-center"><span class="px-3 py-1 rounded-lg text-sm font-black ${s.score < 50 ? 'bg-red-100 text-red-600' : (s.score >= 100 ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-600')}">${s.score}</span></div>`,
                    `<div class="text-center"><button onclick="viewHistory('${s.id}')" class="bg-white border border-blue-200 text-blue-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-blue-50 transition shadow-sm"><i class="fas fa-eye"></i> ประวัติ</button></div>`
                ]),
                destroy: true,
                responsive: { details: { type: 'column', target: 'tr' } },
                columnDefs: [
                    { responsivePriority: 1, targets: 2 },
                    { responsivePriority: 2, targets: 4 },
                    { responsivePriority: 3, targets: 0 },
                ],
                language: { url: 'https://cdn.datatables.net/plug-ins/2.3.7/i18n/th.json' },
                pageLength: 50,
            });
            Swal.close();
        }

        function exportTeacherExcel() {
            if (studentData.length === 0) return;
            const exportData = studentData.map(s => ({ 'เลขที่': s.no, 'เลขประจำตัว': s.sid, 'ชื่อ-นามสกุล': s.name, 'คะแนนปัจจุบัน': s.score }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "คะแนนความประพฤติ");
            XLSX.writeFile(wb, `คะแนนความประพฤติ_ม.${myClassroom.grade_level}_${myClassroom.room_number}.xlsx`);
        }

        function viewHistory(id) { location.href = `student_history.html?id=${id}`; }
    </script>
</body>
</html>
