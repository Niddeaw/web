<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ครูที่ปรึกษา | ระบบงานปกครอง</title>
    <link rel="icon" href="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.7/css/dataTables.tailwindcss.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.tailwindcss.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="config.js"></script>

    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        div.dt-container { color: #475569 !important; }
        div.dt-container .dt-search input, div.dt-container .dt-length select { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; border-radius: 0.75rem !important; padding: 0.375rem 0.75rem !important; outline: none !important; }
        div.dt-container .dt-search input:focus { border-color: #ef4444 !important; box-shadow: 0 0 0 2px rgba(239,68,68,0.15) !important; }
        table.dataTable { border-bottom: none !important; }
        table.dataTable > thead > tr > th { background-color: #fef2f2 !important; color: #991b1b !important; border-bottom: 2px solid #fecaca !important; }
        table.dataTable > tbody > tr > td { background-color: #ffffff !important; border-bottom: 1px solid #f3f4f6 !important; }
        div.dt-container .dt-paging .dt-paging-button.current { background-color: #dc2626 !important; color: white !important; border: none !important; border-radius: 0.5rem !important; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-red-100 px-4 md:px-6 py-3 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" alt="Logo" class="w-10 h-10 object-contain hidden md:block">
            <div>
                <h1 class="font-bold text-red-900 leading-tight text-lg flex items-center gap-2">
                    <i class="fa-solid fa-gavel md:hidden"></i> ระบบงานปกครอง
                </h1>
                <div class="text-[10px] md:text-xs text-red-600 font-bold flex items-center gap-1">
                    ครูที่ปรึกษา: <span id="my_room" class="bg-red-100 px-2 py-0.5 rounded-full text-red-700">กำลังโหลด...</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <span id="user_display" class="text-sm font-bold text-slate-600 mr-2 hidden md:inline bg-slate-100 px-3 py-1 rounded-full"></span>
            
            <button id="btnAdminMode" onclick="window.location.href='behavior_admin.html'" class="hidden h-10 px-3 flex items-center justify-center rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-100 transition border border-purple-200 shadow-sm">
                <i class="fa-solid fa-user-shield sm:mr-1"></i> <span class="hidden sm:inline text-sm font-bold">โหมดแอดมิน</span>
            </button>

            <button onclick="window.location.href='index.html'" class="h-10 w-10 flex items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition border border-indigo-200 shadow-sm">
                <i class="fa-solid fa-house text-sm"></i>
            </button>
            <button onclick="logout()" class="bg-rose-50 text-rose-600 h-10 w-10 flex items-center justify-center rounded-xl hover:bg-rose-100 transition-colors shadow-sm">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-users text-red-600"></i> รายชื่อนักเรียนในความดูแล
            </h3>
            <button onclick="exportTeacherExcel()" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-file-excel"></i> ส่งออกข้อมูล Excel
            </button>
        </div>

        <div class="glass p-6 rounded-3xl">
            <table id="teacherTable" class="w-full text-sm display nowrap">
                <thead>
                    <tr>
                        <th class="py-3 px-4 text-left">เลขที่</th>
                        <th class="py-3 px-4 text-left">เลขประจำตัว</th>
                        <th class="py-3 px-4 text-left">ชื่อ-นามสกุล</th>
                        <th class="py-3 px-4 text-center">คะแนนปัจจุบัน</th>
                        <th class="py-3 px-4 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="teacherBody">
                    <tr><td colspan="5" class="text-center py-8 text-gray-400">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        let myClassroom = null;
        let studentData = [];

        $(document).ready(async () => { await checkAuth(); });

        async function checkAuth() {
            Swal.fire({ title: 'กำลังตรวจสอบ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.replace('index.html'); return; }

            const { data: profile } = await db.from('core_personnel').select('*').eq('id', session.user.id).single();
            
            // 🌟 แก้ไขแสดงชื่อ-นามสกุลเต็ม
            $('#user_display').text(`ครู${profile.first_name} ${profile.last_name}`);
            
            let isAdmin = (profile.role === 'super_admin');
            
            // เช็คสิทธิ์แอดมินระบบปกครอง
            const { data: modAdmin } = await db.from('core_module_admins').select('*').eq('user_id', session.user.id).eq('module_id', 'behavior').maybeSingle();
            if(modAdmin) isAdmin = true;
            
            // 🌟 เช็คสิทธิ์หัวหน้าระดับชั้น (ตรงนี้ที่หายไป)
            const { data: gradeHead } = await db.from('behavior_grade_heads').select('id').eq('teacher_id', session.user.id).maybeSingle();
            if(gradeHead) isAdmin = true;

            // ถ้ามีสิทธิ์ใดสิทธิ์หนึ่งข้างต้น ให้แสดงปุ่มโหมดแอดมิน
            if(isAdmin) $('#btnAdminMode').removeClass('hidden').addClass('flex');

            const { data: classroom } = await db.from('core_classrooms').select('*').or(`adviser_id_1.eq.${session.user.id},adviser_id_2.eq.${session.user.id}`).single();
            if (!classroom) {
                Swal.fire('ไม่พบสิทธิ์', 'คุณยังไม่ได้ถูกระบุเป็นครูที่ปรึกษา', 'info').then(() => window.location.replace('index.html'));
                return;
            }
            
            myClassroom = classroom;
            $('#my_room').text(`ม.${classroom.grade_level}/${classroom.room_number}`);
            await loadMyStudents();
        }

        async function logout() {
            await db.auth.signOut();
            window.location.replace('index.html');
        }

        async function loadMyStudents() {
            const { data: enrolls } = await db.from('student_enrollments')
                .select(`student_number, core_students ( id, student_id_card, prefix, first_name, last_name, behavior_logs ( score_change ) )`)
                .eq('classroom_id', myClassroom.id).order('student_number', { ascending: true });

            if(enrolls) {
                studentData = enrolls.map(item => {
                    const s = item.core_students;
                    const totalScore = 100 + (s.behavior_logs?.reduce((sum, l) => sum + l.score_change, 0) || 0);
                    return { no: item.student_number || '-', sid: s.student_id_card || '-', name: `${s.prefix || ''}${s.first_name} ${s.last_name}`, score: totalScore, id: s.id };
                });
            }

            $('#teacherTable').DataTable({
                data: studentData.map(s => [
                    `<div class="text-center font-bold text-gray-600">${s.no}</div>`, 
                    `<div class="font-medium text-gray-700">${s.sid}</div>`, 
                    `<div class="font-bold text-blue-800">${s.name}</div>`, 
                    `<div class="text-center"><span class="px-3 py-1 rounded-lg text-sm font-black ${s.score < 50 ? 'bg-red-100 text-red-600' : (s.score >= 100 ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-600')}">${s.score}</span></div>`,
                    `<div class="text-center"><button onclick="viewHistory('${s.id}')" class="bg-white border border-blue-200 text-blue-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-blue-50 transition shadow-sm"><i class="fas fa-eye"></i> ประวัติ</button></div>`
                ]),
                destroy: true, responsive: true, language: { url: 'https://cdn.datatables.net/plug-ins/2.3.7/i18n/th.json' }, pageLength: 50
            });
            Swal.close();
        }

        function exportTeacherExcel() {
            if(studentData.length === 0) return;
            const exportData = studentData.map(s => ({ 'เลขที่': s.no, 'เลขประจำตัว': s.sid, 'ชื่อ-นามสกุล': s.name, 'คะแนนปัจจุบัน': s.score }));
            const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "คะแนนความประพฤติ");
            XLSX.writeFile(wb, `คะแนนความประพฤติ_ม.${myClassroom.grade_level}_${myClassroom.room_number}.xlsx`);
        }

        function viewHistory(id) { location.href = `student_history.html?id=${id}`; }
    </script>
</body>
</html>
