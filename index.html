<body class="text-gray-800 min-h-screen flex flex-col relative opacity-0 transition-opacity duration-500" id="mainBody">

    <div id="portalView" class="hidden flex-1 flex flex-col z-10">

                <button onclick="changeMyPassword()"

                <button id="adminHelpdeskBtn" onclick="window.location.href='helpdesk_admin.html'"

                <button onclick="handleLogout()"

        <main class="flex-1 max-w-6xl mx-auto w-full p-6 py-10">

            <!-- ส่วนแสดงปฏิทินกิจกรรม (ปรับให้ความกว้างเท่ากับส่วนอื่น) -->
            <section class="mb-8">
                <div class="bg-white rounded-2xl shadow-sm p-6">
                    <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                        <h2 class="text-2xl font-bold text-gray-800 border-l-4 border-primary-600 pl-3">

                        <div class="flex gap-3 items-center bg-white p-2 rounded-xl shadow-sm border border-gray-200">
                            <select id="monthSelect" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">

                                class="border border-gray-300 rounded-lg px-3 py-2 text-sm"></select>
                            <button id="btnLoadCalendar"
                                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition">
                                <i class="fa-solid fa-calendar-alt mr-1"></i> แสดง

                    <div class="overflow-x-auto overflow-y-auto border border-gray-200 rounded-lg"
                        style="max-height: 300px;">
                        <table class="w-full text-left text-sm border-collapse relative">

            </section>

            <div
                class="flex flex-wrap gap-2 mb-8 bg-white/50 backdrop-blur-md p-2 rounded-2xl border border-white shadow-sm">
                <button onclick="switchMainTab('academic', this)"
                    class="main-tab-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-md">
                    <i class="fa-solid fa-book-open mr-2"></i> บริหารวิชาการ
                </button>
                <button onclick="switchMainTab('budget', this)"
                    class="main-tab-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-bold text-sm transition-all text-gray-600 hover:bg-white hover:text-blue-600 hover:shadow-sm">
                    <i class="fa-solid fa-coins mr-2"></i> บริหารงบประมาณ
                </button>
                <button onclick="switchMainTab('personnel', this)"
                    class="main-tab-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-bold text-sm transition-all text-gray-600 hover:bg-white hover:text-blue-600 hover:shadow-sm">
                    <i class="fa-solid fa-users mr-2"></i> บริหารงานบุคคล
                </button>
                <button onclick="switchMainTab('general', this)"
                    class="main-tab-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-bold text-sm transition-all text-gray-600 hover:bg-white hover:text-blue-600 hover:shadow-sm">
                    <i class="fa-solid fa-building mr-2"></i> บริหารทั่วไป

            <div id="appGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-10 text-gray-400"><i
                        class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i><br>กำลังดึงข้อมูลระบบ...
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="calendar_manager.js"></script>
    <script>
        // =======================================================
        // ส่วนแสดงปฏิทินกิจกรรม (ตาราง + ตัวกรองเดือน/ปี)
        // =======================================================
        let currentYear = new Date().getFullYear() + 543;  // ปี พ.ศ.
        let currentMonth = new Date().getMonth();  // 0-11

        function populateYearSelect() {
            const yearSelect = document.getElementById('yearSelect');
            if (!yearSelect) return;
            const startYear = 2569;
            const endYear = 2572;
            yearSelect.innerHTML = '';
            for (let y = startYear; y <= endYear; y++) {
                const option = document.createElement('option');
                option.value = y;
                option.textContent = y;
                if (y === currentYear) option.selected = true;
                yearSelect.appendChild(option);
            }
        }

        async function loadEventsByMonth() {
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            if (isNaN(year) || isNaN(month)) return;

            const tbody = document.getElementById('calendarEventsTableBody');
            if (!tbody) return;

            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>กำลังโหลด...</td></tr>';

            try {
                const events = await getEventsByMonthYear(year, month);

                if (!events.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">ไม่มีกิจกรรมในเดือนนี้</td></tr>';
                    return;
                }

                const deptNames = {
                    academic: 'กลุ่มวิชาการ',
                    budget: 'กลุ่มแผนงานและงบประมาณ',
                    personnel: 'กลุ่มบริหารงานบุคคล',
                    general: 'กลุ่มบริหารทั่วไป'
                };

                tbody.innerHTML = events.map(ev => {
                    let startDate = new Date(ev.start_date);
                    return `
                        <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                            <td class="py-3 px-4 whitespace-nowrap">${formatThaiDate(startDate)}</td>
                            <td class="py-3 px-4"><span class="px-2 py-1 text-xs rounded-full ${getDeptColorClass(ev.dept_key)}">${deptNames[ev.dept_key] || ev.dept_key}</span></td>
                            <td class="py-3 px-4 font-medium text-gray-800">${escapeHtml(ev.title)}</td>
                            <td class="py-3 px-4 text-gray-600">${DOMPurify ? DOMPurify.sanitize(ev.description || '-') : (ev.description || '-')}</td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-red-500">ไม่สามารถโหลดข้อมูลได้</td></tr>';
            }
        }

        function formatThaiDate(date) {
            if (!date || isNaN(date.getTime())) return '-';
            const day = date.getDate();
            const monthNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            const month = monthNames[date.getMonth()];
            const year = date.getFullYear() + 543;
            return `${day} ${month} ${year}`;
        }

        function getDeptColorClass(dept) {
            const colors = {
                academic: 'bg-blue-100 text-blue-700',
                budget: 'bg-green-100 text-green-700',
                personnel: 'bg-purple-100 text-purple-700',
                general: 'bg-orange-100 text-orange-700'
            };
            return colors[dept] || 'bg-gray-100 text-gray-700';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // =======================================================
        // ส่วนหลักของระบบ (การแสดงแอป, สิทธิ์ ฯลฯ)
        // =======================================================
        let currentUser = null;
        let activeModules = [];
        let userAdminModules = [];
        let currentCategory = 'academic';

        const ALL_APPS = [
            { id: 'guidance_teacher', category: 'academic', moduleId: 'guidance', title: 'ปพ.5 กิจกรรมแนะแนว', desc: 'บันทึกเวลาเรียน, ประเมินคุณลักษณะ', icon: 'fa-solid fa-compass', url: 'guidance_teacher.html', reqAdmin: false },
            { id: 'sdq_assessment', category: 'academic', moduleId: 'sdq', title: 'ระบบประเมิน SDQ', desc: 'คัดกรองจุดแข็งและจุดอ่อนนักเรียน 5 ด้าน', icon: 'fa-solid fa-clipboard-question', url: 'sdq_teacher.html' },
            { id: 'eq_assessment', category: 'academic', moduleId: 'eq', title: 'ระบบประเมิน EQ', desc: 'ประเมินความฉลาดทางอารมณ์ (ดี เก่ง สุข) ประจำภาคเรียน', icon: 'fa-solid fa-face-smile-beam', url: 'eq_admin.html' },
            { id: 'scholarship', category: 'academic', moduleId: 'scholarship', title: 'ระบบทุนการศึกษา', desc: 'จัดการแหล่งทุน เสนอชื่อนักเรียน และบันทึกการรับทุน', icon: 'fa-solid fa-hand-holding-dollar', url: 'scholarship.html' },
            { id: 'personnel', category: 'personnel', moduleId: 'personnel', title: 'ระบบบริหารจัดการบุคลากร', desc: 'ข้อมูลครูและบุคลากร, ตำแหน่ง, วิทยฐานะ และประวัติการทำงาน', icon: 'fa-solid fa-id-card', url: 'personnel.html' },
            { id: 'leave_system', category: 'personnel', moduleId: 'leave', title: 'ระบบการลา', desc: 'บันทึกและตรวจสอบประวัติการลาป่วย ลากิจ ของบุคลากร', icon: 'fa-solid fa-envelope-open-text', url: 'leave_teacher.html' },
            { id: 'attendance', category: 'general', moduleId: 'attendance', title: 'ระบบเช็คชื่อหน้าเสาธง', desc: 'บันทึกการมาเรียนประจำวัน สำหรับครูที่ปรึกษา', icon: 'fa-solid fa-clipboard-user', url: 'attendance_teacher.html' },
            { id: 'discipline', category: 'general', moduleId: 'behavior', title: 'ระบบงานปกครอง', desc: 'บันทึกพฤติกรรม, ตัดคะแนน, เพิ่มคะแนนของนักเรียน และสรุปข้อมูลพฤติกรรมประจำภาคเรียน', icon: 'fa-solid fa-gavel', url: 'behavior_teacher.html' },
            { id: 'homevisit', category: 'general', moduleId: 'homevisit', title: 'ระบบเยี่ยมบ้านนักเรียน', desc: 'บันทึกข้อมูล พิกัดที่อยู่อาศัย และสภาพแวดล้อมนักเรียน', icon: 'fa-solid fa-house-chimney-user', url: 'homevisit.html' },
        ];

        window.onload = async () => {
            await checkAuth();
            document.getElementById('mainBody').classList.replace('opacity-0', 'opacity-100');
        };

        async function checkAuth() {
            const { data: { session }, error } = await db.auth.getSession();
            if (error || !session) {
                window.location.replace('login.html');
                return;
            }

            document.getElementById('portalView').classList.remove('hidden');

            const { data: profile, error: profileError } = await db.from('core_personnel').select('*').eq('id', session.user.id).single();
            if (profileError || !profile) {
                await db.auth.signOut();
                Swal.fire('เซสชันไม่ถูกต้อง', 'ไม่พบข้อมูลบุคลากรในระบบ กรุณาล็อกอินใหม่อีกครั้ง', 'warning').then(() => {
                    window.location.replace('login.html');
                });
                return;
            }

            currentUser = profile;

            const { data: moduleAdmins } = await db.from('core_module_admins').select('module_id').eq('user_id', session.user.id);
            userAdminModules = moduleAdmins ? moduleAdmins.map(m => m.module_id) : [];

            const { data: allCustomModules } = await db.from('core_system_modules')
                .select('*')
                .order('display_order', { ascending: true });

            window.moduleOverrides = {};
            activeModules = [];
            if (allCustomModules) {
                allCustomModules.forEach(m => {
                    window.moduleOverrides[m.module_id] = m;
                    if (m.is_active) {
                        activeModules.push({
                            module_id: m.module_id,
                            is_active: m.is_active,
                            target_blank: m.target_blank
                        });
                    }
                });
            }
            updateUI();
            await checkCalendarAdminAccess();   // ✅ ตรวจสอบสิทธิ์ปุ่มจัดการปฏิทิน
            renderAppCards();
        }

        function handleLogout() {
            Swal.fire({ title: 'ออกจากระบบ?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626' })
                .then(async (result) => {
                    if (result.isConfirmed) {
                        localStorage.removeItem('activeMode');
                        await db.auth.signOut();
                        window.location.replace('login.html');
                    }
                });
        }

function updateUI() {
    if (!currentUser) return;
    document.getElementById('userName').innerText = `${currentUser.prefix || ''}${currentUser.first_name} ${currentUser.last_name}`;
    let roleText = 'ครูผู้สอน (Teacher)';
    
    if (currentUser.role === 'super_admin') {
        roleText = 'ผู้ดูแลสูงสุด (Super Admin)';
        document.getElementById('btnSuperAdmin').classList.remove('hidden');
        
        // เพิ่มบรรทัดนี้ลงไป เพื่อเปิดแสดงปุ่มศูนย์ช่วยเหลือบน Header
        document.getElementById('adminHelpdeskBtn').classList.remove('hidden'); 
        
    } else if (currentUser.role === 'admin') {
        roleText = 'ผู้ดูแลระบบย่อย (Module Admin)';
    }
    document.getElementById('userRole').innerText = roleText;
}

        // ตรวจสอบว่าผู้ใช้มีสิทธิ์เป็นแอดมินกลุ่มใด (แสดงปุ่มจัดการปฏิทิน)
        async function checkCalendarAdminAccess() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return;
            const managedDepts = await getUserManagedDepts(session.user.id);
            const btn = document.getElementById('calendarAdminBtn');
            if (btn && managedDepts.length > 0) {
                btn.classList.remove('hidden');
            } else if (btn) {
                btn.classList.add('hidden');
            }
        }

        function switchMainTab(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.main-tab-btn').forEach(btn => {
                btn.className = "main-tab-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-bold text-sm transition-all text-gray-600 hover:bg-white hover:text-blue-600 hover:shadow-sm";
            });
            btnElement.className = "main-tab-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-md";
            renderAppCards();
        }

        function renderAppCards() {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            const overrides = window.moduleOverrides || {};
            let appsToDisplay = [];

            ALL_APPS.forEach(app => {
                if (app.reqSuperAdmin && currentUser.role !== 'super_admin') return;
                const modOverride = overrides[app.moduleId];
                const finalApp = { ...app };
                if (modOverride) {
                    finalApp.icon = modOverride.icon || app.icon;
                    finalApp.iconBgColor = modOverride.icon_bg_color || '#e2e8f0';
                    finalApp.iconTextColor = modOverride.icon_text_color || '#4a5568';
                    finalApp.isActive = modOverride.is_active !== false && activeModules.some(m => m.module_id === app.moduleId && m.is_active);
                    finalApp.target_blank = modOverride.target_blank || false;
                    if (app.id === app.moduleId) {
                        finalApp.url = modOverride.url || app.url;
                        finalApp.desc = modOverride.description || app.desc;
                        finalApp.title = modOverride.module_name || app.title;
                    }
                } else {
                    finalApp.iconBgColor = '#e2e8f0';
                    finalApp.iconTextColor = '#4a5568';
                    finalApp.isActive = activeModules.some(m => m.module_id === app.moduleId && m.is_active);
                    finalApp.target_blank = false;
                }
                appsToDisplay.push(finalApp);
            });

            Object.values(overrides).forEach(mod => {
                if (ALL_APPS.some(app => app.moduleId === mod.module_id)) return;
                const newApp = {
                    id: mod.module_id,
                    category: mod.category || 'general',
                    moduleId: mod.module_id,
                    title: mod.module_name,
                    desc: mod.description || '',
                    icon: mod.icon || 'fa-solid fa-cube',
                    iconBgColor: mod.icon_bg_color || '#e2e8f0',
                    iconTextColor: mod.icon_text_color || '#4a5568',
                    url: mod.url || '#',
                    isActive: mod.is_active !== false,
                    reqAdmin: false,
                    reqSuperAdmin: false,
                    target_blank: mod.target_blank || false
                };
                appsToDisplay.push(newApp);
            });

            const appsToShow = appsToDisplay.filter(app => app.category === currentCategory);
            if (appsToShow.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-gray-400 font-medium border-2 border-dashed border-gray-200 rounded-2xl"><i class="fa-solid fa-box-open text-4xl mb-3 text-gray-300"></i><br>ยังไม่มีระบบในกลุ่มบริหารงานนี้</div>`;
                return;
            }

            appsToShow.forEach(app => {
                let isLocked = false;
                let lockReason = '';
                if (!app.isActive) {
                    isLocked = true;
                    lockReason = 'ปิดปรับปรุงระบบชั่วคราว';
                } else if (app.reqAdmin) {
                    const hasAccess = (currentUser.role === 'super_admin') || userAdminModules.includes(app.moduleId);
                    if (!hasAccess) {
                        isLocked = true;
                        lockReason = 'คุณไม่มีสิทธิ์เข้าถึงส่วนนี้';
                    }
                }

                const card = document.createElement('div');
                card.className = `app-card glass-panel rounded-2xl p-6 border ${isLocked ? 'locked border-gray-200 bg-gray-50' : 'border-gray-200 bg-white hover:border-blue-300 cursor-pointer'} flex flex-col h-full`;
                if (isLocked) {
                    card.onclick = () => Swal.fire('ไม่สามารถเข้าใช้งานได้', lockReason, 'warning');
                } else {
                    card.onclick = () => {
                        if (app.target_blank === true || app.target_blank === 'true') {
                            window.open(app.url, '_blank');
                        } else {
                            window.location.href = app.url;
                        }
                    };
                }

                let badgeHtml = '';
                if (isLocked) {
                    badgeHtml = `<span class="px-2.5 py-1 bg-gray-200 text-gray-600 text-[10px] font-bold rounded-full border border-gray-300 flex items-center gap-1"><i class="fa-solid fa-lock"></i> ${lockReason}</span>`;
                } else {
                    badgeHtml = `<span class="px-2.5 py-1 bg-green-50 text-green-600 text-[10px] font-bold rounded-full border border-green-200 flex items-center gap-1"><i class="fa-solid fa-circle text-[8px]"></i> เปิดใช้งาน</span>`;
                }
                const iconStyle = `background-color: ${app.iconBgColor}; color: ${app.iconTextColor};`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-14 h-14 rounded-2xl ${isLocked ? 'bg-gray-200 text-gray-400' : ''} flex items-center justify-center text-2xl shadow-inner" style="${isLocked ? '' : iconStyle}">
                            <i class="${app.icon}"></i>
                        </div>
                        ${badgeHtml}
                    </div>
                    <div class="flex-1">
                        <h3 class="text-lg font-bold text-gray-800 mb-1.5">${app.title}</h3>
                        <p class="text-sm text-gray-500 leading-relaxed">${app.desc}</p>
                    </div>
                    <div class="mt-5 pt-4 border-t border-gray-100 flex items-center text-sm font-bold ${isLocked ? 'text-gray-400' : 'text-blue-600 group-hover:text-blue-700'}">
                        ${isLocked ? 'ระบบถูกล็อก' : 'เข้าใช้งานระบบ <i class="fa-solid fa-arrow-right ml-1"></i>'}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function changeMyPassword() {
            const { value: formValues } = await Swal.fire({
                title: 'เปลี่ยนรหัสผ่าน',
                html: `
                    <div class="text-sm text-gray-500 mb-3">กรุณาตั้งรหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</div>
                    <input id="swal-pwd1" type="password" placeholder="รหัสผ่านใหม่" class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-3 outline-none focus:border-blue-500">
                    <input id="swal-pwd2" type="password" placeholder="ยืนยันรหัสผ่านใหม่อีกครั้ง" class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                confirmButtonText: 'อัปเดตรหัสผ่าน',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const p1 = document.getElementById('swal-pwd1').value;
                    const p2 = document.getElementById('swal-pwd2').value;
                    if (!p1 || p1.length < 6) Swal.showValidationMessage('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
                    else if (p1 !== p2) Swal.showValidationMessage('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
                    return p1;
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const { error } = await db.auth.updateUser({ password: formValues });
                if (error) {
                    Swal.fire('ผิดพลาด', error.message, 'error');
                } else {
                    Swal.fire({ icon: 'success', title: 'เปลี่ยนรหัสผ่านสำเร็จ!', text: 'ครั้งต่อไปกรุณาใช้รหัสผ่านใหม่นี้ในการเข้าสู่ระบบ' });
                }
            }
        }

        // เริ่มต้นส่วนปฏิทิน
        document.addEventListener('DOMContentLoaded', () => {
            populateYearSelect();
            document.getElementById('monthSelect').value = currentMonth;
            document.getElementById('btnLoadCalendar').addEventListener('click', loadEventsByMonth);
            loadEventsByMonth();
        });
    </script>
</body>

</html>
