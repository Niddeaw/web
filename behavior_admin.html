<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ระบบคะแนนความประพฤติ</title>
    <link rel="icon" href="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.7/css/dataTables.tailwindcss.css">
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.tailwindcss.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    
    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        /* DataTables Light Theme */
        div.dt-container { color: #475569 !important; }
        div.dt-container .dt-search input, div.dt-container .dt-length select {
            background-color: #ffffff !important; color: #374151 !important; border: 1px solid #d1d5db !important; border-radius: 0.75rem !important; padding: 0.375rem 0.75rem !important; outline: none !important;
        }
        div.dt-container .dt-search input:focus { border-color: #ef4444 !important; box-shadow: 0 0 0 2px rgba(239,68,68,0.15) !important; }
        table.dataTable { border-bottom: none !important; }
        table.dataTable > thead > tr > th { background-color: #fef2f2 !important; color: #991b1b !important; border-bottom: 2px solid #fecaca !important; }
        table.dataTable > tbody > tr > td { box-shadow: none !important; background-color: #ffffff !important; color: #374151 !important; border-bottom: 1px solid #f3f4f6 !important; }
        div.dt-container .dt-paging .dt-paging-button.current { background-color: #dc2626 !important; color: white !important; border: none !important; border-radius: 0.5rem !important; }
        
        /* Select2 Tailwind Override */
        .select2-container .select2-selection--single {
            height: 42px !important; border-color: #cbd5e1 !important; border-radius: 0.5rem !important; display: flex !important; align-items: center !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow { height: 40px !important; right: 8px !important; }
        .select2-container--default .select2-selection--single .select2-selection__rendered { color: #334155 !important; padding-left: 0.75rem !important; font-size: 0.875rem !important; }
        .select2-search__field { font-family: 'Anuphan', sans-serif !important; outline: none !important; }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-10">
    
    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-red-100 px-6 py-3 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" alt="Logo" class="w-10 h-10 object-contain">
            <div>
                <h1 class="font-bold text-red-900 leading-tight text-lg">ส่วนผู้ดูแลระบบ (Admin)</h1>
                <p class="text-[10px] text-red-600 uppercase tracking-widest">ระบบงานปกครอง</p>
            </div>
        </div>
<div class="flex items-center gap-2 md:gap-3">
            <span id="user_display" class="font-medium hidden md:inline text-sm text-slate-600 bg-slate-100 px-3 py-1 rounded-full"></span>
            
            <button id="btnAdminMode" onclick="window.location.href='แทนที่ด้วยชื่อไฟล์แอดมิน.html'" class="hidden h-10 px-3 flex items-center justify-center rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-100 transition border border-purple-200 shadow-sm" title="สลับโหมด">
                <i class="fa-solid fa-user-shield sm:mr-1"></i> <span class="hidden sm:inline text-sm font-bold">โหมดแอดมิน</span>
            </button>

            <button onclick="window.location.href='index.html'" class="h-10 w-10 flex items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition border border-indigo-200 shadow-sm" title="กลับหน้าหลัก">
                <i class="fas fa-house text-sm"></i>
            </button>

            <button onclick="logout()" class="bg-rose-50 text-rose-600 h-10 w-10 flex items-center justify-center rounded-xl hover:bg-rose-100 transition-colors focus:outline-none shadow-sm" title="ออกจากระบบ">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-4 mt-8 pb-12">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="glass p-6 rounded-3xl border-l-4 border-green-500 cursor-pointer hover:scale-105 transition" onclick="filterByScore('positive')">
                <p class="text-gray-500 text-sm font-bold">นักเรียนทำความดี</p>
                <h3 id="stat_positive" class="text-3xl font-black text-green-600 mt-2">0</h3>
            </div>
            <div class="glass p-6 rounded-3xl border-l-4 border-red-500 cursor-pointer hover:scale-105 transition" onclick="filterByScore('negative')">
                <p class="text-gray-500 text-sm font-bold">ผิดระเบียบ</p>
                <h3 id="stat_negative" class="text-3xl font-black text-red-600 mt-2">0</h3>
            </div>
            <div class="glass p-6 rounded-3xl border-l-4 border-blue-500 cursor-pointer hover:scale-105 transition" onclick="filterByScore('high')">
                <p class="text-gray-500 text-sm font-bold">คะแนน > 100</p>
                <h3 id="stat_high" class="text-3xl font-black text-blue-600 mt-2">0</h3>
            </div>
            <div class="glass p-6 rounded-3xl border-l-4 border-orange-500 cursor-pointer hover:scale-105 transition" onclick="filterByScore('low')">
                <p class="text-gray-500 text-sm font-bold">คะแนน < 50 (เสี่ยง)</p>
                <h3 id="stat_low" class="text-3xl font-black text-orange-600 mt-2">0</h3>
            </div>
        </div>

        <div class="flex flex-wrap gap-3 mb-6 items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="openRecordModal()" class="bg-red-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-red-700 transition shadow-md flex items-center gap-2">
                <i class="fas fa-plus-circle"></i> บันทึกความประพฤติ
            </button>
            <button onclick="exportTable()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-emerald-700 transition shadow-md flex items-center gap-2">
                <i class="fas fa-file-excel"></i> ส่งออก Excel
            </button>
            <button onclick="location.href='behavior_settings.html'" id="btn_settings" class="bg-slate-100 text-slate-700 border border-slate-300 px-5 py-2.5 rounded-xl font-bold hover:bg-slate-200 hidden transition flex items-center gap-2">
                <i class="fas fa-cog"></i> ตั้งค่าเกณฑ์
            </button>
            <button onclick="openGradeHeadModal()" id="btn_grade_head" class="bg-purple-50 text-purple-700 border border-purple-200 px-5 py-2.5 rounded-xl font-bold hover:bg-purple-100 hidden transition flex items-center gap-2">
                <i class="fas fa-user-tie"></i> ตั้งค่าหัวหน้าระดับ
            </button>
            
            <div class="ml-auto flex gap-2 w-full md:w-auto mt-3 md:mt-0">
                <input type="number" id="filter_score_val" class="border border-slate-300 rounded-xl px-4 py-2 text-sm w-32 outline-none focus:border-red-500" placeholder="ระบุคะแนน...">
                <button onclick="filterCustomScore('more')" class="bg-blue-50 text-blue-700 font-bold px-4 py-2 rounded-xl text-sm hover:bg-blue-100 border border-blue-200">มากกว่า</button>
                <button onclick="filterCustomScore('less')" class="bg-rose-50 text-rose-700 font-bold px-4 py-2 rounded-xl text-sm hover:bg-rose-100 border border-rose-200">น้อยกว่า</button>
            </div>
        </div>

        <div class="glass rounded-3xl p-6">
            <table id="studentTable" class="w-full text-sm display nowrap">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                        <th class="py-3 px-4 text-left">เลขประจำตัว</th>
                        <th class="py-3 px-4 text-left">ชื่อ-นามสกุล</th>
                        <th class="py-3 px-4 text-left">ชั้นเรียน</th>
                        <th class="py-3 px-4 text-center">คะแนนสุทธิ</th>
                        <th class="py-3 px-4 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="studentBody"></tbody>
            </table>
        </div>
    </main>

    <div id="recordModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 flex items-center"><i class="fas fa-edit mr-3 text-red-600"></i>บันทึกความประพฤติ</h2>
            <div class="space-y-4">
                <div class="relative">
                    <label class="block text-sm font-bold text-gray-700">ค้นหานักเรียน (เลขประจำตัว/ชื่อ)</label>
                    <input type="text" id="search_student" onkeyup="searchStudent(this.value)" class="w-full border-2 border-slate-200 rounded-xl p-3 mt-1 focus:border-red-500 outline-none transition" autocomplete="off" placeholder="พิมพ์เพื่อค้นหา...">
                    <div id="search_results" class="absolute z-10 w-full bg-white shadow-xl rounded-xl mt-1 hidden max-h-48 overflow-y-auto border border-slate-100"></div>
                    <input type="hidden" id="selected_student_id">
                </div>
                <div id="selected_student_info" class="p-3 bg-red-50 border border-red-100 rounded-xl hidden text-red-700 text-sm font-bold"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">รายการเกณฑ์</label>
                        <select id="criteria_select" onchange="updateDefaultScore()" class="w-full border-2 border-slate-200 rounded-xl p-3 mt-1 outline-none bg-white"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">ระบุคะแนน</label>
                        <input type="number" id="score_input" class="w-full border-2 border-slate-200 rounded-xl p-3 mt-1 outline-none text-center font-bold text-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">รายละเอียดเพิ่มเติม</label>
                    <textarea id="description_text" class="w-full border-2 border-slate-200 rounded-xl p-3 mt-1 outline-none" rows="2" placeholder="(ระบุหรือไม่ก็ได้)"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">รูปภาพหลักฐาน (ไม่เกิน 2MB)</label>
                    <input type="file" id="evidence_file" accept="image/*" class="w-full text-sm mt-1 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeRecordModal()" class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-gray-600 hover:bg-gray-200 transition-colors">ยกเลิก</button>
                    <button onclick="saveBehaviorRecord()" class="flex-1 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-700 shadow-md transition-colors">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <div id="gradeHeadModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[100] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-purple-50">
                <h2 class="text-lg font-bold text-purple-900"><i class="fas fa-user-tie mr-2"></i> ตั้งค่าหัวหน้าระดับชั้น</h2>
                <button onclick="closeGradeHeadModal()" class="text-slate-400 hover:text-rose-500 transition"><i class="fas fa-xmark text-2xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-slate-50">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row gap-4 items-end">
                    <div class="w-full sm:flex-1">
                        <label class="block text-sm font-bold text-slate-700 mb-1">เลือกบุคลากร (พิมพ์เพื่อค้นหา)</label>
                        <select id="grade_head_teacher" class="w-full select2-teacher">
                            <option value="">-- พิมพ์ชื่อครู --</option>
                        </select>
                    </div>
                    <div class="w-full sm:w-1/4">
                        <label class="block text-sm font-bold text-slate-700 mb-1">ระดับชั้น</label>
                        <select id="grade_head_level" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none h-[42px] bg-white">
                            <option value="1">ม.1</option>
                            <option value="2">ม.2</option>
                            <option value="3">ม.3</option>
                            <option value="4">ม.4</option>
                            <option value="5">ม.5</option>
                            <option value="6">ม.6</option>
                        </select>
                    </div>
                    <button onclick="saveGradeHead()" class="w-full sm:w-auto bg-purple-600 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-purple-700 transition shadow-sm h-[42px] flex items-center justify-center gap-2">
                        <i class="fas fa-plus"></i> เพิ่ม
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-purple-50 text-purple-800 border-b border-purple-100">
                            <tr>
                                <th class="p-4 font-bold">ระดับชั้น</th>
                                <th class="p-4 font-bold">ชื่อ - นามสกุล (หัวหน้าระดับ)</th>
                                <th class="p-4 text-center font-bold w-24">ถอดถอน</th>
                            </tr>
                        </thead>
                        <tbody id="grade_head_list" class="divide-y divide-slate-100">
                            <tr><td colspan="3" class="p-6 text-center text-slate-400">กำลังโหลด...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="behavior_admin.js"></script>
</body>
</html>
