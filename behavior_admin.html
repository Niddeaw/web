<!DOCTYPE html>
<html lang="th">

<head>
    <title>แอดมิน | ระบบงานปกครอง</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .ts-control {
            border-radius: 0.75rem !important;
            border: 2px solid #e2e8f0 !important;
            padding: 0.5rem 0.75rem !important;
        }
        .ts-dropdown {
            border-radius: 0.75rem !important;
            border: 1px solid #e2e8f0 !important;
        }
        .glass-card {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }
        .stat-card {
            transition: all 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="min-h-screen text-slate-800 pb-10 bg-slate-50">

    <!-- Navbar -->
    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-red-100 px-6 py-3 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" alt="Logo" class="w-10 h-10 object-contain">
            <div>
                <h1 class="font-bold text-red-900 leading-tight text-lg">ระบบงานปกครอง</h1>
                <p class="text-[10px] text-red-600 uppercase tracking-widest" id="role_label">ส่วนผู้ดูแลระบบ</p>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <span id="user_display" class="font-medium hidden md:inline text-sm text-slate-600 bg-slate-100 px-3 py-1 rounded-full">กำลังโหลด...</span>
            
            <!-- ✅ ปุ่มไป Dashboard (เพิ่ม id) -->
            <button id="btnDashboard" onclick="window.location.href='behavior_dashboard.html'" 
                    class="hidden h-10 px-4 flex items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 hover:bg-emerald-100 transition border border-emerald-200 shadow-sm">
                <i class="fa-solid fa-chart-pie sm:mr-1"></i> <span class="hidden sm:inline text-sm font-bold">แดชบอร์ด</span>
            </button>

            <button id="btn_settings" onclick="location.href='behavior_settings.html'"
                    class="hidden h-10 px-3 items-center justify-center rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100 transition border border-slate-200 shadow-sm"
                    title="ตั้งค่าระบบ">
                <i class="fas fa-cog sm:mr-1"></i> <span class="hidden sm:inline text-sm font-bold">ตั้งค่า</span>
            </button>
            <button onclick="window.location.href='index.html'"
                    class="h-10 w-10 flex items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition border border-indigo-200 shadow-sm">
                <i class="fas fa-house text-sm"></i>
            </button>
            <button onclick="logout()"
                    class="bg-rose-50 text-rose-600 h-10 w-10 flex items-center justify-center rounded-xl hover:bg-rose-100 transition-colors shadow-sm">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-4 mt-8 pb-12">

        <!-- 🔹 ปุ่มดำเนินการ -->
        <div class="flex flex-wrap gap-3 mb-6 items-center">
            <button onclick="openRecordModal('positive')"
                    class="bg-green-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-green-700 transition shadow-md flex items-center gap-2">
                <i class="fas fa-plus-circle"></i> เพิ่มคะแนน (ทำดี)
            </button>
            <button onclick="openRecordModal('negative')"
                    class="bg-rose-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-rose-700 transition shadow-md flex items-center gap-2">
                <i class="fas fa-minus-circle"></i> ตัดคะแนน (ผิดระเบียบ)
            </button>
            <button onclick="exportTable()"
                    class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-blue-700 transition shadow-md flex items-center gap-2">
                <i class="fas fa-file-excel"></i> ส่งออก Excel
            </button>
            <button onclick="exportSummary()"
                    class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-emerald-700 transition shadow-md flex items-center gap-2">
                <i class="fas fa-table"></i> ส่งออกสรุปคะแนน
            </button>
            <button id="btn_import_excel" onclick="importFromExcel()"
                    class="hidden bg-violet-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-violet-700 transition shadow-md flex items-center gap-2">
                <i class="fas fa-file-import"></i> นำเข้า (.xlsx)
            </button>
            <input type="file" id="excel_import_input" accept=".xlsx,.xls" class="hidden" onchange="handleExcelImport(this)">
        </div>

        <!-- 🔹 เลือกชั้นเรียน + ตัวกรองคะแนน -->
        <div class="glass-card rounded-2xl px-5 py-4 mb-4">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2 flex-1 min-w-[200px]">
                    <div class="flex items-center gap-2 text-slate-600 font-bold text-sm flex-shrink-0">
                        <i class="fas fa-door-open text-blue-500"></i> ห้องเรียน
                    </div>
                    <div class="flex-1 min-w-[120px]">
                        <select id="classroom_select" class="w-full">
                            <option value="">-- เลือกห้องเรียน --</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-bold text-slate-600 flex items-center gap-1 whitespace-nowrap">
                        <i class="fas fa-filter text-blue-500"></i> กรองคะแนน:
                    </span>
                    <input type="number" id="filter_score_val"
                        class="border-2 border-slate-200 rounded-xl px-3 py-2 text-sm w-28 outline-none focus:border-blue-500"
                        placeholder="ระบุคะแนน..." onkeyup="if(event.key === 'Enter') filterCustomScore('more')">
                    <button onclick="filterCustomScore('more')"
                        class="bg-blue-600 text-white font-bold px-3 py-2 rounded-xl text-sm hover:bg-blue-700 transition shadow-sm whitespace-nowrap">
                        <i class="fas fa-greater-than mr-1"></i> มากกว่า
                    </button>
                    <button onclick="filterCustomScore('less')"
                        class="bg-orange-500 text-white font-bold px-3 py-2 rounded-xl text-sm hover:bg-orange-600 transition shadow-sm whitespace-nowrap">
                        <i class="fas fa-less-than mr-1"></i> น้อยกว่า
                    </button>
                    <button onclick="resetFilter()"
                        class="bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl text-sm hover:bg-slate-300 transition whitespace-nowrap">
                        <i class="fas fa-undo-alt mr-1"></i> รีเซ็ต
                    </button>
                    <span id="filter_result_count" class="text-xs text-slate-400 ml-1"></span>
                </div>
            </div>
            <p class="text-[10px] text-slate-400 mt-2">เลือกห้องเพื่อแสดงรายชื่อ | คลิกการ์ดในหน้า Dashboard เพื่อกรองทั้งโรงเรียน</p>
        </div>

        <!-- 🔹 ตารางนักเรียนหลัก -->
        <div class="glass-card rounded-3xl p-4 md:p-6 overflow-x-auto shadow-sm border border-slate-100">
            <table id="studentTable" class="w-full text-sm display nowrap min-w-[600px]">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                        <th class="py-3 px-4 text-left">ชั้น</th>
                        <th class="py-3 px-4 text-left">เลขที่</th>
                        <th class="py-3 px-4 text-left">เลขประจำตัว</th>
                        <th class="py-3 px-4 text-left">ชื่อ-นามสกุล</th>
                        <th class="py-3 px-4 text-center">คะแนนสุทธิ</th>
                        <th class="py-3 px-4 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="studentBody"></tbody>
            </table>
        </div>

    </main>

    <!-- Modal บันทึกพฤติกรรม -->
    <div id="recordModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-2xl w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-bold mb-6 flex items-center" id="modalTitle">
                <i class="fas fa-edit mr-3 text-blue-600"></i>บันทึกความประพฤติ
            </h2>
            <div class="space-y-4">
                <div class="relative">
                    <label class="block text-sm font-bold text-gray-700">ค้นหานักเรียน (เลขประจำตัว/ชื่อ)</label>
                    <input type="text" id="search_student" onkeyup="searchStudent(this.value)"
                        class="w-full border-2 border-slate-200 rounded-xl p-3 mt-1 focus:border-red-500 outline-none transition"
                        autocomplete="off" placeholder="พิมพ์เพื่อค้นหา...">
                    <div id="search_results" class="absolute z-10 w-full bg-white shadow-xl rounded-xl mt-1 hidden max-h-48 overflow-y-auto border border-slate-100"></div>
                    <input type="hidden" id="selected_student_id">
                </div>
                <div id="selected_student_info" class="p-3 bg-red-50 border border-red-100 rounded-xl hidden text-red-700 text-sm font-bold flex justify-between items-center">
                    <span id="selected_student_name"></span>
                    <button onclick="clearSelectedStudent()" class="text-red-400 hover:text-red-600"><i class="fas fa-times-circle"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">รายการเกณฑ์</label>
                        <select id="criteria_select" onchange="updateDefaultScore()" class="w-full border-2 border-slate-200 rounded-xl p-3 mt-1 outline-none bg-white"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">ระบุคะแนน</label>
                        <input type="number" id="score_input" class="w-full border-2 border-slate-200 rounded-xl p-3 mt-1 outline-none text-center font-bold text-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">รายละเอียดเพิ่มเติม</label>
                    <textarea id="description_text" class="w-full border-2 border-slate-200 rounded-xl p-3 mt-1 outline-none" rows="2"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">อัปโหลดรูปภาพหลักฐาน (ย่อขนาดอัตโนมัติ)</label>
                    <input type="file" id="evidence_file" accept="image/*" class="w-full text-sm mt-1 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700">
                    <img id="evidence_preview" class="hidden mt-3 w-full max-h-40 object-contain rounded-lg border border-slate-200 bg-slate-50">
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeRecordModal()" class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-gray-600 hover:bg-gray-200">ยกเลิก</button>
                    <button onclick="saveBehaviorRecord()" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-md">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal ประวัติ -->
    <div id="historyModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 max-w-3xl w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-5">
                <div class="flex items-center gap-4">
                    <div id="historyAvatarWrap" class="hidden flex-shrink-0">
                        <img id="historyAvatar" src="" alt="รูปนักเรียน"
                            class="w-16 h-16 rounded-2xl object-cover border-2 border-slate-200 shadow-sm bg-slate-100 cursor-zoom-in hover:opacity-90 transition"
                            onclick="Swal.fire({ imageUrl: this.src, imageAlt: 'รูปนักเรียน', showConfirmButton: false, background: 'transparent', backdrop: 'rgba(0,0,0,0.85)', width: 'auto', padding: 0, customClass: { popup: 'rounded-2xl overflow-hidden shadow-2xl' } })"
                            onerror="this.closest('#historyAvatarWrap').classList.add('hidden')">
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <i class="fas fa-history text-blue-500"></i><span id="historyStudentName">-</span>
                        </h2>
                        <p class="text-sm text-slate-500 mt-1">คะแนนปัจจุบัน: <span id="historyStudentScore" class="font-black text-blue-700 text-lg ml-1">-</span></p>
                    </div>
                </div>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 text-xl w-9 h-9 flex items-center justify-center rounded-xl hover:bg-slate-100 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="overflow-x-auto rounded-2xl border border-slate-100">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase">
                            <th class="py-2 px-3 text-left font-bold">วันที่/เวลา</th>
                            <th class="py-2 px-3 text-left font-bold">รายการ</th>
                            <th class="py-2 px-3 text-center font-bold">คะแนน</th>
                            <th class="py-2 px-3 text-left font-bold">รายละเอียด / ผู้บันทึก</th>
                            <th class="py-2 px-3 text-center font-bold">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
            <div class="mt-5 flex justify-end">
                <button onclick="closeHistoryModal()" class="px-6 py-2.5 rounded-xl bg-slate-100 font-bold text-slate-600 hover:bg-slate-200 transition">
                    <i class="fas fa-times mr-1"></i> ปิด
                </button>
            </div>
        </div>
    </div>

    <script src="behavior_admin.js"></script>
</body>
</html>
