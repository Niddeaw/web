<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับทราบการลา - หัวหน้ากลุ่มสาระฯ | WRK System</title>

    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <script src="leave_core.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">

    <style>
        .btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; transition: all 0.15s; font-size: 12px; flex-shrink: 0; }
        .btn-icon:hover { transform: scale(1.1); }
        .dept-group-filter { border: 1px solid #e9d5ff; background: #faf5ff; color: #7e22ce; font-weight: 700; border-radius: 20px; height: 38px; padding: 0 14px; font-size: 13px; outline: none; }

        @media (max-width: 760px) {
            .d-sidebar { position: fixed !important; top: 0 !important; left: 0 !important; height: 100vh !important; width: 280px !important; max-width: 85vw !important; z-index: 1000 !important; transform: translateX(-100%) !important; transition: transform 0.3s ease-in-out !important; overflow-y: auto !important; box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
            .d-sidebar.open, .d-sidebar.show, .d-sidebar.active, .d-sidebar.is-open { transform: translateX(0) !important; }
            .d-overlay { display: none !important; position: fixed !important; inset: 0 !important; background: rgba(15,23,42,0.55) !important; backdrop-filter: blur(2px); z-index: 999 !important; opacity: 0; transition: opacity 0.3s ease; }
            .d-overlay.open, .d-overlay.show, .d-overlay.active, .d-overlay.is-open { display: block !important; opacity: 1; }
            .d-main { margin-left: 0 !important; padding-left: 0 !important; width: 100% !important; max-width: 100vw !important; }
            .d-app { display: block !important; }
            .d-menu { display: flex !important; align-items: center; justify-content: center; }
            .d-collapse { display: none !important; }
            .d-topbar { padding: 0 10px !important; gap: 6px !important; }
            .glass-panel { max-width: 100%; }
            .dept-group-filter { max-width: 140px; font-size: 11px; padding: 0 8px; }
        }
        @media (min-width: 761px) and (max-width: 1024px) {
            .d-sidebar { width: 240px; }
        }
    </style>
</head>

<body class="text-gray-800 min-h-screen opacity-0 transition-opacity duration-500" id="mainBody">
    <div class="d-app">
        <aside class="d-sidebar" id="dSidebar"></aside>
        <div class="d-overlay" id="dOverlay" onclick="toggleSidebar(false)"></div>

        <main class="d-main" id="dMain">
            <header class="d-topbar" id="dTopbar"></header>

            <div style="padding:0 0 12px;" class="space-y-6">

                <!-- Filter (Super Admin) -->
                <div id="deptHeadGroupFilterWrap" class="hidden flex justify-end">
                    <select id="deptHeadGroupFilter" onchange="onDeptHeadGroupChange()" class="dept-group-filter"></select>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass p-5 rounded-3xl border-b-4 border-b-amber-500">
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1"><i class="fas fa-clock text-amber-500 mr-1"></i> รอรับทราบ</p>
                        <h3 class="text-3xl font-black text-amber-600"><span id="stat-pending">0</span></h3>
                        <p class="text-xs text-slate-500 mt-1">รายการ</p>
                    </div>
                    <div class="glass p-5 rounded-3xl border-b-4 border-b-emerald-500">
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1"><i class="fas fa-check-circle text-emerald-500 mr-1"></i> รับทราบแล้ว</p>
                        <h3 class="text-3xl font-black text-emerald-600"><span id="stat-done">0</span></h3>
                        <p class="text-xs text-slate-500 mt-1">รายการ</p>
                    </div>
                    <div class="glass p-5 rounded-3xl border-b-4 border-b-blue-500">
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1"><i class="fas fa-users text-blue-500 mr-1"></i> ครูในกลุ่ม</p>
                        <h3 class="text-3xl font-black text-blue-600"><span id="stat-teachers">0</span></h3>
                        <p class="text-xs text-slate-500 mt-1">คน</p>
                    </div>
                    <div class="glass p-5 rounded-3xl border-b-4 border-b-rose-500">
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1"><i class="fas fa-calendar-day text-rose-500 mr-1"></i> ลาวันนี้</p>
                        <h3 class="text-3xl font-black text-rose-600"><span id="stat-today">0</span></h3>
                        <p class="text-xs text-slate-500 mt-1">คน</p>
                    </div>
                </div>

                <div class="glass rounded-3xl p-6">
                    <section id="tab-pending" class="tab-content">
                        <div class="w-full overflow-x-auto">
                            <table id="pendingTable" class="w-full text-left text-sm display nowrap">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600">
                                        <th class="text-center">วันที่ส่ง</th>
                                        <th>ชื่อครู</th>
                                        <th>ประเภท</th>
                                        <th>ช่วงวันที่ลา</th>
                                        <th class="text-center">วัน</th>
                                        <th>สาเหตุ</th>
                                        <th class="text-center w-32">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody id="tb-pending"></tbody>
                            </table>
                        </div>
                    </section>

                    <section id="tab-done" class="tab-content hidden">
                        <div class="w-full overflow-x-auto">
                            <table id="doneTable" class="w-full text-left text-sm display nowrap">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600">
                                        <th class="text-center">วันที่ส่ง</th>
                                        <th>ชื่อครู</th>
                                        <th>ประเภท</th>
                                        <th>ช่วงวันที่ลา</th>
                                        <th class="text-center">วัน</th>
                                        <th class="text-center">วันที่รับทราบ (แก้ไขได้)</th>
                                        <th class="text-center">สถานะใบลา</th>
                                    </tr>
                                </thead>
                                <tbody id="tb-done"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- viewLeaveModal -->
    <div id="viewLeaveModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center z-[70] p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-gradient-to-r from-purple-600 to-pink-600 rounded-t-2xl text-white flex-shrink-0">
                <h3 class="font-bold text-base flex items-center gap-2"><i class="fas fa-file-alt"></i> รายละเอียดใบลา</h3>
                <button onclick="closeViewModal()" class="w-8 h-8 rounded-xl bg-white/20 hover:bg-white/30 flex items-center justify-center transition"><i class="fas fa-times text-sm"></i></button>
            </div>
            <div id="viewLeaveContent" class="p-5 overflow-y-auto flex-1"><div class="text-center text-slate-400 py-8"><i class="fas fa-spinner fa-spin text-2xl"></i></div></div>
            <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2 flex-shrink-0"><button onclick="closeViewModal()" class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm transition">ปิด</button></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="dashboard_ui.js"></script>
    <script src="dashboard_sidebar.js"></script>
    <script src="leave_dept_head.js"></script>

    <script>
        function getLeaveDeptHeadFallbackConfig() {
            return {
                brand: {
                    logo: 'https://i.ibb.co/94wLv5v/WRK-PNG-200px.png',
                    name: 'WRK Dept Head',
                    subtitle: 'รับทราบการลาของครู'
                },
                mainMenuTitle: 'เมนูหลัก',
                mainMenuCollapsible: false,
                mainMenu: [
                    { id: 'btn-pending', icon: 'fa-clock', label: 'รอรับทราบ', onclick: "switchTab('pending')", class: 'active' },
                    { id: 'btn-done', icon: 'fa-check-circle', label: 'รับทราบแล้ว', onclick: "switchTab('done')" }
                ],
                showAllDepartments: false,
                departmentsTitle: '',
                departments: [],
                moduleMenus: [],
                footerMenuTitle: 'ระบบกลาง',
                footerCollapsible: false,
                footerMenu: [
                    { id: 'nav-home', icon: 'fa-house', label: 'กลับหน้าหลัก', href: 'index.html' }
                ],
                logoutItem: {
                    icon: 'fa-power-off',
                    label: 'ออกจากระบบ',
                    onclick: 'logout()',
                    class: 'logout'
                },
                facebook: {
                    href: 'https://www.facebook.com/WRKOfficial',
                    icon: 'fa-brands fa-facebook',
                    label: 'ติดตามเพจโรงเรียน'
                }
            };
        }

        initModuleSidebar({
            moduleKey: 'leave_dept_head',
            pageTitle: 'รับทราบการลา',
            activeId: 'btn-pending',
            topbarButtons: [
                {
                    id: 'btnNavTeacher',
                    html: '<i class="fas fa-chalkboard-user"></i><span>โหมดครู</span>',
                    onclick: "window.location.href='leave_teacher.html'",
                    class: 'hidden d-btn-mode teacher',
                    title: 'ไปหน้าโหมดครู'
                },
                {
                    id: 'btnNavAdmin',
                    html: '<i class="fas fa-user-shield"></i><span>โหมดแอดมิน</span>',
                    onclick: "window.location.href='leave_admin.html'",
                    class: 'hidden d-btn-mode admin',
                    title: 'ไปหน้าโหมดแอดมิน'
                }
            ],
            fallbackConfig: getLeaveDeptHeadFallbackConfig(),
            onReady: () => {
                if (typeof setTodayChip === 'function') setTodayChip();
                if (typeof window.refreshNavButtons === 'function') window.refreshNavButtons();
            }
        });
    </script>
</body>

</html>
