<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับทราบการลา - หัวหน้ากลุ่มสาระฯ | WRK System</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="leave_core.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            transition: all 0.15s;
            font-size: 12px;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body class="opacity-0 transition-opacity duration-300 pb-10 bg-slate-50" id="mainBody">

    <nav class="glass sticky top-0 z-40 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex justify-between h-16 items-center">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="h-10 w-auto" alt="Logo">
                <div>
                    <span
                        class="text-xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">WRK
                        Dept Head</span>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold hidden sm:block">
                        รับทราบการลาของครูในกลุ่ม</p>
                </div>
            </div>
            <div class="flex items-center gap-2 md:gap-3">
                <span id="display-name"
                    class="hidden md:block text-sm font-semibold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-full">กำลังโหลด...</span>
                <span id="dept-badge"
                    class="hidden md:block text-xs font-bold text-purple-600 bg-purple-50 border border-purple-200 px-3 py-1.5 rounded-full shadow-sm">กลุ่ม...</span>
                <button id="btnToggleMode" onclick="switchToTeacherMode()"
                    class="h-10 px-3 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 transition font-bold text-sm flex items-center gap-2 shadow-sm border border-rose-200"
                    title="สลับไปยังโหมดครู">
                    <i class="fas fa-chalkboard-user"></i>
                    <span class="hidden sm:inline">สลับไปโหมดครู</span>
                </button>
                <button onclick="window.location.href='index.html'"
                    class="h-10 w-10 flex items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition border border-indigo-200 shadow-sm"
                    title="กลับหน้าหลัก">
                    <i class="fas fa-house text-sm"></i>
                </button>
                <button onclick="logout()"
                    class="bg-red-50 text-red-600 h-10 w-10 flex items-center justify-center rounded-xl hover:bg-red-100 transition shadow-sm"
                    title="ออกจากระบบ">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass p-5 rounded-3xl border-b-4 border-b-amber-500">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1"><i
                        class="fas fa-clock text-amber-500 mr-1"></i> รอรับทราบ</p>
                <h3 class="text-3xl font-black text-amber-600"><span id="stat-pending">0</span></h3>
                <p class="text-xs text-slate-500 mt-1">รายการ</p>
            </div>
            <div class="glass p-5 rounded-3xl border-b-4 border-b-emerald-500">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1"><i
                        class="fas fa-check-circle text-emerald-500 mr-1"></i> รับทราบแล้ว</p>
                <h3 class="text-3xl font-black text-emerald-600"><span id="stat-done">0</span></h3>
                <p class="text-xs text-slate-500 mt-1">รายการ</p>
            </div>
            <div class="glass p-5 rounded-3xl border-b-4 border-b-blue-500">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1"><i
                        class="fas fa-users text-blue-500 mr-1"></i> ครูในกลุ่ม</p>
                <h3 class="text-3xl font-black text-blue-600"><span id="stat-teachers">0</span></h3>
                <p class="text-xs text-slate-500 mt-1">คน</p>
            </div>
            <div class="glass p-5 rounded-3xl border-b-4 border-b-rose-500">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1"><i
                        class="fas fa-calendar-day text-rose-500 mr-1"></i> ลาวันนี้</p>
                <h3 class="text-3xl font-black text-rose-600"><span id="stat-today">0</span></h3>
                <p class="text-xs text-slate-500 mt-1">คน</p>
            </div>
        </div>

        <div class="glass rounded-3xl p-6">
            <div class="flex gap-2 mb-4 border-b border-slate-100 pb-2">
                <button onclick="switchTab('pending')" id="btn-pending"
                    class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-amber-50 text-amber-700 border border-amber-200">
                    <i class="fas fa-clock mr-2"></i> รอรับทราบ
                </button>
                <button onclick="switchTab('done')" id="btn-done"
                    class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-500 hover:bg-slate-50 border border-transparent">
                    <i class="fas fa-check-circle mr-2"></i> รับทราบแล้ว
                </button>
            </div>

            <section id="tab-pending" class="tab-content">
                <div class="w-full">
                    <table id="pendingTable" class="w-full text-left text-sm display nowrap">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600">
                                <th class="text-center">วันที่ส่ง</th>
                                <th>ชื่อครู</th>
                                <th>ประเภท</th>
                                <th>ช่วงวันที่ลา</th>
                                <th class="text-center">วัน</th>
                                <th>สาเหตุ</th>
                                <th class="text-center w-32">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="tb-pending"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-done" class="tab-content hidden">
                <div class="w-full">
                    <table id="doneTable" class="w-full text-left text-sm display nowrap">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600">
                                <th class="text-center">วันที่ส่ง</th>
                                <th>ชื่อครู</th>
                                <th>ประเภท</th>
                                <th>ช่วงวันที่ลา</th>
                                <th class="text-center">วัน</th>
                                <th class="text-center">วันที่รับทราบ</th>
                                <th class="text-center">สถานะใบลา</th>
                            </tr>
                        </thead>
                        <tbody id="tb-done"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- View Leave Modal -->
    <div id="viewLeaveModal"
        class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center z-[70] p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div
                class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-gradient-to-r from-purple-600 to-pink-600 rounded-t-2xl text-white flex-shrink-0">
                <h3 class="font-bold text-base flex items-center gap-2"><i class="fas fa-file-alt"></i> รายละเอียดใบลา
                </h3>
                <button onclick="closeViewModal()"
                    class="w-8 h-8 rounded-xl bg-white/20 hover:bg-white/30 flex items-center justify-center transition"><i
                        class="fas fa-times text-sm"></i></button>
            </div>
            <div id="viewLeaveContent" class="p-5 overflow-y-auto flex-1">
                <div class="text-center text-slate-400 py-8"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
            </div>
            <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2 flex-shrink-0">
                <button onclick="closeViewModal()"
                    class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm transition">ปิด</button>
            </div>
        </div>
    </div>

    <script src="leave_dept_head.js"></script>
</body>

</html>
