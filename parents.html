<!DOCTYPE html>
<html lang="th">

<head>

    <title>ระบบผู้ปกครองเครือข่าย | WRK System</title>
    <!-- 1. โหลด Library ส่วนกลางทั้งหมดผ่านไฟล์เดียว -->
    <script src="core_head.js"></script>

    <!-- 2. โหลด Script และ CSS ที่เฉพาะเจาะจงสำหรับหน้านี้เท่านั้น -->
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">

    <script src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dependencies/JQL.min.js"></script>
    <script
        src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dependencies/typeahead.bundle.js"></script>
    <link rel="stylesheet"
        href="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dist/jquery.Thailand.min.css">
    <script
        src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dist/jquery.Thailand.min.js"></script>

    <style>
        body {
            background-color: #F8FAFC;
            font-family: 'Anuphan', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }


    </style>
</head>

<body class="text-slate-800 pb-10 opacity-0 transition-opacity duration-300" id="mainBody">

    <nav
        class="bg-white border border-slate-200 rounded-2xl mx-4 mt-4 p-4 sticky top-4 z-40 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-200">
                <i class="fas fa-users-between-lines text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-blue-900 uppercase tracking-tight">Parent Network</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Centralized School System</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-3">
            <button id="role-toggle-btn" onclick="toggleViewRole()"
                class="hidden px-3 py-2 bg-purple-50 text-purple-700 border border-purple-100 rounded-xl text-[11px] font-black uppercase tracking-tighter hover:bg-purple-100 transition-all">
                <i class="fas fa-sync-alt mr-1"></i> โหมดครู
            </button>

            <button id="admin-settings-btn" onclick="openAdminModal()"
                class="hidden w-10 h-10 bg-slate-50 hover:bg-slate-100 text-slate-500 rounded-xl flex items-center justify-center border border-slate-200 transition-all">
                <i class="fas fa-cog"></i>
            </button>

            <div class="h-8 w-px bg-slate-200 mx-1"></div>

            <div class="flex items-center gap-3">
                <div class="text-right hidden md:block">
                    <p class="text-xs font-bold text-slate-800 leading-none" id="userNameDisplay">Loading...</p>
                    <p class="text-[10px] text-slate-400 font-medium mt-1 uppercase" id="userRoleDisplay">Teacher</p>
                </div>
                <div
                    class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 border border-slate-200">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <button onclick="window.location.href='index.html'"
                class="w-10 h-10 bg-slate-50 hover:bg-red-50 hover:text-red-600 rounded-xl flex items-center justify-center text-slate-400 border border-slate-200 transition-all">
                <i class="fas fa-house-user"></i>
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-4 mt-6">

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <div class="lg:col-span-3 glass-card rounded-2xl p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="field-label">เลือกห้องเรียน</label>
                        <select id="select-classroom" placeholder="-- ค้นหาและเลือกห้องเรียน --">
                            <option value="">-- เลือกห้องเรียน --</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label">ปีการศึกษา / เทอม</label>
                        <div id="term-display"
                            class="px-4 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 font-bold text-sm uppercase tracking-tighter">
                            กำลังโหลด...</div>
                    </div>
                    <div class="flex items-end gap-2">
                        <button onclick="switchTab('form')"
                            class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all text-sm">
                            <i class="fas fa-pen mr-1"></i> กรอกฟอร์ม
                        </button>
                        <button onclick="switchTab('data')"
                            class="flex-1 bg-white text-slate-600 border border-slate-200 font-bold py-2.5 rounded-xl hover:bg-slate-50 transition-all text-sm">
                            <i class="fas fa-chart-bar mr-1"></i> ดูภาพรวม
                        </button>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-5 relative overflow-hidden flex flex-col justify-center">
                <i class="fas fa-check-circle absolute -right-4 -bottom-4 text-7xl text-slate-100"></i>
                <h2 class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">สถานะห้องที่เลือก</h2>
                <div id="status-badge" class="px-3 py-2 bg-slate-100 text-slate-500 rounded-xl text-center">
                    <p class="text-xs font-bold" id="status-text">ยังไม่เลือกห้องเรียน</p>
                </div>
            </div>
        </div>

        <div id="tab-form" class="animate-fade-in">
            <div class="glass-card rounded-2xl p-6">
                <div class="flex flex-wrap gap-2 mb-8" id="stepper"></div>

                <form id="network-form" onsubmit="saveNetworkData(event)">
                    <div id="form-container">
                        <div class="text-center py-20 text-slate-300">
                            <i class="fas fa-mouse-pointer text-5xl mb-4"></i>
                            <p class="font-bold uppercase tracking-widest text-xs">กรุณาเลือกห้องเรียนเพื่อดึงข้อมูล</p>
                        </div>
                    </div>

                    <div id="form-actions"
                        class="hidden flex justify-between items-center pt-6 border-t border-slate-100 mt-8">
                        <button type="button" onclick="prevStep()"
                            class="px-6 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-all text-sm">ย้อนกลับ</button>
                        <div class="flex gap-2">
                            <button type="button" onclick="clearRoomData()"
                                class="px-5 py-2.5 text-rose-500 font-bold rounded-xl hover:bg-rose-50 transition-all text-sm border border-transparent hover:border-rose-100">
                                <i class="fas fa-trash-alt mr-1"></i> ล้างข้อมูลห้องนี้
                            </button>
                            <button type="button" id="btn-next" onclick="nextStep()"
                                class="px-8 py-2.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all text-sm">ถัดไป</button>
                            <button type="submit" id="btn-submit"
                                class="hidden px-8 py-2.5 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 shadow-lg shadow-emerald-100 transition-all text-sm">
                                <i class="fas fa-save mr-1"></i> บันทึกข้อมูลทั้งหมด
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="tab-data" class="hidden animate-fade-in space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="dashboard-stats"></div>

            <div class="glass-card rounded-2xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black text-blue-900 uppercase tracking-tight text-sm"><i
                            class="fas fa-database mr-2"></i>Network Summary Table</h3>
                    <div class="flex gap-2">
                        <button onclick="exportToExcel()"
                            class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-emerald-100 transition-all uppercase">
                            <i class="fas fa-file-excel mr-1"></i> Export Excel
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table id="networkTable" class="w-full text-sm">
                        <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                            <tr>
                                <th class="py-4 px-4 text-left">ห้องเรียน</th>
                                <th class="py-4 px-4 text-left">ประธาน</th>
                                <th class="py-4 px-4 text-left">เบอร์โทรศัพท์</th>
                                <th class="py-4 px-4 text-center">ความสมบูรณ์</th>
                                <th class="py-4 px-4 text-right">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="tb-network" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="admin-modal"
        class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-zoom-in">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 uppercase tracking-tight"><i
                        class="fas fa-cogs mr-2 text-blue-600"></i>Admin System Settings</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600"><i
                        class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="field-label">Google API Link (Exec URL)</label>
                    <input type="text" id="set-api-url" class="field-input" placeholder="https://script.google.com/...">
                </div>
                <div>
                    <label class="field-label">Google Drive Folder ID</label>
                    <input type="text" id="set-folder-id" class="field-input" placeholder="1A2B3C...">
                </div>
                <div>
                    <label class="field-label">Google Slide Template ID</label>
                    <input type="text" id="set-slide-id" class="field-input" placeholder="1xyz...">
                </div>
                <div class="pt-4">
                    <button onclick="saveAdminSettings()"
                        class="w-full py-3 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">บันทึกการตั้งค่า</button>
                </div>
            </div>
        </div>
    </div>

    <script src="parents.js"></script>
</body>

</html>
