<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสมัครชุมนุม - นักเรียน (WRK System)</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans transition-colors duration-300">

    <nav class="glass-nav border border-slate-200 rounded-2xl mx-4 mt-4 p-4 sticky top-4 z-40 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-teal-600 p-2.5 rounded-xl text-white shadow-lg shadow-teal-200 flex items-center justify-center w-10 h-10">
                <i class="fa-solid fa-users text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-teal-900 uppercase tracking-tight hidden sm:block">ระบบเลือกกิจกรรมชุมนุม</h1>
                <h1 class="font-bold text-lg leading-tight text-teal-900 uppercase tracking-tight sm:hidden">กิจกรรมชุมนุม</h1>
                <p class="text-[11px] text-slate-500 font-bold tracking-widest">
                    <span id="term-info" class="text-teal-600"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> ปีการศึกษา กำลังโหลด...</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-3">
            <div class="text-right hidden md:block mr-2">
                <span id="user-display" class="block text-sm font-bold text-slate-500">
                    <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> กำลังโหลดข้อมูลนักเรียน...
                </span>
            </div>

            <button onclick="window.location.href='student_index.html'" class="h-10 w-10 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-200 transition border border-slate-200 shadow-sm" title="กลับหน้าหลัก">
                <i class="fas fa-house text-sm"></i>
            </button>

            <button onclick="logout()" class="h-10 w-10 flex items-center justify-center rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 hover:text-rose-700 transition border border-rose-200 shadow-sm" title="ออกจากระบบ">
                <i class="fas fa-sign-out-alt text-sm"></i>
            </button>
        </div>
    </nav>

    <main class="flex-1 mx-4 mt-6 mb-16 max-w-6xl w-full xl:mx-auto space-y-6">

        <div id="summary-section" class="hidden glass-panel rounded-2xl p-6 border-l-4 border-teal-500 shadow-sm border-t border-r border-b border-slate-100 fade-in">
            <div class="flex items-center gap-2 mb-4">
                <i class="fa-solid fa-circle-check text-2xl text-teal-500"></i>
                <h2 class="text-xl font-bold text-slate-800">สรุปการเลือกชุมนุมของคุณ</h2>
            </div>
            
            <div id="selected-club-details" class="text-slate-700 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100"></div>
            
            <div class="flex flex-wrap gap-3">
                <button id="btn-cancel-enroll" class="px-6 py-2.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-xl hover:bg-rose-100 font-bold transition-colors shadow-sm">
                    <i class="fa-solid fa-xmark mr-1"></i> ยกเลิกการเลือก
                </button>
                <button id="btn-final-confirm" class="px-6 py-2.5 bg-teal-600 text-white rounded-xl hover:bg-teal-700 font-bold shadow-md shadow-teal-500/20 transition-all active:scale-95">
                    <i class="fa-solid fa-lock mr-1"></i> ยืนยันสิทธิ์ (แก้ไขไม่ได้)
                </button>
            </div>
        </div>

        <div id="club-selection-area" class="glass-panel rounded-2xl p-6 shadow-sm border border-slate-200 fade-in">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 border-b border-slate-100 pb-4">
                <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-list-ul text-teal-600 mr-2"></i>รายการชุมนุมที่เปิดรับ</h2>
                
                <div class="w-full sm:w-auto relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-filter text-slate-400 text-sm"></i>
                    </div>
                    <select id="category-filter" class="w-full sm:w-64 pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none font-medium text-sm text-slate-700 appearance-none shadow-sm cursor-pointer">
                        <option value="all">ทุกหมวดหมู่</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-slate-400 text-sm"></i>
                    </div>
                </div>
            </div>

            <div id="clubs-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full py-12 text-center text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-teal-500"></i>
                    <p class="font-medium">กำลังโหลดรายชื่อชุมนุม...</p>
                </div>
            </div>
        </div>

    </main>

    <script src="club_student.js"></script>
    
    <script>
        async function logout() {
            const { isConfirmed } = await Swal.fire({
                title: 'ออกจากระบบ?',
                text: "คุณต้องการออกจากระบบใช่หรือไม่",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'ออกจากระบบ',
                cancelButtonText: 'ยกเลิก'
            });

            if (isConfirmed) {
                await db.auth.signOut();
                window.location.replace("login.html");
            }
        }
    </script>
</body>
</html>
