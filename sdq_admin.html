<!DOCTYPE html>
<html lang="th">
<head>
    <title>จัดการระบบ SDQ | WRK System Admin</title>
    <!-- ใช้ core_head.js และ style.css มาตรฐาน -->
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="mainBody" class="text-slate-800 flex h-screen overflow-hidden opacity-0 transition-opacity duration-300">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20 hidden md:flex transition-all duration-300">
        <div class="p-6 border-b border-slate-800 flex items-center gap-3 overflow-hidden whitespace-nowrap">
            <div class="bg-white p-1 rounded-lg shrink-0">
                <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="w-8 h-8 object-contain">
            </div>
            <div class="sidebar-text transition-opacity duration-300">
                <h1 class="text-lg font-bold text-white leading-tight">SDQ Admin</h1>
                <div class="text-[11px] text-slate-400">ระบบคัดกรองนักเรียน</div>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto overflow-x-hidden">
            <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-bold transition-all whitespace-nowrap">
                <i class="fa-solid fa-clipboard-list w-5 text-center text-lg shrink-0"></i> 
                <span class="sidebar-text">ข้อมูล SDQ รวม</span>
            </button>
            <button onclick="window.location.href='index.html'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 font-medium transition-all whitespace-nowrap">
                <i class="fa-solid fa-arrow-left w-5 text-center text-lg shrink-0"></i> 
                <span class="sidebar-text">กลับหน้าหลัก</span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
        <!-- Header -->
        <header class="glass px-6 py-4 shadow-sm border-b border-white/60 dark:border-slate-700 flex justify-between items-center z-10 transition-colors duration-300">
             <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="text-slate-500 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400 focus:outline-none transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h2 class="text-xl font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-clipboard-question text-indigo-500 mr-2"></i> ศูนย์ควบคุมระบบ SDQ</h2>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="db.auth.signOut().then(()=>location.reload())" class="text-sm font-bold text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-400 transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> ออกจากระบบ
                </button>
            </div>
        </header>

        <div class="p-6 overflow-y-auto flex-1">
            <div class="max-w-7xl mx-auto space-y-6">
                
                <!-- แดชบอร์ดสรุปภาพรวม -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                    <div class="glass-card p-5 rounded-2xl border-l-4 border-indigo-500 flex items-center gap-4">
                        <div class="h-12 w-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-2xl"><i class="fa-solid fa-users"></i></div>
                        <div>
                            <div class="text-slate-500 text-sm font-bold">ผู้ทำแบบประเมิน</div>
                            <div class="text-2xl font-black text-slate-800 dark:text-white" id="allCount">0</div>
                        </div>
                    </div>
                    <div class="glass-card p-5 rounded-2xl border-l-4 border-emerald-500 flex items-center gap-4">
                        <div class="h-12 w-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-2xl"><i class="fa-solid fa-face-smile"></i></div>
                        <div>
                            <div class="text-slate-500 text-sm font-bold">กลุ่มปกติ</div>
                            <div class="text-2xl font-black text-emerald-600" id="normalCount">0</div>
                        </div>
                    </div>
                    <div class="glass-card p-5 rounded-2xl border-l-4 border-amber-500 flex items-center gap-4">
                        <div class="h-12 w-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-2xl"><i class="fa-solid fa-face-meh"></i></div>
                        <div>
                            <div class="text-slate-500 text-sm font-bold">กลุ่มเสี่ยง</div>
                            <div class="text-2xl font-black text-amber-500" id="riskCount">0</div>
                        </div>
                    </div>
                    <div class="glass-card p-5 rounded-2xl border-l-4 border-rose-500 flex items-center gap-4">
                        <div class="h-12 w-12 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center text-2xl"><i class="fa-solid fa-face-frown"></i></div>
                        <div>
                            <div class="text-slate-500 text-sm font-bold">กลุ่มมีปัญหา</div>
                            <div class="text-2xl font-black text-rose-600" id="probCount">0</div>
                        </div>
                    </div>
                </div>

                <!-- เครื่องมือจัดการและตาราง -->
                <div class="glass-card p-6 rounded-2xl">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4 border-b border-slate-100 dark:border-slate-700 pb-4">
                        <div class="flex flex-wrap gap-4 w-full md:w-auto">
                            <div class="field-group flex-1 min-w-[150px]">
                                <label class="field-label text-slate-600 dark:text-slate-400">ระดับชั้น</label>
                                <select id="filterGrade" class="field-input select2-override"><option value="">ทั้งหมด</option></select>
                            </div>
                            <div class="field-group flex-1 min-w-[150px]">
                                <label class="field-label text-slate-600 dark:text-slate-400">ห้อง</label>
                                <select id="filterRoom" class="field-input select2-override"><option value="">ทั้งหมด</option></select>
                            </div>
                        </div>
                        <div class="flex gap-2 w-full md:w-auto">
                            <button onclick="importExcel()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-all flex items-center justify-center flex-1 md:flex-none">
                                <i class="fa-solid fa-file-import mr-2"></i> นำเข้า Offline
                            </button>
                            <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-all flex items-center justify-center flex-1 md:flex-none">
                                <i class="fa-solid fa-file-export mr-2"></i> ส่งออก (Excel)
                            </button>
                        </div>
                    </div>

                    <table id="adminTable" class="display responsive nowrap w-full" style="width:100%">
                        <thead>
                            <tr>
                                <th>ชั้น/ห้อง</th>
                                <th>เลขที่</th>
                                <th>รหัสนักเรียน</th>
                                <th>ชื่อ-สกุล</th>
                                <th>ผู้ประเมิน</th>
                                <th>คะแนนรวม</th>
                                <th>สถานะ</th>
                                <th>จัดการ</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="sdq_admin.js"></script>
    <script>
        // Toggle Sidebar Script (เพิ่มไว้ในไฟล์หลักหรือแยกไฟล์ได้)
        let isSidebarCollapsed = false;
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const texts = document.querySelectorAll('.sidebar-text');
            isSidebarCollapsed = !isSidebarCollapsed;
            if (isSidebarCollapsed) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                texts.forEach(txt => txt.classList.add('hidden'));
            } else {
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64');
                texts.forEach(txt => txt.classList.remove('hidden'));
            }
        }
        
        // Show Content Animation
        window.onload = () => {
            document.getElementById('mainBody').classList.replace('opacity-0', 'opacity-100');
        };
    </script>
</body>
</html>
