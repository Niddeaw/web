<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลักนักเรียน | WRK System</title>
    <link rel="icon" href="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png">

    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>

    <style>
        body {
            font-family: 'Anuphan', sans-serif;
            background: linear-gradient(135deg, #fdf4ff 0%, #eff6ff 50%, #f0fdf4 100%);
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .card-system {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card-system::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--card-color-from), var(--card-color-to));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s;
        }

        .card-system:hover::before {
            transform: scaleX(1);
        }

        .card-system:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
        }

        .card-system.locked {
            filter: grayscale(80%);
            opacity: 0.6;
            cursor: not-allowed;
        }

        .card-system.locked:hover {
            transform: none;
            box-shadow: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .float-icon {
            animation: float 3s ease-in-out infinite;
        }

        .swal2-popup {
            font-family: 'Anuphan', sans-serif !important;
            border-radius: 1.5rem !important;
        }
    </style>
</head>

<body class="min-h-screen pb-10">

    <!-- NAVBAR -->
    <nav class="glass sticky top-0 z-40 border-b border-white/60 shadow-sm px-4 py-3.5">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-500 to-purple-600 p-2 rounded-2xl shadow-lg">
                    <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="h-8 w-8 object-contain">
                </div>
                <div>
                    <p
                        class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 text-lg leading-tight">
                        พื้นที่นักเรียน
                    </p>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Student Portal</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div class="hidden sm:block text-right mr-2">
                    <p id="student-name" class="text-sm font-bold text-slate-700">กำลังโหลด...</p>
                    <p id="student-id" class="text-xs text-slate-400"></p>
                </div>

                <button onclick="handleLogout()"
                    class="h-10 px-4 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-sm shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="hidden sm:inline">ออกจากระบบ</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="max-w-6xl mx-auto px-4 py-8">

        <!-- Welcome Section -->
        <div class="glass rounded-3xl shadow-xl p-8 mb-8 relative overflow-hidden">
            <div
                class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-blue-400/20 to-purple-400/20 rounded-full filter blur-3xl">
            </div>
            <div
                class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-pink-400/20 to-yellow-400/20 rounded-full filter blur-3xl">
            </div>

            <div class="relative z-10 text-center">
                <div class="inline-block mb-4">
                    <div
                        class="h-20 w-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center shadow-xl float-icon">
                        <i class="fas fa-user-graduate text-white text-3xl"></i>
                    </div>
                </div>

                <h1
                    class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 mb-3">
                    ยินดีต้อนรับ! 🎉
                </h1>
                <p class="text-slate-600 text-base md:text-lg max-w-2xl mx-auto">
                    ระบบรวมศูนย์สำหรับนักเรียน เลือกใช้งานระบบต่างๆ ได้ตามต้องการ
                </p>
            </div>
        </div>

        <!-- Systems Grid -->
        <div class="mb-6">
            <div class="flex items-center gap-3 mb-6">
                <div class="h-1 flex-1 bg-gradient-to-r from-transparent via-slate-200 to-transparent rounded-full">
                </div>
                <h2 class="text-xl font-bold text-slate-700 flex items-center gap-2">
                    <i class="fas fa-th-large text-blue-600"></i>
                    ระบบที่เปิดใช้งาน
                </h2>
                <div class="h-1 flex-1 bg-gradient-to-r from-transparent via-slate-200 to-transparent rounded-full">
                </div>
            </div>
        </div>

        <div id="systems-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be generated here -->
        </div>

        <!-- Info Section -->
        <div class="mt-8 glass rounded-2xl p-6 border-l-4 border-blue-500">
            <div class="flex items-start gap-4">
                <div
                    class="h-10 w-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-info-circle"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 mb-1">คำแนะนำ</h3>
                    <p class="text-sm text-slate-600 leading-relaxed">
                        หากพบปัญหาในการใช้งานระบบใดๆ กรุณาติดต่อครูจิรศักดิ์ จิรสาโรช เพื่อขอความช่วยเหลือ
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStudent = null;
        let portalModules = [];

        // ✅ เพิ่ม Event Listener ตรงนี้
        window.addEventListener('load', async () => {
            await checkAuth();
        });

        async function checkAuth() {
            const studentId = localStorage.getItem('student_id');
            const studentName = localStorage.getItem('student_name');
            const studentSid = localStorage.getItem('student_sid');

            if (!studentId || !studentName) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณาเข้าสู่ระบบ',
                    text: 'คุณยังไม่ได้เข้าสู่ระบบ กรุณา Login ก่อนใช้งาน',
                    confirmButtonColor: '#3b82f6'
                }).then(() => {
                    window.location.href = 'login.html';
                });
                return;
            }

            // แสดงข้อมูลนักเรียน
            document.getElementById('student-name').textContent = studentName;
            document.getElementById('student-id').textContent = studentSid ? `รหัส: ${studentSid}` : '';

            // โหลดข้อมูลนักเรียนจาก DB (ไม่จำเป็นต้องใช้แล้ว ถ้าไม่แสดงที่อื่น)
            const { data: student } = await db.from('core_students')
                .select('*')
                .eq('id', studentId)
                .single();
            currentStudent = student;

            // โหลด modules จาก DB
            const { data: modules, error } = await db
                .from('student_portal_modules')
                .select('*')
                .eq('is_active', true)
                .order('display_order', { ascending: true });

            if (error) {
                console.error('Load modules error:', error);
                portalModules = [];
            } else {
                portalModules = modules || [];
            }

            renderSystems();
        }

        function renderSystems() {
            const grid = document.getElementById('systems-grid');
            grid.innerHTML = '';

            if (!portalModules || portalModules.length === 0) {
                grid.innerHTML = `
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fas fa-box-open text-5xl mb-4 text-slate-300"></i>
                <p class="text-lg font-bold">ยังไม่มีระบบที่เปิดใช้งาน</p>
                <p class="text-sm">กรุณาติดต่อครูจิรศักดิ์ จิรสาโรช</p>
            </div>`;
                return;
            }

            portalModules.forEach(mod => {
                const card = document.createElement('div');
                card.className = `card-system glass rounded-2xl p-6 border border-slate-200 cursor-pointer hover:border-slate-300`;
                card.onclick = () => {
                    if (mod.target_blank) {
                        window.open(mod.url, '_blank');
                    } else {
                        window.location.href = mod.url;
                    }
                };

                // ใช้ไอคอนจาก DB ถ้ามี, fallback เป็น default
                const icon = mod.icon || 'fa-solid fa-link';

                card.innerHTML = `
            <div class="flex items-start justify-between mb-4">
                <div class="h-14 w-14 rounded-2xl flex items-center justify-center shadow-lg"
     style="background-color: ${mod.icon_bg_color || '#3b82f6'}; color: ${mod.icon_text_color || '#ffffff'};">
                    <i class="${icon} text-2xl" style="color: ${mod.icon_text_color || '#ffffff'};"></i>
                </div>
                <span class="px-2.5 py-1 bg-emerald-100 text-emerald-600 text-[10px] font-bold rounded-full">
                    <i class="fas fa-circle text-[6px]"></i> เปิดใช้งาน
                </span>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">${mod.title}</h3>
            <p class="text-sm text-slate-600">${mod.description || ''}</p>
            <div class="pt-3 border-t border-slate-100 flex items-center text-xs font-bold text-blue-600">
                <i class="fas fa-arrow-right mr-1"></i> เข้าใช้งาน
            </div>
        `;
                grid.appendChild(card);
            });
        }

        // ฟังก์ชัน logout
        async function handleLogout() {
            const result = await Swal.fire({
                title: 'ออกจากระบบ?',
                text: 'คุณต้องการออกจากระบบใช่หรือไม่',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'ออกจากระบบ',
                cancelButtonText: 'ยกเลิก'
            });

            if (result.isConfirmed) {
                localStorage.removeItem('student_id');
                localStorage.removeItem('student_name');
                localStorage.removeItem('student_sid');

                Swal.fire({
                    icon: 'success',
                    title: 'ออกจากระบบแล้ว',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'login.html';
                });
            }
        }
    </script>
</body>

</html>
