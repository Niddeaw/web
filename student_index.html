    <script>
        let currentStudent = null;
        let portalModules = [];

        window.addEventListener('load', async () => {
            await checkAuth();
            setupPasswordToggle();
        });

        async function checkAuth() {
            const { data: { session }, error: sessionError } = await db.auth.getSession();

            if (!session) {
                Swal.fire({
                    icon: 'warning', title: 'กรุณาเข้าสู่ระบบ',
                    text: 'คุณยังไม่ได้เข้าสู่ระบบ กรุณา Login ก่อนใช้งาน', confirmButtonColor: '#3b82f6'
                }).then(() => { window.location.href = 'login.html'; });
                return;
            }

            const userEmail = session.user.email;
            const studentSid = userEmail.split('@')[0];

            // ดึงข้อมูลนักเรียน พร้อม enrollment และ classroom
            const { data: student, error: studentError } = await db
                .from('core_students')
                .select(`
            *,
            student_enrollments (
                academic_year,
                classroom_id,
                core_classrooms (
                    grade_level,
                    room_number
                )
            )
        `)
                .eq('student_id_card', studentSid)
                .single();

            if (studentError || !student) {
                await db.auth.signOut();
                Swal.fire({
                    icon: 'error', title: 'ไม่พบข้อมูลนักเรียน',
                    text: 'กรุณาติดต่อครูผู้ดูแลระบบ', confirmButtonColor: '#3b82f6'
                }).then(() => { window.location.href = 'login.html'; });
                return;
            }

            currentStudent = student;

            // ดึงปีการศึกษาปัจจุบัน (ถ้ามี)
            let currentAcademicYear = null;
            try {
                const { data: schoolInfo } = await db.from('core_school_info').select('current_academic_year').single();
                if (schoolInfo) currentAcademicYear = schoolInfo.current_academic_year;
            } catch (e) {
                console.warn('ไม่สามารถดึงข้อมูลปีการศึกษาปัจจุบันได้:', e);
            }

            // หาการลงทะเบียนที่ตรงกับปีการศึกษาปัจจุบัน หรือใช้ enrollment แรกสุด
            let currentEnrollment = null;
            if (student.student_enrollments && student.student_enrollments.length > 0) {
                if (currentAcademicYear) {
                    currentEnrollment = student.student_enrollments.find(e => e.academic_year == currentAcademicYear);
                }
                if (!currentEnrollment) {
                    currentEnrollment = student.student_enrollments[0]; // fallback
                }
            }

            // แสดงชื่อ-สกุล
            const fullName = `${student.prefix || ''}${student.first_name} ${student.last_name}`;
            document.getElementById('student-name').textContent = fullName;
            document.getElementById('hero-student-name').textContent = fullName;
            document.getElementById('student-id').textContent = `รหัส: ${studentSid}`;

            // ✅ แสดงชั้น/ห้อง
            const classroomEl = document.getElementById('student-classroom');
            if (classroomEl && currentEnrollment && currentEnrollment.core_classrooms) {
                const cls = currentEnrollment.core_classrooms;
                classroomEl.textContent = `ม.${cls.grade_level}/${cls.room_number}`;
                // ถ้าต้องการข้อความเต็ม เช่น "ชั้น ม.6 ห้อง 1" ใช้: `ชั้น ${cls.grade_level} ห้อง ${cls.room_number}`
            } else if (classroomEl) {
                classroomEl.textContent = ''; // เคลียร์หากไม่มีข้อมูล
            }

            // ดึงโมดูลพอร์ทัล
            const { data: modules, error: modulesError } = await db
                .from('student_portal_modules')
                .select('*')
                .eq('is_active', true)
                .order('display_order', { ascending: true });

            if (modulesError) {
                console.error('Load modules error:', modulesError);
                portalModules = [];
            } else {
                portalModules = modules || [];
            }

            renderSystems();
        }

        function renderSystems() {
            const grid = document.getElementById('systems-grid');
            grid.innerHTML = '';

            if (!portalModules.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-box-open text-4xl mb-3 block"></i>ยังไม่มีระบบที่เปิดใช้งาน</div>`;
                return;
            }

            portalModules.forEach((mod, index) => {
                const card = document.createElement('div');
                card.className = 'glass p-6 rounded-3xl shadow-sm border border-slate-200/70 hover:shadow-lg transition-all duration-300 group cursor-pointer relative overflow-hidden';
                card.setAttribute('data-aos', 'zoom-in-up');
                card.setAttribute('data-aos-delay', String(index * 50));
                card.onclick = () => {
                    if (mod.target_blank) window.open(mod.url, '_blank');
                    else window.location.href = mod.url;
                };

                const bgColor = mod.icon_bg_color || '#3b82f6';
                const textColor = mod.icon_text_color || '#ffffff';
                const iconClass = mod.icon || 'fa-solid fa-cube';

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="h-14 w-14 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-300"
                            style="background-color: ${bgColor};">
                            <i class="${iconClass} text-2xl" style="color: ${textColor};"></i>
                        </div>
                        <span class="px-2.5 py-1 bg-emerald-100 text-emerald-600 text-[10px] font-bold rounded-full flex items-center gap-1">
                            <i class="fas fa-circle text-[6px]"></i> เปิดใช้งาน
                        </span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2">${mod.title}</h3>
                    <p class="text-sm text-slate-600 leading-relaxed">${mod.description || ''}</p>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center text-xs font-bold text-blue-600">
                        <i class="fas fa-arrow-right mr-1"></i> เข้าใช้งาน
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function handleLogout() {
            const result = await Swal.fire({
                title: 'ออกจากระบบ?', text: 'คุณต้องการออกจากระบบใช่หรือไม่',
                icon: 'question', showCancelButton: true,
                confirmButtonColor: '#ef4444', cancelButtonColor: '#64748b',
                confirmButtonText: 'ออกจากระบบ', cancelButtonText: 'ยกเลิก'
            });

            if (result.isConfirmed) {
                await db.auth.signOut();
                Swal.fire({
                    icon: 'success', title: 'ออกจากระบบแล้ว',
                    timer: 1500, showConfirmButton: false
                }).then(() => { window.location.href = 'login.html'; });
            }
        }

        // 🌟 ---------------------------------------------------- 🌟
        // 🌟 โค้ดส่วนระบบเปลี่ยนรหัสผ่าน (อัปเดตใหม่ รองรับ Tailwind) 🌟
        // 🌟 ---------------------------------------------------- 🌟

        function setupPasswordToggle() {
            document.getElementById('togglePasswordBtn').addEventListener('click', function () {
                const pwdInput = document.getElementById('new_password');
                const eyeIcon = document.getElementById('eyeIcon');
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    pwdInput.type = 'password';
                    eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('new_password').value = '';
            document.getElementById('confirm_password').value = '';
        }

        // ====================================================
        // Avatar — GAS Upload (เหมือน pattern บุคลากร)
        // ====================================================

        let pendingAvatarUrl = null;   // URL รอบันทึก (จาก Drive หรือ link)
        let _pendingAvatarFile = null; // ไฟล์รออัพโหลด
        let _gasSettings = null;       // cache GAS settings

        async function loadGasSettings() {
            if (_gasSettings) return _gasSettings;
            const { data } = await db
                .from('core_school_info')
                .select('gas_avatar_api_url, gas_avatar_folder_id')
                .single();
            _gasSettings = data || {};
            return _gasSettings;
        }

        function openProfileModal() {
            if (!currentStudent) return;

            // ข้อมูล read-only
            document.getElementById('profile-student-id').textContent = currentStudent.student_id_card || '—';

            // input fields
            document.getElementById('profile-prefix').value    = currentStudent.prefix || '';
            document.getElementById('profile-firstname').value = currentStudent.first_name || '';
            document.getElementById('profile-lastname').value  = currentStudent.last_name || '';
            document.getElementById('profile-national-id').value = currentStudent.national_id || '';

            // Avatar reset
            pendingAvatarUrl    = null;
            _pendingAvatarFile  = null;
            _hideBadge();
            renderAvatarPreview(currentStudent.avatar_students_url || null);

            document.getElementById('avatar-url-section').classList.add('hidden');
            document.getElementById('avatar-url-input').value = '';

            document.getElementById('profileModal').classList.remove('hidden');

            // โหลด GAS settings ล่วงหน้า
            loadGasSettings();
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.add('hidden');
            pendingAvatarUrl   = null;
            _pendingAvatarFile = null;
            _hideBadge();
        }

        function renderAvatarPreview(url) {
            const img  = document.getElementById('avatar-img');
            const icon = document.getElementById('avatar-placeholder-icon');
            if (url) {
                img.src = url;
                img.classList.remove('hidden');
                icon.classList.add('hidden');
            } else {
                img.src = '';
                img.classList.add('hidden');
                icon.classList.remove('hidden');
            }
        }

        function _showBadge() {
            document.getElementById('avatar-upload-badge')?.classList.remove('hidden');
            document.getElementById('btn-upload-now')?.classList.remove('hidden');
        }
        function _hideBadge() {
            document.getElementById('avatar-upload-badge')?.classList.add('hidden');
            document.getElementById('btn-upload-now')?.classList.add('hidden');
        }

        // ── เลือกไฟล์ → preview + เก็บไว้รอ Upload ──
        function handleAvatarFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                return Swal.fire('แจ้งเตือน', 'กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'warning');
            }
            _pendingAvatarFile = file;

            // แสดง preview จาก local
            const reader = new FileReader();
            reader.onload = (e) => {
                renderAvatarPreview(e.target.result);
                _showBadge();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // ── Upload ทันทีไป Google Drive ──
        async function uploadAvatarNow() {
            if (!_pendingAvatarFile) {
                return Swal.fire('ไม่มีไฟล์', 'กรุณาเลือกรูปภาพก่อน', 'info');
            }
            const driveUrl = await _uploadFileToDrive(_pendingAvatarFile);
            if (driveUrl) {
                pendingAvatarUrl   = driveUrl;
                _pendingAvatarFile = null;
                renderAvatarPreview(driveUrl);
                _hideBadge();
                Swal.fire({ toast: true, position: 'bottom-end', icon: 'success',
                    title: 'อัพโหลดรูปสำเร็จ!', showConfirmButton: false, timer: 2000 });
            }
        }

        // ── Utility: resize ──
        function _resizeImageBlob(file, maxSize = 600) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let sc = maxSize / Math.max(img.width, img.height);
                        if (sc > 1) sc = 1;
                        canvas.width  = img.width  * sc;
                        canvas.height = img.height * sc;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
                    };
                };
                reader.readAsDataURL(file);
            });
        }

        function _blobToBase64(blob) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
            });
        }

        // ── Core upload to GAS ──
        async function _uploadFileToDrive(file) {
            const settings  = await loadGasSettings();
            const gasUrl    = settings.gas_avatar_api_url;
            const folderId  = settings.gas_avatar_folder_id;

            if (!gasUrl || !folderId) {
                Swal.fire({
                    icon: 'info', title: 'ยังไม่ตั้งค่าระบบอัพโหลด',
                    html: `<p class="text-sm text-slate-600">ผู้ดูแลระบบยังไม่ได้ตั้งค่า<br>
                           <b>GAS URL</b> และ <b>Folder ID</b> สำหรับเก็บรูปโปรไฟล์<br>
                           กรุณาติดต่อผู้ดูแลระบบ หรือใช้วิธี <b>วางลิงค์รูป</b> แทน</p>`,
                    confirmButtonText: 'รับทราบ'
                });
                return null;
            }

            Swal.fire({
                title: 'กำลังย่อและอัพโหลดรูป...', allowOutsideClick: false,
                showConfirmButton: false, didOpen: () => Swal.showLoading()
            });

            try {
                const resizedBlob = await _resizeImageBlob(file, 600);
                const base64Data  = await _blobToBase64(resizedBlob);

                const studentId = currentStudent.student_id_card || 'unknown';
                const fullName  = `${currentStudent.prefix || ''}${currentStudent.first_name || ''}_${currentStudent.last_name || ''}`.replace(/\s+/g, '_');
                const fileName  = `avatar_${fullName}_${studentId}_${Date.now()}.jpg`;

                const response = await fetch(gasUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        action:   'upload',   // ✅ ตรงกับ GAS doPost → handleUpload
                        base64:   base64Data,
                        fileName: fileName,
                        folderId: folderId
                    })
                });

                const resData = await response.json();

                if (resData.status === 'success') {
                    Swal.close();
                    // GAS คืน lh3.googleusercontent.com/d/{id} มาตรงๆ แล้ว
                    return resData.url;
                } else {
                    throw new Error(resData.message || 'GAS ตอบกลับผิดปกติ');
                }
            } catch (err) {
                Swal.close();
                console.error('Drive upload error:', err);
                Swal.fire('อัพโหลดไม่สำเร็จ', 'ตรวจสอบการเชื่อมต่อ GAS หรือสิทธิ์โฟลเดอร์<br><small>' + err.message + '</small>', 'error');
                return null;
            }
        }

        // ── วางลิงค์ URL ──
        function openAvatarUrlInput() {
            document.getElementById('avatar-url-section').classList.toggle('hidden');
        }

        function applyAvatarUrl() {
            const url = document.getElementById('avatar-url-input').value.trim();
            if (!url) return Swal.fire('แจ้งเตือน', 'กรุณากรอก URL รูปภาพ', 'warning');
            pendingAvatarUrl   = url;
            _pendingAvatarFile = null;
            renderAvatarPreview(url);
            _hideBadge();
            document.getElementById('avatar-url-section').classList.add('hidden');
        }

        function removeAvatar() {
            pendingAvatarUrl   = '__REMOVE__';
            _pendingAvatarFile = null;
            renderAvatarPreview(null);
            _hideBadge();
        }

        // ── บันทึกโปรไฟล์ทั้งหมด ──
        async function saveProfile() {
            const prefix     = document.getElementById('profile-prefix').value.trim();
            const firstName  = document.getElementById('profile-firstname').value.trim();
            const lastName   = document.getElementById('profile-lastname').value.trim();
            const nationalId = document.getElementById('profile-national-id').value.trim();

            if (!firstName) return Swal.fire('แจ้งเตือน', 'กรุณากรอกชื่อ', 'warning');
            if (!lastName)  return Swal.fire('แจ้งเตือน', 'กรุณากรอกนามสกุล', 'warning');
            if (nationalId && nationalId.length !== 13)
                return Swal.fire('แจ้งเตือน', 'เลขบัตรประชาชนต้องมี 13 หลัก', 'warning');

            // ถ้ายังมีไฟล์รออัพโหลดอยู่ → อัพก่อนบันทึก
            if (_pendingAvatarFile) {
                const driveUrl = await _uploadFileToDrive(_pendingAvatarFile);
                if (!driveUrl) return; // upload ล้มเหลว → หยุด
                pendingAvatarUrl   = driveUrl;
                _pendingAvatarFile = null;
                _hideBadge();
            }

            // คำนวณ avatarUrl สุดท้าย
            let avatarUrl = currentStudent.avatar_students_url ?? null;
            if (pendingAvatarUrl === '__REMOVE__')  avatarUrl = null;
            else if (pendingAvatarUrl !== null)     avatarUrl = pendingAvatarUrl;

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false,
                showConfirmButton: false, didOpen: () => Swal.showLoading() });

            const { error } = await db
                .from('core_students')
                .update({ prefix, first_name: firstName, last_name: lastName,
                          national_id: nationalId || null, avatar_students_url: avatarUrl })
                .eq('student_id_card', currentStudent.student_id_card);

            if (error) {
                return Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้: ' + error.message, 'error');
            }

            // อัพเดต local state
            Object.assign(currentStudent, {
                prefix, first_name: firstName, last_name: lastName,
                national_id: nationalId || null, avatar_students_url: avatarUrl
            });
            pendingAvatarUrl = null;

            // อัพเดต UI ชื่อ
            const fullName = `${prefix}${firstName} ${lastName}`;
            document.getElementById('student-name').textContent      = fullName;
            document.getElementById('hero-student-name').textContent = fullName;

            Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลสำเร็จ!', timer: 1500, showConfirmButton: false });
            closeProfileModal();
        }

        async function changeStudentPassword() {
            const newPassword = document.getElementById('new_password').value.trim();
            const confirmPassword = document.getElementById('confirm_password').value.trim();

            if (!newPassword || !confirmPassword) {
                return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบทั้ง 2 ช่อง', 'warning');
            }
            if (newPassword.length < 6) {
                return Swal.fire('แจ้งเตือน', 'กรุณาตั้งรหัสผ่านใหม่อย่างน้อย 6 ตัวอักษร', 'warning');
            }
            if (newPassword !== confirmPassword) {
                return Swal.fire('แจ้งเตือน', 'รหัสผ่านใหม่และช่องยืนยันไม่ตรงกัน', 'warning');
            }

            Swal.showLoading();

            const { data, error } = await db.auth.updateUser({
                password: newPassword
            });

            if (error) {
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเปลี่ยนรหัสผ่านได้: ' + error.message, 'error');
            } else {
                Swal.fire({
                    icon: 'success', title: 'สำเร็จ!',
                    text: 'เปลี่ยนรหัสผ่านเป็นของตัวเองเรียบร้อยแล้ว',
                    timer: 2000, showConfirmButton: false
                });
                closePasswordModal();
            }
        }
    </script>
