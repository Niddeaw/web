<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลักนักเรียน | WRK System</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome 7 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css">
    <!-- AOS Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>

<body class="min-h-screen pb-10">
    <script>
        AOS.init({ duration: 600, once: true });
    </script>

    <!-- NAVBAR -->
    <nav
        class="glass sticky top-0 z-40 border-b border-slate-200/60 dark:border-slate-700/40 shadow-sm backdrop-blur-xl px-4 py-3.5 transition-all duration-300">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-500 to-purple-600 p-2 rounded-2xl shadow-lg">
                    <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="h-8 w-8 object-contain">
                </div>
                <div>
                    <p
                        class="font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent text-lg leading-tight">
                        พื้นที่นักเรียน
                    </p>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Student Portal</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="hidden sm:block text-right mr-2">
                    <p id="student-name" class="text-sm font-bold text-slate-700 dark:text-slate-200">กำลังโหลด...</p>
                    <p id="student-id" class="text-xs text-slate-400"></p>
                </div>
                <button onclick="handleLogout()"
                    class="btn-primary flex items-center gap-2 h-10 px-4 rounded-xl text-sm shadow-md hover:shadow-lg transition-all">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span class="hidden sm:inline">ออกจากระบบ</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Welcome Section -->
        <div class="glass rounded-3xl shadow-xl p-8 mb-8 relative overflow-hidden" data-aos="fade-up">
            <div
                class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-blue-400/20 to-purple-400/20 rounded-full filter blur-3xl">
            </div>
            <div
                class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-pink-400/20 to-yellow-400/20 rounded-full filter blur-3xl">
            </div>
            <div class="relative z-10 text-center">
                <div class="inline-block mb-4">
                    <div
                        class="h-20 w-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center shadow-xl float-icon">
                        <i class="fa-solid fa-graduation-cap text-white text-3xl"></i>
                    </div>
                </div>
                <h1
                    class="text-3xl md:text-4xl font-black bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent mb-3">
                    ยินดีต้อนรับ! 🎉
                </h1>
                <p class="text-slate-600 dark:text-slate-300 text-base md:text-lg max-w-2xl mx-auto">
                    ระบบรวมศูนย์สำหรับนักเรียน เลือกใช้งานระบบต่างๆ ได้ตามต้องการ
                </p>
            </div>
        </div>

        <!-- Systems Grid -->
        <div class="mb-6" data-aos="fade-up" data-aos-delay="100">
            <div class="flex items-center gap-3 mb-6">
                <div class="h-1 flex-1 bg-gradient-to-r from-transparent via-slate-200/50 to-transparent rounded-full">
                </div>
                <h2 class="text-xl font-bold text-slate-700 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-th-large text-blue-600 dark:text-blue-400"></i>
                    ระบบที่เปิดใช้งาน
                </h2>
                <div class="h-1 flex-1 bg-gradient-to-r from-transparent via-slate-200/50 to-transparent rounded-full">
                </div>
            </div>
        </div>

        <div id="systems-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be generated here -->
        </div>

        <!-- Info Section -->
        <div class="mt-8 glass rounded-2xl p-6 border-l-4 border-blue-500" data-aos="fade-up" data-aos-delay="200">
            <div class="flex items-start gap-4">
                <div
                    class="h-10 w-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-circle-info"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 dark:text-white mb-1">คำแนะนำ</h3>
                    <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                        หากพบปัญหาในการใช้งานระบบใดๆ กรุณาติดต่อครูจิรศักดิ์ จิรสาโรช เพื่อขอความช่วยเหลือ
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStudent = null;
        let portalModules = [];

        // ✅ เพิ่ม Event Listener ตรงนี้
        window.addEventListener('load', async () => {
            await checkAuth();
        });

        async function checkAuth() {
            const studentId = localStorage.getItem('student_id');
            const studentName = localStorage.getItem('student_name');
            const studentSid = localStorage.getItem('student_sid');

            if (!studentId || !studentName) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณาเข้าสู่ระบบ',
                    text: 'คุณยังไม่ได้เข้าสู่ระบบ กรุณา Login ก่อนใช้งาน',
                    confirmButtonColor: '#3b82f6'
                }).then(() => {
                    window.location.href = 'login.html';
                });
                return;
            }

            // แสดงข้อมูลนักเรียน
            document.getElementById('student-name').textContent = studentName;
            document.getElementById('student-id').textContent = studentSid ? `รหัส: ${studentSid}` : '';

            // โหลดข้อมูลนักเรียนจาก DB (ไม่จำเป็นต้องใช้แล้ว ถ้าไม่แสดงที่อื่น)
            const { data: student } = await db.from('core_students')
                .select('*')
                .eq('id', studentId)
                .single();
            currentStudent = student;

            // โหลด modules จาก DB
            const { data: modules, error } = await db
                .from('student_portal_modules')
                .select('*')
                .eq('is_active', true)
                .order('display_order', { ascending: true });

            if (error) {
                console.error('Load modules error:', error);
                portalModules = [];
            } else {
                portalModules = modules || [];
            }

            renderSystems();
        }

        function renderSystems() {
            const grid = document.getElementById('systems-grid');
            grid.innerHTML = '';
            if (!portalModules.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">...</div>`;
                return;
            }
            portalModules.forEach(mod => {
                const card = document.createElement('div');
                card.className = `card-system glass rounded-2xl p-6 border border-slate-200/70 cursor-pointer transition-all duration-300`;
                card.setAttribute('data-aos', 'zoom-in-up');
                card.setAttribute('data-aos-delay', '50');
                card.onclick = () => {
                    if (mod.target_blank) {
                        window.open(mod.url, '_blank');
                    } else {
                        window.location.href = mod.url;
                    }
                };
                card.innerHTML = `
                <div class="flex items-start justify-between mb-4">
                    <div class="h-14 w-14 rounded-2xl flex items-center justify-center shadow-lg"
         style="background-color: ${mod.icon_bg_color || '#3b82f6'}; color: ${mod.icon_text_color || '#ffffff'};">
                        <i class="${icon} text-2xl" style="color: ${mod.icon_text_color || '#ffffff'};"></i>
                    </div>
                    <span class="px-2.5 py-1 bg-emerald-100 text-emerald-600 text-[10px] font-bold rounded-full">
                        <i class="fas fa-circle text-[6px]"></i> เปิดใช้งาน
                    </span>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">${mod.title}</h3>
                <p class="text-sm text-slate-600">${mod.description || ''}</p>
                <div class="pt-3 border-t border-slate-100 flex items-center text-xs font-bold text-blue-600">
                    <i class="fas fa-arrow-right mr-1"></i> เข้าใช้งาน
                </div>
            `; // ใช้โครงสร้างเดิม
                grid.appendChild(card);
            });
        }

        // ฟังก์ชัน logout
        async function handleLogout() {
            const result = await Swal.fire({
                title: 'ออกจากระบบ?',
                text: 'คุณต้องการออกจากระบบใช่หรือไม่',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'ออกจากระบบ',
                cancelButtonText: 'ยกเลิก'
            });

            if (result.isConfirmed) {
                localStorage.removeItem('student_id');
                localStorage.removeItem('student_name');
                localStorage.removeItem('student_sid');

                Swal.fire({
                    icon: 'success',
                    title: 'ออกจากระบบแล้ว',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'login.html';
                });
            }
        }
    </script>
</body>

</html>
