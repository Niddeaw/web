<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลักนักเรียน | WRK System</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>

<body class="min-h-screen pb-10 relative">
    <script>
        AOS.init({ duration: 600, once: true });
    </script>

    <nav class="glass sticky top-0 z-40 border-b border-slate-200/60 dark:border-slate-700/40 shadow-sm backdrop-blur-xl px-4 py-3.5 transition-all duration-300">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-500 to-purple-600 p-2 rounded-2xl shadow-lg">
                    <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="h-8 w-8 object-contain">
                </div>
                <div>
                    <p class="font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent text-lg leading-tight">
                        พื้นที่นักเรียน
                    </p>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Student Portal</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="hidden sm:block text-right mr-2">
                    <p id="student-name" class="text-sm font-bold text-slate-700 dark:text-slate-200">กำลังโหลด...</p>
                    <p id="student-id" class="text-xs text-slate-400"></p>
                </div>
                
                <button type="button" onclick="openPasswordModal()"
                    class="bg-amber-500 hover:bg-amber-600 text-white flex items-center gap-2 h-10 px-4 rounded-xl text-sm shadow-md hover:shadow-lg transition-all">
                    <i class="fa-solid fa-key"></i>
                    <span class="hidden sm:inline">เปลี่ยนรหัส</span>
                </button>

                <button onclick="handleLogout()"
                    class="btn-primary flex items-center gap-2 h-10 px-4 rounded-xl text-sm shadow-md hover:shadow-lg transition-all">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span class="hidden sm:inline">ออกจากระบบ</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="glass rounded-3xl shadow-xl p-8 mb-8 relative overflow-hidden" data-aos="fade-up">
            <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-blue-400/20 to-purple-400/20 rounded-full filter blur-3xl"></div>
            <div class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-pink-400/20 to-yellow-400/20 rounded-full filter blur-3xl"></div>
            <div class="relative z-10 text-center">
                <div class="inline-block mb-4">
                    <div class="h-20 w-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center shadow-xl float-icon">
                        <i class="fa-solid fa-graduation-cap text-white text-3xl"></i>
                    </div>
                </div>
                <h1 class="text-3xl md:text-4xl font-black bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent mb-3">
                    ยินดีต้อนรับ! 🎉
                </h1>
                <p class="text-slate-600 dark:text-slate-300 text-base md:text-lg max-w-2xl mx-auto">
                    ระบบรวมศูนย์สำหรับนักเรียน เลือกใช้งานระบบต่างๆ ได้ตามต้องการ
                </p>
            </div>
        </div>

        <div class="mb-6" data-aos="fade-up" data-aos-delay="100">
            <div class="flex items-center gap-3 mb-6">
                <div class="h-1 flex-1 bg-gradient-to-r from-transparent via-slate-200/50 to-transparent rounded-full"></div>
                <h2 class="text-xl font-bold text-slate-700 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-th-large text-blue-600 dark:text-blue-400"></i>
                    ระบบที่เปิดใช้งาน
                </h2>
                <div class="h-1 flex-1 bg-gradient-to-r from-transparent via-slate-200/50 to-transparent rounded-full"></div>
            </div>
        </div>

        <div id="systems-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

        <div class="mt-8 glass rounded-2xl p-6 border-l-4 border-blue-500" data-aos="fade-up" data-aos-delay="200">
            <div class="flex items-start gap-4">
                <div class="h-10 w-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-circle-info"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 dark:text-white mb-1">คำแนะนำ</h3>
                    <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                        หากพบปัญหาในการใช้งานระบบใดๆ กรุณาติดต่อครูจิรศักดิ์ จิรสาโรช เพื่อขอความช่วยเหลือ
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div id="passwordModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-all">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl shadow-2xl p-6 mx-4 border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-5">
                <h5 class="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                    <i class="fas fa-lock text-amber-500"></i> ตั้งรหัสผ่านใหม่
                </h5>
                <button type="button" onclick="closePasswordModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
                    <div class="relative">
                        <input type="password" id="new_password" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-700 dark:text-white" placeholder="ระบุรหัสผ่านใหม่ที่ต้องการ">
                        <button type="button" id="togglePasswordBtn" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">ยืนยันรหัสผ่านใหม่อีกครั้ง</label>
                    <input type="password" id="confirm_password" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-700 dark:text-white" placeholder="กรอกรหัสผ่านใหม่อีกครั้งให้ตรงกัน">
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                <button type="button" onclick="closePasswordModal()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 font-bold transition-all">ยกเลิก</button>
                <button type="button" onclick="changeStudentPassword()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-md">บันทึกรหัสผ่าน</button>
            </div>
        </div>
    </div>

    <script>
        let currentStudent = null;
        let portalModules = [];

        window.addEventListener('load', async () => {
            await checkAuth();
            setupPasswordToggle(); // เรียกใช้งานปุ่มเปิดปิดตา
        });

        async function checkAuth() {
            const { data: { session }, error: sessionError } = await db.auth.getSession();

            if (!session) {
                Swal.fire({
                    icon: 'warning', title: 'กรุณาเข้าสู่ระบบ',
                    text: 'คุณยังไม่ได้เข้าสู่ระบบ กรุณา Login ก่อนใช้งาน', confirmButtonColor: '#3b82f6'
                }).then(() => { window.location.href = 'login.html'; });
                return;
            }

            const userEmail = session.user.email;
            const studentSid = userEmail.split('@')[0];

            const { data: student, error: studentError } = await db
                .from('core_students')
                .select('*')
                .eq('student_id_card', studentSid)
                .single();

            if (studentError || !student) {
                await db.auth.signOut();
                Swal.fire({
                    icon: 'error', title: 'ไม่พบข้อมูลนักเรียน',
                    text: 'กรุณาติดต่อครูผู้ดูแลระบบ', confirmButtonColor: '#3b82f6'
                }).then(() => { window.location.href = 'login.html'; });
                return;
            }

            currentStudent = student;

            const fullName = `${student.prefix || ''}${student.first_name} ${student.last_name}`;
            document.getElementById('student-name').textContent = fullName;
            document.getElementById('student-id').textContent = `รหัส: ${studentSid}`;

            const { data: modules, error: modulesError } = await db
                .from('student_portal_modules')
                .select('*')
                .eq('is_active', true)
                .order('display_order', { ascending: true });

            if (modulesError) {
                console.error('Load modules error:', modulesError);
                portalModules = [];
            } else {
                portalModules = modules || [];
            }

            renderSystems();
        }

        function renderSystems() {
            const grid = document.getElementById('systems-grid');
            grid.innerHTML = '';

            if (!portalModules.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-box-open text-4xl mb-3 block"></i>ยังไม่มีระบบที่เปิดใช้งาน</div>`;
                return;
            }

            portalModules.forEach((mod, index) => {
                const card = document.createElement('div');
                card.className = 'glass p-6 rounded-3xl shadow-sm border border-slate-200/70 hover:shadow-lg transition-all duration-300 group cursor-pointer relative overflow-hidden';
                card.setAttribute('data-aos', 'zoom-in-up');
                card.setAttribute('data-aos-delay', String(index * 50));
                card.onclick = () => {
                    if (mod.target_blank) window.open(mod.url, '_blank');
                    else window.location.href = mod.url;
                };

                const bgColor = mod.icon_bg_color || '#3b82f6';
                const textColor = mod.icon_text_color || '#ffffff';
                const iconClass = mod.icon || 'fa-solid fa-cube';

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="h-14 w-14 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-300"
                            style="background-color: ${bgColor};">
                            <i class="${iconClass} text-2xl" style="color: ${textColor};"></i>
                        </div>
                        <span class="px-2.5 py-1 bg-emerald-100 text-emerald-600 text-[10px] font-bold rounded-full flex items-center gap-1">
                            <i class="fas fa-circle text-[6px]"></i> เปิดใช้งาน
                        </span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2">${mod.title}</h3>
                    <p class="text-sm text-slate-600 leading-relaxed">${mod.description || ''}</p>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center text-xs font-bold text-blue-600">
                        <i class="fas fa-arrow-right mr-1"></i> เข้าใช้งาน
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function handleLogout() {
            const result = await Swal.fire({
                title: 'ออกจากระบบ?', text: 'คุณต้องการออกจากระบบใช่หรือไม่',
                icon: 'question', showCancelButton: true,
                confirmButtonColor: '#ef4444', cancelButtonColor: '#64748b',
                confirmButtonText: 'ออกจากระบบ', cancelButtonText: 'ยกเลิก'
            });

            if (result.isConfirmed) {
                await db.auth.signOut();
                Swal.fire({
                    icon: 'success', title: 'ออกจากระบบแล้ว',
                    timer: 1500, showConfirmButton: false
                }).then(() => { window.location.href = 'login.html'; });
            }
        }

        // 🌟 ---------------------------------------------------- 🌟
        // 🌟 โค้ดส่วนระบบเปลี่ยนรหัสผ่าน (อัปเดตใหม่ รองรับ Tailwind) 🌟
        // 🌟 ---------------------------------------------------- 🌟

        // ฟังก์ชันเปิด-ปิดตา
        function setupPasswordToggle() {
            document.getElementById('togglePasswordBtn').addEventListener('click', function() {
                const pwdInput = document.getElementById('new_password');
                const eyeIcon = document.getElementById('eyeIcon');
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    pwdInput.type = 'password';
                    eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        }

        // เปิด Modal
        function openPasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        // ปิด Modal และล้างค่า
        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('new_password').value = '';
            document.getElementById('confirm_password').value = '';
        }

        // บันทึกรหัสผ่าน
        async function changeStudentPassword() {
            const newPassword = document.getElementById('new_password').value.trim();
            const confirmPassword = document.getElementById('confirm_password').value.trim();

            if (!newPassword || !confirmPassword) {
                return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบทั้ง 2 ช่อง', 'warning');
            }
            if (newPassword.length < 6) {
                return Swal.fire('แจ้งเตือน', 'กรุณาตั้งรหัสผ่านใหม่อย่างน้อย 6 ตัวอักษร', 'warning');
            }
            if (newPassword !== confirmPassword) {
                return Swal.fire('แจ้งเตือน', 'รหัสผ่านใหม่และช่องยืนยันไม่ตรงกัน', 'warning');
            }

            Swal.showLoading();

            const { data, error } = await db.auth.updateUser({
                password: newPassword
            });

            if (error) {
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเปลี่ยนรหัสผ่านได้: ' + error.message, 'error');
            } else {
                Swal.fire({
                    icon: 'success', title: 'สำเร็จ!',
                    text: 'เปลี่ยนรหัสผ่านเป็นของตัวเองเรียบร้อยแล้ว',
                    timer: 2000, showConfirmButton: false
                });
                closePasswordModal(); // สั่งปิด Modal 
            }
        }
    </script>
</body>

</html>
