<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบนักเรียน | WRK System</title>
    <link rel="icon" href="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Anuphan', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full border border-slate-100">
        <div class="text-center mb-8">
            <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="h-20 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-slate-800">เช็คคะแนนความประพฤติ</h1>
            <p class="text-slate-500 text-sm">กรุณาระบุข้อมูลเพื่อเข้าสู่ระบบ</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">เลขประจำตัวนักเรียน (5 หลัก)</label>
                <input type="text" id="std_id" maxlength="5" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 ring-blue-500 transition" placeholder="xxxxx">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">เลขบัตรประจำตัวประชาชน (13 หลัก)</label>
                <input type="password" id="id_card" maxlength="13" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 ring-blue-500 transition" placeholder="xxxxxxxxxxxxx">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition">
                เข้าสู่ระบบ
            </button>
        </div>
        <p class="text-center mt-6 text-[10px] text-slate-400">© 2026 WRK System Project - All Rights Reserved</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        async function handleLogin() {
            const sid = $('#std_id').val();
            const idc = $('#id_card').val();

            if(!sid || !idc) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ', 'warning');

            Swal.fire({ title: 'กำลังตรวจสอบ...', didOpen: () => Swal.showLoading() });

            // ตรวจสอบจากตาราง core_students โดยตรง
            const { data, error } = await supabase
                .from('core_students')
                .select('id, first_name, last_name')
                .eq('student_id_card', sid)
                .eq('id_card_number', idc) // **อย่าลืมเพิ่ม Column id_card_number ใน Table ด้วยนะครับ**
                .single();

            if (data) {
                localStorage.setItem('student_id', data.id);
                localStorage.setItem('student_name', `${data.first_name} ${data.last_name}`);
                window.location.href = 'behavior_student.html';
            } else {
                Swal.fire('ไม่พบข้อมูล', 'เลขประจำตัวหรือเลขบัตรประชาชนไม่ถูกต้อง', 'error');
            }
        }
    </script>
</body>
</html>
