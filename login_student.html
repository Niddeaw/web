<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบนักเรียน | WRK System</title>
    <link rel="icon" href="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>body { font-family: 'Anuphan', sans-serif; background: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-xl max-w-sm w-full border border-white">
        <div class="text-center mb-8">
            <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="h-20 mx-auto mb-4 drop-shadow-md">
            <h1 class="text-2xl font-bold text-blue-900">เช็คคะแนนความประพฤติ</h1>
            <p class="text-slate-500 text-sm mt-1">สำหรับนักเรียน โรงเรียนวัดไร่ขิงวิทยา</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">เลขประจำตัวนักเรียน (Username)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-user text-slate-400"></i>
                    </div>
                    <input type="text" id="std_id" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 bg-white/50 transition-all" placeholder="ระบุเลข 5 หลัก">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">เลขประจำตัวประชาชน (Password)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-id-card text-slate-400"></i>
                    </div>
                    <input type="password" id="id_card" class="w-full pl-10 pr-12 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 bg-white/50 transition-all" placeholder="ระบุเลข 13 หลัก">
                    
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-blue-600 transition-colors outline-none">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            
            <button onclick="handleStudentLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl mt-4 shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
            </button>
            
            <div class="relative flex items-center py-2">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-medium uppercase tracking-widest">หรือ</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>
            
            <button onclick="window.location.href='index.html'" class="w-full bg-slate-50 border border-slate-200 hover:bg-slate-100 text-slate-600 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
                <i class="fas fa-chalkboard-teacher"></i> สำหรับคุณครู (Admin)
            </button>
        </div>
        <p class="text-center mt-6 text-[10px] text-slate-400">© 2026 WRK System Project</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // 🌟 ฟังก์ชันสลับแสดง/ซ่อนรหัสผ่าน
        function togglePassword() {
            const input = document.getElementById('id_card');
            const icon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash', 'text-blue-500');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash', 'text-blue-500');
                icon.classList.add('fa-eye');
            }
        }

        async function handleStudentLogin() {
            const sid = $('#std_id').val().trim();
            const idc = $('#id_card').val().trim();
            
            if(!sid || !idc) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบทั้ง 2 ช่อง', 'warning');

            Swal.fire({ title: 'กำลังตรวจสอบ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

            const { data, error } = await db.from('core_students')
                .select('id, prefix, first_name, last_name')
                // เปลี่ยนจาก id_card_number เป็น national_id
                .eq('student_id_card', sid).eq('national_id', idc).maybeSingle();

            if (data) {
                localStorage.setItem('student_id', data.id);
                localStorage.setItem('student_name', `${data.prefix || ''}${data.first_name} ${data.last_name}`);
                localStorage.setItem('student_sid', sid);
                window.location.href = 'behavior_student.html'; 
            } else {
                Swal.fire('ไม่พบข้อมูล', 'รหัสนักเรียนหรือเลขประจำตัวประชาชนไม่ถูกต้อง', 'error');
            }
        }
        
        // ให้กด Enter เพื่อล็อกอินได้
        $('#id_card').keypress(function(e) {
            if(e.which == 13) handleStudentLogin();
        });
    </script>
</body>
</html>
