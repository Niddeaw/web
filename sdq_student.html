<!DOCTYPE html>
<html lang="th">
<head>
    <title>ประเมิน SDQ | WRK System</title>
    <!-- ใช้ core_head.js และ style.css มาตรฐาน -->
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen pb-10 text-slate-800 transition-opacity duration-300 opacity-0" id="mainBody">

    <!-- Navbar สไตล์ Glass -->
    <nav class="glass sticky top-0 z-40 border-b border-white/60 shadow-sm px-4 py-3.5">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-2 rounded-2xl shadow-lg">
                    <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="h-8 w-8 object-contain">
                </div>
                <div>
                    <p class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 text-lg leading-tight">
                        ระบบประเมิน SDQ
                    </p>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Student Portal</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                 <div id="userInfoDisplay" class="hidden sm:block text-sm font-bold text-slate-700 text-right">กำลังโหลด...</div>
                 <button onclick="window.location.href='student_index.html'" class="h-10 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-all flex items-center gap-2">
                    <i class="fas fa-home"></i><span class="hidden sm:inline">หน้าหลัก</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Header Section (Optional) -->
        <div class="glass rounded-3xl shadow-xl p-8 mb-8 relative overflow-hidden text-center" id="welcomeSection">
             <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-indigo-400/20 to-purple-400/20 rounded-full filter blur-3xl"></div>
             <div class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-pink-400/20 to-yellow-400/20 rounded-full filter blur-3xl"></div>
             <div class="relative z-10">
                 <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-2">แบบประเมินจุดแข็งและจุดอ่อน (SDQ)</h1>
                 <p class="text-slate-600">กรุณาตอบแบบสอบถามตามความเป็นจริง เพื่อเป็นข้อมูลในการดูแลช่วยเหลือนักเรียน</p>
             </div>
        </div>

        <!-- หน้าเลือกบทบาท -->
        <div id="roleSelection" class="transition-all">
            <h2 class="section-header justify-center text-lg mb-6"><i class="fa-solid fa-user-check"></i> กรุณาเลือกผู้ทำแบบประเมิน</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl mx-auto">
                <button onclick="startSDQ('student')" class="glass-card flex flex-col items-center justify-center p-8 border-2 border-transparent hover:border-indigo-400 hover:shadow-xl transition-all group rounded-3xl relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-indigo-50 to-purple-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="relative z-10 flex flex-col items-center">
                        <div class="h-20 w-20 bg-indigo-100 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-user-graduate text-4xl text-indigo-600"></i>
                        </div>
                        <span class="text-xl font-bold text-slate-800">นักเรียนประเมินตนเอง</span>
                    </div>
                </button>
                <button onclick="startSDQ('parent')" class="glass-card flex flex-col items-center justify-center p-8 border-2 border-transparent hover:border-emerald-400 hover:shadow-xl transition-all group rounded-3xl relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-emerald-50 to-teal-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="relative z-10 flex flex-col items-center">
                        <div class="h-20 w-20 bg-emerald-100 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-users text-4xl text-emerald-600"></i>
                        </div>
                        <span class="text-xl font-bold text-slate-800">ผู้ปกครองประเมินนักเรียน</span>
                    </div>
                </button>
            </div>
            <div class="text-center mt-8">
                <button onclick="checkExistingResult()" class="text-indigo-600 hover:text-indigo-800 font-bold underline text-sm transition-colors"><i class="fa-solid fa-clock-rotate-left mr-1"></i> ดูผลการประเมินที่เคยทำไว้</button>
            </div>
        </div>

        <!-- หน้าทำแบบประเมิน -->
        <div id="sdqForm" class="hidden">
            <div class="glass-card rounded-3xl p-6 sm:p-10 mb-6 shadow-xl relative overflow-hidden">
                <!-- Decorative element -->
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-indigo-50 rounded-full opacity-50 blur-2xl"></div>

                <div class="flex justify-between items-center mb-4">
                    <span id="progressText" class="badge badge-blue">ข้อที่ 1 / 25</span>
                    <span id="percentText" class="text-sm font-bold text-indigo-600">0%</span>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-3 mb-10 overflow-hidden shadow-inner">
                    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>

                <div class="min-h-[120px] flex items-center justify-center mb-8">
                    <h3 id="questionText" class="text-xl sm:text-2xl font-bold text-center text-slate-800 leading-relaxed">...</h3>
                </div>

                <!-- Custom Radio Buttons -->
                <div class="space-y-4 max-w-md mx-auto">
                    <label class="relative block cursor-pointer group">
                        <input type="radio" name="sdqChoice" id="choice0" value="0" class="peer sr-only" onchange="selectAnswer(0)">
                        <div class="p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-slate-600 transition-all peer-checked:border-indigo-500 peer-checked:bg-indigo-50 peer-checked:text-indigo-700 peer-hover:border-indigo-300 bg-white">
                            ไม่จริง
                        </div>
                        <div class="absolute top-1/2 left-4 -translate-y-1/2 opacity-0 peer-checked:opacity-100 transition-opacity text-indigo-500">
                            <i class="fa-solid fa-circle-check text-xl"></i>
                        </div>
                    </label>
                    <label class="relative block cursor-pointer group">
                        <input type="radio" name="sdqChoice" id="choice1" value="1" class="peer sr-only" onchange="selectAnswer(1)">
                        <div class="p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-slate-600 transition-all peer-checked:border-indigo-500 peer-checked:bg-indigo-50 peer-checked:text-indigo-700 peer-hover:border-indigo-300 bg-white">
                            ค่อนข้างจริง
                        </div>
                        <div class="absolute top-1/2 left-4 -translate-y-1/2 opacity-0 peer-checked:opacity-100 transition-opacity text-indigo-500">
                            <i class="fa-solid fa-circle-check text-xl"></i>
                        </div>
                    </label>
                    <label class="relative block cursor-pointer group">
                        <input type="radio" name="sdqChoice" id="choice2" value="2" class="peer sr-only" onchange="selectAnswer(2)">
                        <div class="p-4 border-2 border-slate-200 rounded-2xl text-center font-bold text-slate-600 transition-all peer-checked:border-indigo-500 peer-checked:bg-indigo-50 peer-checked:text-indigo-700 peer-hover:border-indigo-300 bg-white">
                            จริง
                        </div>
                        <div class="absolute top-1/2 left-4 -translate-y-1/2 opacity-0 peer-checked:opacity-100 transition-opacity text-indigo-500">
                            <i class="fa-solid fa-circle-check text-xl"></i>
                        </div>
                    </label>
                </div>

                <div class="flex justify-between mt-12 pt-6 border-t border-slate-100">
                    <button id="btnPrev" onclick="navQuestion(-1)" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors hidden shadow-sm"><i class="fa-solid fa-arrow-left mr-2"></i>ย้อนกลับ</button>
                    
                    <!-- spacer -->
                    <div class="flex-1"></div> 

                    <button id="btnNext" onclick="navQuestion(1)" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg hidden">ถัดไป <i class="fa-solid fa-arrow-right ml-2"></i></button>
                    <button id="btnSubmit" onclick="submitAssessment()" class="px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg hidden"><i class="fa-solid fa-paper-plane mr-2"></i> ส่งแบบประเมิน</button>
                </div>
            </div>
        </div>

        <!-- หน้าแสดงผลลัพธ์ -->
        <div id="resultView" class="hidden">
            <div class="glass-card rounded-3xl p-8 max-w-2xl mx-auto shadow-xl">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-100 text-emerald-500 mb-4 shadow-inner">
                        <i class="fa-solid fa-check text-4xl"></i>
                    </div>
                    <h2 class="text-2xl font-black text-slate-800">บันทึกผลสำเร็จ!</h2>
                    <p class="text-slate-500 mt-2">ข้อมูลของคุณถูกบันทึกเข้าสู่ระบบเรียบร้อยแล้ว</p>
                </div>
                
                <div id="printArea" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-slate-50 rounded-bl-full -z-10"></div>
                    <h3 class="font-bold text-slate-700 border-b border-slate-100 pb-3 mb-4"><i class="fa-solid fa-chart-pie mr-2 text-indigo-500"></i> สรุปคะแนนรายด้าน</h3>
                    <div id="scoreDetails" class="grid grid-cols-2 gap-4"></div>
                    <div id="totalScoreCard" class="mt-6"></div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                     <button onclick="exportToPDF()" class="flex-1 py-3.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition-colors shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-download"></i> บันทึกผลเป็น PDF
                    </button>
                    <button onclick="location.reload()" class="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors shadow-sm">
                        กลับหน้าเริ่มต้น
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="sdq_student.js"></script>
    <script>
        window.onload = () => {
            document.getElementById('mainBody').classList.replace('opacity-0', 'opacity-100');
        };
    </script>
</body>
</html>
