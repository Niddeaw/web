<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard เยี่ยมบ้าน | รร.วัดไร่ขิงวิทยา</title>
    
    <link rel="icon" type="image/png" href="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Anuphan', 'sans-serif'] },
                }
            }
        }
    </script>

    <style>
        body { background: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .stat-card:hover { transform: translateY(-3px); transition: all 0.3s ease; }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/94wLv5v/WRK-PNG-200px.png" class="w-8 h-8">
                <h1 class="font-bold text-xl text-blue-900 uppercase tracking-tight">Home Visit Analytics</h1>
            </div>
            <div class="flex gap-4">
                <button onclick="window.print()" class="text-slate-500 hover:text-blue-600"><i class="fa-solid fa-print"></i></button>
                <div id="school-year-tag" class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-bold border border-blue-100">
                    ปีการศึกษา 2569
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="glass-card stat-card p-6 rounded-3xl shadow-sm border-b-4 border-blue-500">
                <p class="text-slate-500 text-xs font-bold uppercase mb-1">นักเรียนทั้งหมด</p>
                <h3 id="total-students" class="text-3xl font-black text-slate-800">0</h3>
                <p class="text-[10px] text-slate-400 mt-2 italic">* อ้างอิงจากฐานข้อมูล Core</p>
            </div>
            <div class="glass-card stat-card p-6 rounded-3xl shadow-sm border-b-4 border-green-500">
                <p class="text-slate-500 text-xs font-bold uppercase mb-1">เยี่ยมบ้านแล้ว</p>
                <h3 id="total-visited" class="text-3xl font-black text-green-600">0</h3>
                <p id="total-percent" class="text-xs font-bold text-green-500 mt-2">0% จากทั้งหมด</p>
            </div>
            <div class="glass-card stat-card p-6 rounded-3xl shadow-sm border-b-4 border-orange-500">
                <p class="text-slate-500 text-xs font-bold uppercase mb-1">พบกลุ่มเสี่ยง</p>
                <h3 id="total-risks" class="text-3xl font-black text-orange-600">0</h3>
                <p class="text-xs text-slate-400 mt-2">ต้องติดตามใกล้ชิด</p>
            </div>
            <div class="glass-card stat-card p-6 rounded-3xl shadow-sm border-b-4 border-slate-300">
                <p class="text-slate-500 text-xs font-bold uppercase mb-1">ยังไม่ได้ดำเนินการ</p>
                <h3 id="total-pending" class="text-3xl font-black text-slate-400">0</h3>
                <p class="text-xs text-slate-400 mt-2">รอการอัปเดตจากครู</p>
            </div>
        </div>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <h2 class="text-xl font-black text-slate-800 italic uppercase underline decoration-blue-500 underline-offset-8">ความคืบหน้ารายห้องเรียน</h2>
            <div class="flex bg-white p-1 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto whitespace-nowrap">
                <button onclick="filterGrade('all')" class="grade-btn active px-4 py-2 rounded-xl text-sm font-bold transition">ทั้งหมด</button>
                <button onclick="filterGrade(1)" class="grade-btn px-4 py-2 rounded-xl text-sm font-bold transition">ม.1</button>
                <button onclick="filterGrade(2)" class="grade-btn px-4 py-2 rounded-xl text-sm font-bold transition">ม.2</button>
                <button onclick="filterGrade(3)" class="grade-btn px-4 py-2 rounded-xl text-sm font-bold transition">ม.3</button>
                <button onclick="filterGrade(4)" class="grade-btn px-4 py-2 rounded-xl text-sm font-bold transition">ม.4</button>
                <button onclick="filterGrade(5)" class="grade-btn px-4 py-2 rounded-xl text-sm font-bold transition">ม.5</button>
                <button onclick="filterGrade(6)" class="grade-btn px-4 py-2 rounded-xl text-sm font-bold transition">ม.6</button>
            </div>
        </div>

        <div id="classroom-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 opacity-50">
                <i class="fa-solid fa-spinner animate-spin text-4xl mb-4"></i>
                <p>กำลังวิเคราะห์ข้อมูลเชิงลึก...</p>
            </div>
        </div>

    </main>

    <style>
        .grade-btn.active { @apply bg-blue-600 text-white shadow-md shadow-blue-200; }
        .grade-btn:not(.active) { @apply text-slate-500 hover:bg-slate-50; }
    </style>

    <script>
        // *** CONFIGURATION ***
        const _supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

        let allClassrooms = [];
        let visitData = [];

        window.onload = async () => {
            await fetchMasterData();
            renderDashboard();
        };

        async function fetchMasterData() {
            // 1. ดึงข้อมูลห้องเรียนทั้งหมด
            const { data: classrooms } = await _supabase
                .from('core_classrooms')
                .select('*, core_personnel!advisor_id(first_name, last_name)');
            
            // 2. ดึงจำนวนนักเรียนต่อห้อง (Count จาก student_enrollments)
            const { data: enrollments } = await _supabase
                .from('student_enrollments')
                .select('id, classroom_id');

            // 3. ดึงข้อมูลการเยี่ยมบ้านที่สำเร็จแล้ว
            const { data: visits } = await _supabase
                .from('home_visits')
                .select('enrollment_id, risk_travel, risk_substance, risk_economy');

            allClassrooms = classrooms.map(room => {
                const roomEnrollments = enrollments.filter(e => e.classroom_id === room.id);
                const visitedInRoom = visits.filter(v => 
                    roomEnrollments.some(re => re.id === v.enrollment_id)
                );
                
                return {
                    ...room,
                    total_students: roomEnrollments.length,
                    visited_count: visitedInRoom.length,
                    risks_found: visitedInRoom.filter(v => v.risk_travel || v.risk_substance || v.risk_economy).length
                };
            });

            // สรุปยอดรวม (Header Stats)
            updateGlobalStats(allClassrooms);
        }

        function updateGlobalStats(data) {
            const total = data.reduce((sum, r) => sum + r.total_students, 0);
            const visited = data.reduce((sum, r) => sum + r.visited_count, 0);
            const risks = data.reduce((sum, r) => sum + r.risks_found, 0);
            const percent = Math.round((visited / total) * 100) || 0;

            document.getElementById('total-students').innerText = total.toLocaleString();
            document.getElementById('total-visited').innerText = visited.toLocaleString();
            document.getElementById('total-risks').innerText = risks.toLocaleString();
            document.getElementById('total-pending').innerText = (total - visited).toLocaleString();
            document.getElementById('total-percent').innerText = `${percent}% จากทั้งหมด`;
        }

        function renderDashboard(filterGrade = 'all') {
            const grid = document.getElementById('classroom-grid');
            grid.innerHTML = '';

            const filtered = filterGrade === 'all' 
                ? allClassrooms 
                : allClassrooms.filter(r => r.grade_level == filterGrade);

            filtered.sort((a,b) => a.room_number - b.room_number).forEach(room => {
                const percent = Math.round((room.visited_count / room.total_students) * 100) || 0;
                let colorClass = 'bg-slate-200';
                let textClass = 'text-slate-400';
                
                if(percent > 0) { colorClass = 'bg-orange-500'; textClass = 'text-orange-600'; }
                if(percent >= 80) { colorClass = 'bg-green-500'; textClass = 'text-green-600'; }

                const card = document.createElement('div');
                card.className = "glass-card p-6 rounded-[2.5rem] shadow-sm hover:shadow-xl transition-all duration-300 group";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-blue-900 text-white w-14 h-14 rounded-2xl flex flex-col items-center justify-center shadow-lg group-hover:scale-110 transition">
                            <span class="text-[10px] uppercase font-bold opacity-70">ม.</span>
                            <span class="text-xl font-black">${room.grade_level}/${room.room_number}</span>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-slate-400 font-bold uppercase">ครูที่ปรึกษา</p>
                            <p class="text-sm font-bold text-slate-700">${room.core_personnel?.first_name || 'ไม่ระบุ'}</p>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-2">
                                <span class="${textClass}">ความคืบหน้า ${percent}%</span>
                                <span class="text-slate-400">${room.visited_count}/${room.total_students} คน</span>
                            </div>
                            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                <div class="${colorClass} h-full transition-all duration-1000" style="width: ${percent}%"></div>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <div class="flex-1 bg-slate-50 rounded-xl p-2 text-center border border-slate-100">
                                <p class="text-[9px] text-slate-400 font-bold uppercase">พบความเสี่ยง</p>
                                <p class="text-sm font-black ${room.risks_found > 0 ? 'text-red-500' : 'text-slate-400'}">${room.risks_found}</p>
                            </div>
                            <button onclick="viewRoomDetail('${room.id}')" class="bg-white border border-slate-200 hover:border-blue-500 hover:text-blue-600 px-4 rounded-xl text-xs font-bold transition">
                                ดูข้อมูล <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGrade(grade) {
            document.querySelectorAll('.grade-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderDashboard(grade);
        }

        function viewRoomDetail(roomId) {
            // ฟังก์ชันสำหรับเจาะลึกข้อมูลห้องเรียน (เช่น ลิงก์ไปหน้าคัดกรองรายห้อง)
            console.log("Viewing room:", roomId);
            Swal.fire({
                title: 'เข้าสู่ข้อมูลห้องเรียน',
                text: 'กำลังเปิดหน้ารายงานสรุปผลรายห้อง...',
                icon: 'info',
                timer: 1000,
                showConfirmButton: false
            });
        }
    </script>
</body>
</html>
