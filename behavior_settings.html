<!DOCTYPE html>
<html lang="th">

<head>
    <title>ตั้งค่าระบบความประพฤติ | WRK System</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">

    <!-- ✅ Tom Select CSS (ถ้า core_head.js ยังไม่ได้รวมไว้) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

    <style>
        .ts-control {
            border-radius: 0.75rem !important;
            /* rounded-xl */
            padding: 0.65rem 1rem !important;
            border: 1px solid #e2e8f0 !important;
            /* border-slate-200 */
            box-shadow: none !important;
            background-color: #f8fafc !important;
            /* bg-slate-50 */
            transition: all 0.2s ease-in-out;
        }

        .ts-control.focus {
            background-color: #ffffff !important;
            border-color: #a855f7 !important;
            /* focus ring purple */
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2) !important;
        }
    </style>
</head>

<body class="p-4 md:p-6 pb-24 bg-slate-50/50">
    <div class="max-w-6xl mx-auto space-y-6">

        <div

        <div class="space-y-6">

                <div class="flex items-center justify-between mb-5 border-b border-slate-100 pb-3">

                        <div class="bg-blue-100 text-blue-600 w-8 h-8 rounded-lg flex items-center justify-center mr-2">

                        <label class="block text-xs mb-1.5 text-slate-500 font-bold uppercase tracking-wide">Google

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div class="flex items-center justify-between mb-5 border-b border-slate-100 pb-3">

                            <div

                        </h3>
                    </div>
                    <div class="flex flex-col gap-3 mb-4">
                        <select id="grade_head_teacher" class="w-full">

                        <div class="flex gap-2">

                            <button onclick="saveGradeHead()"

                    <div

                <div id="discipline_head_section"
                    class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200 relative overflow-hidden group hover:shadow-md transition-shadow">
                    <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
                    <div class="flex items-center justify-between mb-5 border-b border-slate-100 pb-3">
                        <h3 class="font-bold text-slate-800 flex items-center">
                            <div
                                class="bg-emerald-100 text-emerald-600 w-8 h-8 rounded-lg flex items-center justify-center mr-2">
                                <i class="fas fa-shield-alt"></i></div> แต่งตั้งหัวหน้างานปกครอง
                        </h3>
                    </div>
                    <div class="flex flex-col gap-3 mb-4">
                        <select id="select-discipline-head" class="w-full">
                            <option value="">-- พิมพ์ชื่อครู --</option>
                        </select>
                        <button onclick="addDisciplineHead()"
                            class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold hover:bg-emerald-700 transition-colors shadow-sm flex items-center justify-center gap-2 active:scale-[0.98]">
                            <i class="fas fa-plus"></i> ยืนยันการแต่งตั้ง
                        </button>
                    </div>
                    <div
                        class="bg-slate-50 rounded-xl border border-slate-200 overflow-hidden h-44 overflow-y-auto custom-scrollbar">
                        <table class="w-full text-sm text-left">
                            <tbody id="discipline-head-list" class="divide-y divide-slate-200"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">

            <div class="space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 id="form_title"
                        class="font-black mb-5 text-blue-900 border-b border-slate-100 pb-3 text-lg flex items-center">
                        <div
                            class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">
                            <i class="fas fa-plus"></i></div> เพิ่มเกณฑ์ใหม่
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label
                                class="block text-xs mb-1.5 text-slate-500 font-bold uppercase tracking-wide">ชื่อรายการความประพฤติ</label>
                            <input type="text" id="crit_title"
                                class="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-xl p-3 text-sm focus:ring-2 ring-blue-500/20 focus:border-blue-500 outline-none transition-all"
                                placeholder="เช่น มาสาย, จิตอาสา, ทะเลาะวิวาท">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label
                                    class="block text-xs mb-1.5 text-slate-500 font-bold uppercase tracking-wide">ประเภท</label>
                                <select id="crit_category"
                                    class="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-xl p-3 text-sm focus:ring-2 ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-bold text-slate-700">
                                    <option value="positive">🟢 ความดี (+)</option>
                                    <option value="negative">🔴 ผิดระเบียบ (-)</option>
                                </select>
                            </div>
                            <div>
                                <label
                                    class="block text-xs mb-1.5 text-slate-500 font-bold uppercase tracking-wide">คะแนนมาตรฐาน</label>
                                <input type="number" id="crit_score"
                                    class="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-xl p-3 text-sm focus:ring-2 ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-black text-center text-blue-700"
                                    placeholder="ตัวเลข">
                            </div>
                        </div>
                        <div class="flex gap-2 pt-3">
                            <button id="btn_save" onclick="saveCriteria()"
                                class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 shadow-sm transition-colors active:scale-[0.98]">
                                บันทึกเกณฑ์
                            </button>
                            <button id="btn_cancel_edit" onclick="cancelEdit()"
                                class="hidden w-24 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200 shadow-sm transition-colors active:scale-[0.98]">
                                ยกเลิก
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3
                        class="font-black mb-5 text-emerald-800 border-b border-slate-100 pb-3 text-lg flex items-center">
                        <div
                            class="bg-emerald-100 text-emerald-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">
                            <i class="fas fa-file-excel"></i></div> จัดการด้วย Excel
                    </h3>
                    <div class="space-y-3">
                        <button onclick="downloadTemplate()"
                            class="w-full bg-slate-50 text-slate-700 border border-slate-200 py-3 rounded-xl hover:bg-slate-100 hover:border-slate-300 transition-all font-bold text-sm flex items-center justify-center gap-2 active:scale-[0.98]">
                            <i class="fas fa-download text-emerald-600"></i> โหลดไฟล์ต้นแบบ (Template)
                        </button>
                        <input type="file" id="excel_file" accept=".xlsx, .xls" class="hidden"
                            onchange="importExcel(this)">
                        <button onclick="document.getElementById('excel_file').click()"
                            class="w-full bg-emerald-600 text-white py-3 rounded-xl hover:bg-emerald-700 transition-all font-bold text-sm flex items-center justify-center gap-2 shadow-sm active:scale-[0.98]">
                            <i class="fas fa-file-import"></i> นำเข้าข้อมูลจาก Excel
                        </button>
                    </div>
                </div>
            </div>

            <div
                class="xl:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col h-[750px]">

                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-5 gap-4">
                    <h3 class="font-black text-slate-800 text-lg flex items-center">
                        <div
                            class="bg-amber-100 text-amber-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">
                            <i class="fas fa-list-check"></i></div> ฐานข้อมูลเกณฑ์ทั้งหมด
                    </h3>

                    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                        <button id="btn_delete_selected" onclick="deleteSelectedCriteria()"
                            class="hidden text-xs bg-rose-50 text-rose-600 border border-rose-200 px-4 py-2 rounded-xl hover:bg-rose-100 transition-colors font-bold shadow-sm items-center gap-1.5 flex-1 sm:flex-none justify-center active:scale-[0.98]">
                            <i class="fas fa-check-double"></i> ลบที่เลือก (<span id="selected_count">0</span>)
                        </button>
                        <button onclick="deleteAllCriteria()"
                            class="text-xs bg-white text-rose-500 border border-slate-200 px-4 py-2 rounded-xl hover:bg-rose-50 hover:border-rose-200 transition-colors font-bold shadow-sm flex items-center justify-center gap-1.5 flex-1 sm:flex-none active:scale-[0.98]">
                            <i class="fas fa-dumpster"></i> ลบทั้งหมด
                        </button>
                        <button onclick="exportCriteria()"
                            class="text-xs bg-slate-800 text-white px-4 py-2 rounded-xl hover:bg-slate-700 transition-colors font-bold shadow-sm flex items-center justify-center gap-1.5 flex-1 sm:flex-none active:scale-[0.98]">
                            <i class="fas fa-file-export text-slate-300"></i> ส่งออก
                        </button>
                    </div>
                </div>

                <div class="flex-1 overflow-auto rounded-2xl border border-slate-200 custom-scrollbar relative">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="sticky top-0 bg-slate-100/90 backdrop-blur-md z-10 shadow-sm">
                            <tr class="text-slate-600">
                                <th class="p-3.5 text-center w-12">
                                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()"
                                        class="rounded border-slate-300 text-blue-600 cursor-pointer w-4 h-4 focus:ring-blue-500/50">
                                </th>
                                <th class="p-3.5 font-black uppercase tracking-wider text-xs">ชื่อรายการ</th>
                                <th class="p-3.5 font-black uppercase tracking-wider text-xs text-center w-32">ประเภท
                                </th>
                                <th class="p-3.5 font-black uppercase tracking-wider text-xs text-center w-24">คะแนน
                                </th>
                                <th class="p-3.5 font-black uppercase tracking-wider text-xs text-center w-24">จัดการ
                                </th>
                            </tr>
                        </thead>
                        <tbody id="criteria_list" class="divide-y divide-slate-100 bg-white">
                            <tr>
                                <td colspan="5" class="p-16 text-center text-slate-400 font-bold"><i
                                        class="fas fa-circle-notch fa-spin text-2xl mb-3 text-blue-300 block"></i>
                                    กำลังโหลดข้อมูล...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentEditId = null;

        $(document).ready(async () => {
            await checkAuth();
            loadApiConfig();
            loadCriteria();
        });

        // behavior_settings.html — แทนที่ฟังก์ชัน checkAuth
        async function checkAuth() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.replace('index.html'); return; }

            const { data: profile } = await db.from('core_personnel').select('role').eq('id', session.user.id).single();
            const { data: moduleAdmin } = await db.from('core_module_admins')
                .select('*')
                .eq('user_id', session.user.id)
                .eq('module_id', 'behavior')
                .maybeSingle();

            // ตรวจสอบหัวหน้างานปกครอง
            const { data: schoolInfo } = await db.from('core_school_info')
                .select('current_academic_year')
                .single();
            const academicYear = schoolInfo?.current_academic_year || '';
            const { data: disciplineHead } = await db.from('core_discipline_heads')
                .select('id')
                .eq('personnel_id', session.user.id)
                .eq('academic_year', academicYear)
                .maybeSingle();

            // ✅ ใช้ canManageSettings จาก config.js (เฉพาะ super_admin, admin)
            const hasSettings = window.canManageSettings(profile.role);
            const isAdmin = window.isAdminUser(profile.role, false);

            // อนุญาตเฉพาะผู้ที่มีสิทธิ์ตั้งค่า หรือเป็น module admin หรือหัวหน้างานปกครอง
            if (!hasSettings && !moduleAdmin && !disciplineHead) {
                await Swal.fire('ปฏิเสธการเข้าถึง', 'เฉพาะผู้ดูแลระบบงานปกครองเท่านั้น', 'error');
                history.back();
                return;
            }

            // 🌟 แสดงส่วนเฉพาะ Super Admin (ถ้ามีสิทธิ์ตั้งค่าและเป็น super_admin)
            if (profile.role === 'super_admin') {
                $('#api_config_section').removeClass('hidden');
                $('#grade_head_section').removeClass('hidden');
                $('#discipline_head_section').removeClass('hidden');
                loadTeachersForSelect();
                loadGradeHeads();
                loadDisciplineHeads();
                loadApiConfig();
                loadCriteria();
            } else {
                // admin หรือหัวหน้างานปกครอง จะเห็นเฉพาะส่วนจัดการเกณฑ์ (ไม่เห็น API/หัวหน้า)
                $('#api_config_section').addClass('hidden');
                $('#grade_head_section').addClass('hidden');
                $('#discipline_head_section').addClass('hidden');
                loadCriteria();
            }
        }
        // ==========================================
        // ส่วนจัดการแอดมินหัวหน้าระดับชั้น (ใช้ Tom Select)
        // ==========================================
        let teacherTomSelect = null;

        async function loadTeachersForSelect() {
            const { data } = await db.from('core_personnel').select('id, prefix, first_name, last_name').order('first_name');

            if (data) {
                const options = data.map(t => ({
                    id: t.id,
                    full_name: `${t.prefix || ''}${t.first_name} ${t.last_name}`
                }));

                if (teacherTomSelect) {
                    teacherTomSelect.destroy();
                    $('#grade_head_teacher').empty();
                }

                teacherTomSelect = new TomSelect('#grade_head_teacher', {
                    options: options,
                    valueField: 'id',
                    labelField: 'full_name',
                    searchField: 'full_name',
                    placeholder: '-- พิมพ์ค้นหาชื่อครู --',
                    render: {
                        option: function (item, escape) {
                            return `<div class="p-2 border-b border-slate-50 text-sm"><i class="fas fa-user-tie mr-2 text-slate-400"></i>${escape(item.full_name)}</div>`;
                        },
                        item: function (item, escape) {
                            return `<div class="font-bold text-purple-700 text-sm">${escape(item.full_name)}</div>`;
                        }
                    }
                });
            }
        }

        async function loadGradeHeads() {
            const { data, error } = await db.from('behavior_grade_heads').select('id, grade_level, teacher_id, core_personnel(prefix, first_name, last_name)').order('grade_level');
            const tbody = document.getElementById('grade_head_list');

            if (data && data.length > 0) {
                tbody.innerHTML = data.map(h => `
                    <tr class="hover:bg-slate-50 transition-colors group">
                        <td class="p-3.5 pl-5 font-black text-slate-700 w-24">ม.${h.grade_level}</td>
                        <td class="p-3.5 text-slate-600 font-bold">${h.core_personnel?.prefix || ''}${h.core_personnel?.first_name} ${h.core_personnel?.last_name}</td>
                        <td class="p-3.5 text-center">
                            <button onclick="deleteGradeHead('${h.id}')" class="text-slate-300 hover:text-rose-600 hover:bg-rose-50 h-8 w-8 rounded-lg transition-colors"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-slate-400 font-bold"><i class="fas fa-info-circle mb-2 block text-2xl"></i>ยังไม่มีข้อมูลการแต่งตั้งหัวหน้าระดับชั้น</td></tr>';
            }
        }

        async function saveGradeHead() {
            const teacherId = $('#grade_head_teacher').val();
            const gradeLevel = $('#grade_head_level').val();

            if (!teacherId || !gradeLevel) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาเลือกชื่อครูและระดับชั้นครับ', 'warning');

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const { error } = await db.from('behavior_grade_heads').insert({ grade_level: parseInt(gradeLevel), teacher_id: teacherId });

            if (error) {
                if (error.code === '23505') Swal.fire('ซ้ำซ้อน', 'มีชื่อครูดูแลระดับชั้นนี้ในระบบแล้วครับ', 'warning');
                else Swal.fire('ผิดพลาด', error.message, 'error');
            } else {
                Swal.fire({ icon: 'success', title: 'แต่งตั้งสำเร็จ', timer: 1500, showConfirmButton: false });
                if (teacherTomSelect) teacherTomSelect.clear();
                loadGradeHeads();
            }
        }

        async function deleteGradeHead(id) {
            Swal.fire({ title: 'กำลังลบสิทธิ์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const { error } = await db.from('behavior_grade_heads').delete().eq('id', id);

            if (!error) {
                Swal.fire({ icon: 'success', title: 'ถอดถอนสิทธิ์สำเร็จ', timer: 1500, showConfirmButton: false });
                loadGradeHeads();
            } else Swal.fire('ผิดพลาด', error.message, 'error');
        }

        // ==========================================
        // 🌟 ระบบจัดการหัวหน้างานปกครอง (ใช้ Tom Select)
        // ==========================================
        let currentAcadYear = '';

        $(document).ready(async function () {
            const { data: sInfo } = await db.from('core_school_info').select('current_academic_year').single();
            if (sInfo) currentAcadYear = sInfo.current_academic_year;

            loadAllTeachersForSelect();
            loadDisciplineHeads();
        });

        async function loadAllTeachersForSelect() {
            const { data } = await db.from('core_personnel').select('id, first_name, last_name, prefix').order('first_name');

            if (data) {
                const selectEl = document.getElementById('select-discipline-head');
                // ล้าง options เดิมก่อน
                selectEl.innerHTML = '<option value="">-- พิมพ์ชื่อเพื่อค้นหา --</option>';
                data.forEach(t => {
                    const option = document.createElement('option');
                    option.value = t.id;
                    option.text = `${t.prefix || ''}${t.first_name} ${t.last_name}`;
                    selectEl.appendChild(option);
                });

                if (window.disciplineHeadTomSelect) {
                    window.disciplineHeadTomSelect.destroy();
                }

                window.disciplineHeadTomSelect = new TomSelect(selectEl, {
                    placeholder: "-- พิมพ์ค้นหาชื่อครู --",
                    allowEmptyOption: true,
                    plugins: ['clear_button'],
                });
            }
        }

        async function loadDisciplineHeads() {
            const { data } = await db.from('core_discipline_heads')
                .select(`id, personnel_id, core_personnel(first_name, last_name, prefix)`)
                .eq('academic_year', currentAcadYear);

            let html = '';
            if (data && data.length > 0) {
                data.forEach(item => {
                    const p = item.core_personnel;
                    const name = p ? `${p.prefix || ''}${p.first_name} ${p.last_name}` : 'ไม่พบข้อมูล';
                    html += `
                    <tr class="hover:bg-slate-50 transition-colors group">
                        <td class="py-3.5 pl-5 font-bold text-slate-600">${name}</td>
                        <td class="py-3.5 text-center">
                            <button onclick="removeDisciplineHead('${item.id}')" class="text-slate-300 hover:text-rose-600 hover:bg-rose-50 h-8 w-8 rounded-lg transition-colors"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>`;
                });
            } else {
                html = `<tr><td colspan="2" class="p-8 text-center text-slate-400 font-bold"><i class="fas fa-info-circle mb-2 block text-2xl"></i>ยังไม่มีการแต่งตั้งหัวหน้างานปกครอง</td></tr>`;
            }
            $('#discipline-head-list').html(html);
        }

        async function addDisciplineHead() {
            const pid = $('#select-discipline-head').val();
            if (!pid) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกครูที่ต้องการแต่งตั้ง', 'warning');

            Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });

            const { error } = await db.from('core_discipline_heads').insert([
                { personnel_id: pid, academic_year: currentAcadYear }
            ]);

            if (error) return Swal.fire('ข้อผิดพลาด', error.message, 'error');

            if (window.disciplineHeadTomSelect) window.disciplineHeadTomSelect.clear();
            else $('#select-discipline-head').val('');

            await loadDisciplineHeads();
            Swal.fire({ icon: 'success', title: 'แต่งตั้งเรียบร้อย', timer: 1500, showConfirmButton: false });
        }

        async function removeDisciplineHead(id) {
            if (!confirm('ต้องการยกเลิกสิทธิ์หัวหน้างานปกครองท่านนี้ใช่หรือไม่?')) return;
            Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading() });
            const { error } = await db.from('core_discipline_heads').delete().eq('id', id);
            if (error) return Swal.fire('ข้อผิดพลาด', error.message, 'error');

            await loadDisciplineHeads();
            Swal.close();
        }

        // ==========================================
        // ส่วนจัดการ API Config
        // ==========================================
        async function loadApiConfig() {
            const { data } = await db.from('behavior_system_config').select('*').eq('id', 1).maybeSingle();
            if (data) {
                $('#config_gas_url').val(data.gas_url || '');
                $('#config_folder_id').val(data.drive_folder_id || '');
            }
        }

        async function saveApiConfig() {
            const payload = {
                gas_url: $('#config_gas_url').val().trim(),
                drive_folder_id: $('#config_folder_id').val().trim(),
                updated_at: new Date()
            };
            Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            const { error } = await db.from('behavior_system_config').upsert([{ id: 1, ...payload }]);
            if (!error) Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
            else Swal.fire('ผิดพลาด', error.message, 'error');
        }

        // ==========================================
        // ส่วนจัดการเกณฑ์ (Criteria)
        // ==========================================
        let currentCriteria = [];

        async function loadCriteria() {
            const { data, error } = await db.from('behavior_criteria').select('*').order('created_at', { ascending: false });
            currentCriteria = data || [];
            let html = '';

            $('#selectAll').prop('checked', false);
            checkSelection();

            if (currentCriteria.length === 0) {
                html = '<tr><td colspan="5" class="p-16 text-center text-slate-400 font-bold"><i class="fas fa-folder-open mb-3 block text-4xl text-slate-300"></i>ยังไม่มีข้อมูลเกณฑ์คะแนน</td></tr>';
            } else {
                currentCriteria.forEach(item => {
                    const isPos = item.category === 'positive';
                    const safeTitle = item.title.replace(/'/g, "\\'");
                    html += `
                        <tr class="hover:bg-slate-50 transition-colors group">
                            <td class="p-3.5 text-center border-b border-slate-50">
                                <input type="checkbox" class="crit-checkbox rounded border-slate-300 text-blue-600 cursor-pointer w-4 h-4 focus:ring-blue-500/50" value="${item.id}" onchange="checkSelection()">
                            </td>
                            <td class="p-3.5 font-bold text-slate-700 border-b border-slate-50">${item.title}</td>
                            <td class="p-3.5 text-center border-b border-slate-50">
                                <span class="px-3 py-1.5 rounded-xl text-[11px] font-black tracking-wide border ${isPos ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 'bg-rose-50 text-rose-700 border-rose-100'}">
                                    ${isPos ? '<i class="fas fa-plus-circle mr-1"></i>ความดี' : '<i class="fas fa-minus-circle mr-1"></i>ผิดระเบียบ'}
                                </span>
                            </td>
                            <td class="p-3.5 text-center font-black text-base border-b border-slate-50 ${isPos ? 'text-emerald-600' : 'text-rose-600'}">
                                ${isPos ? '+' : '-'}${item.default_score}
                            </td>
                            <td class="p-3.5 text-center whitespace-nowrap border-b border-slate-50">
                                <button onclick="editCriteria('${item.id}', '${safeTitle}', '${item.category}', ${item.default_score})" class="text-slate-300 hover:text-amber-600 hover:bg-amber-50 h-8 w-8 rounded-lg transition-colors mr-1" title="แก้ไข">
                                    <i class="fas fa-pen"></i>
                                </button>
                                <button onclick="deleteCriteria('${item.id}')" class="text-slate-300 hover:text-rose-600 hover:bg-rose-50 h-8 w-8 rounded-lg transition-colors" title="ลบ">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }
            $('#criteria_list').html(html);
        }

        function toggleSelectAll() {
            const isChecked = $('#selectAll').is(':checked');
            $('.crit-checkbox').prop('checked', isChecked);
            checkSelection();
        }

        function checkSelection() {
            const checkedCount = $('.crit-checkbox:checked').length;
            if (checkedCount > 0) {
                $('#btn_delete_selected').removeClass('hidden').addClass('flex');
                $('#selected_count').text(checkedCount);
            } else {
                $('#btn_delete_selected').addClass('hidden').removeClass('flex');
            }
            const totalCount = $('.crit-checkbox').length;
            $('#selectAll').prop('checked', checkedCount === totalCount && totalCount > 0);
        }

        async function deleteSelectedCriteria() {
            const selectedIds = [];
            $('.crit-checkbox:checked').each(function () { selectedIds.push($(this).val()); });
            if (selectedIds.length === 0) return;

            const { isConfirmed } = await Swal.fire({
                title: `ยืนยันการลบ ${selectedIds.length} รายการ?`, html: "ข้อมูลที่อ้างอิงเกณฑ์ที่เลือกจะถูกลบไปด้วย", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'ลบข้อมูล', cancelButtonText: 'ยกเลิก'
            });

            if (isConfirmed) {
                Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                const { error } = await db.from('behavior_criteria').delete().in('id', selectedIds);
                if (!error) { Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1500, showConfirmButton: false }); loadCriteria(); }
                else Swal.fire('ลบไม่สำเร็จ', error.message, 'error');
            }
        }

        async function deleteAllCriteria() {
            if (currentCriteria.length === 0) return Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลให้ลบ', 'info');
            const { isConfirmed } = await Swal.fire({
                title: 'ยืนยันการลบ "ทั้งหมด"?', html: "รายการเกณฑ์ทั้งหมดและข้อมูลประวัติที่อ้างอิงจะหายไป <br><b class='text-rose-600'>ไม่สามารถกู้คืนได้</b>", icon: 'error',
                showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'ใช่, ลบทิ้งทั้งหมด', cancelButtonText: 'ยกเลิก'
            });

            if (isConfirmed) {
                Swal.fire({ title: 'กำลังล้างข้อมูล...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                const allIds = currentCriteria.map(c => c.id);
                const { error } = await db.from('behavior_criteria').delete().in('id', allIds);
                if (!error) { Swal.fire({ icon: 'success', title: 'ล้างข้อมูลสำเร็จ', timer: 1500, showConfirmButton: false }); loadCriteria(); }
                else Swal.fire('ผิดพลาด', error.message, 'error');
            }
        }

        async function deleteCriteria(id) {
            const { isConfirmed } = await Swal.fire({
                title: 'ยืนยันการลบ?', html: "ข้อมูลที่อ้างอิงเกณฑ์นี้จะถูกลบไปด้วย", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'ลบข้อมูล', cancelButtonText: 'ยกเลิก'
            });
            if (isConfirmed) {
                Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                const { error } = await db.from('behavior_criteria').delete().eq('id', id);
                if (!error) { Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1500, showConfirmButton: false }); loadCriteria(); }
                else Swal.fire('ลบไม่สำเร็จ', error.message, 'error');
            }
        }

        // ==========================================
        // ระบบเพิ่ม/แก้ไขเกณฑ์เดี่ยว
        // ==========================================
        function editCriteria(id, title, category, score) {
            currentEditId = id;
            $('#crit_title').val(title);
            $('#crit_category').val(category);
            $('#crit_score').val(score);
            $('#form_title').html('<div class="bg-amber-100 text-amber-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm"><i class="fa-solid fa-pen-to-square"></i></div> แก้ไขเกณฑ์').removeClass('text-blue-900').addClass('text-amber-700');
            $('#btn_save').text('อัปเดตเกณฑ์').removeClass('bg-blue-600 hover:bg-blue-700').addClass('bg-amber-500 hover:bg-amber-600');
            $('#btn_cancel_edit').removeClass('hidden');
            $('#crit_title').focus();
        }

        function cancelEdit() {
            currentEditId = null;
            $('#crit_title').val('');
            $('#crit_score').val('');
            $('#crit_category').val('positive');
            $('#form_title').html('<div class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm"><i class="fas fa-plus"></i></div> เพิ่มเกณฑ์ใหม่').removeClass('text-amber-700').addClass('text-blue-900');
            $('#btn_save').text('บันทึกเกณฑ์').removeClass('bg-amber-500 hover:bg-amber-600').addClass('bg-blue-600 hover:bg-blue-700');
            $('#btn_cancel_edit').addClass('hidden');
        }

        async function saveCriteria() {
            const payload = { title: $('#crit_title').val().trim(), category: $('#crit_category').val(), default_score: parseInt($('#crit_score').val()) };
            if (!payload.title || isNaN(payload.default_score)) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบและถูกต้อง', 'warning');
            Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

            if (currentEditId) {
                const { error } = await db.from('behavior_criteria').update(payload).eq('id', currentEditId);
                if (!error) { Swal.fire({ icon: 'success', title: 'อัปเดตเกณฑ์เรียบร้อย!', timer: 1500, showConfirmButton: false }); cancelEdit(); loadCriteria(); }
                else Swal.fire('ผิดพลาด', error.message, 'error');
            } else {
                const { error } = await db.from('behavior_criteria').insert([payload]);
                if (!error) { Swal.fire({ icon: 'success', title: 'เพิ่มเกณฑ์เรียบร้อย!', timer: 1500, showConfirmButton: false }); cancelEdit(); loadCriteria(); }
                else Swal.fire('ผิดพลาด', error.message, 'error');
            }
        }

        // ==========================================
        // ระบบนำเข้า / ส่งออก Excel
        // ==========================================
        function downloadTemplate() {
            const ws_data = [['title', 'category', 'default_score'], ['มาโรงเรียนสาย', 'negative', 5], ['เก็บของได้นำส่งคืน', 'positive', 10]];
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            ws['!cols'] = [{ wch: 30 }, { wch: 15 }, { wch: 15 }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Criteria");
            XLSX.writeFile(wb, "ต้นแบบ_นำเข้าเกณฑ์ความประพฤติ.xlsx");
        }

        async function importExcel(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);
                    if (rows.length === 0) throw new Error("ไม่พบข้อมูลในไฟล์ Excel");
                    Swal.fire({ title: 'กำลังนำเข้า...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                    const validRows = rows.filter(r => r.title && r.category && r.default_score).map(r => ({
                        title: r.title.toString().trim(), category: r.category.toString().trim().toLowerCase(), default_score: parseInt(r.default_score)
                    }));
                    const { error } = await db.from('behavior_criteria').insert(validRows);
                    if (!error) { Swal.fire({ icon: 'success', title: `นำเข้าสำเร็จ ${validRows.length} รายการ`, timer: 1500, showConfirmButton: false }); input.value = ""; loadCriteria(); }
                    else throw error;
                } catch (err) { Swal.fire('ผิดพลาด', err.message || 'รูปแบบไฟล์ไม่ถูกต้อง', 'error'); }
            };
            reader.readAsArrayBuffer(file);
        }

        async function exportCriteria() {
            if (currentCriteria.length === 0) return Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลให้ส่งออก', 'info');
            const exportData = currentCriteria.map(c => ({ 'title': c.title, 'category': c.category, 'default_score': c.default_score }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Criteria");
            XLSX.writeFile(wb, `รายการเกณฑ์ความประพฤติ.xlsx`);
        }
    </script>
</body>

</html>
