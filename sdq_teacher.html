<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ระบบ SDQ สำหรับครู | WRK System</title>

    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">

    <style>
        .radio-card { transition: all 0.2s ease; }
        .radio-card:hover { border-color: #f59e0b; background-color: #fffbeb; }
        input.peer:checked + div { border-color: #f59e0b; background-color: #fffbeb; color: #b45309; }
        .choice-label { user-select: none; }

        @media (max-width: 760px) {
            .d-sidebar { position: fixed !important; top: 0 !important; left: 0 !important; height: 100vh !important; width: 280px !important; max-width: 85vw !important; z-index: 1000 !important; transform: translateX(-100%) !important; transition: transform 0.3s ease-in-out !important; overflow-y: auto !important; box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
            .d-sidebar.open, .d-sidebar.show, .d-sidebar.active, .d-sidebar.is-open { transform: translateX(0) !important; }
            .d-overlay { display: none !important; position: fixed !important; inset: 0 !important; background: rgba(15,23,42,0.55) !important; backdrop-filter: blur(2px); z-index: 999 !important; opacity: 0; transition: opacity 0.3s ease; }
            .d-overlay.open, .d-overlay.show, .d-overlay.active, .d-overlay.is-open { display: block !important; opacity: 1; }
            .d-main { margin-left: 0 !important; padding-left: 0 !important; width: 100% !important; max-width: 100vw !important; }
            .d-app { display: block !important; }
            .d-menu { display: flex !important; align-items: center; justify-content: center; }
            .d-collapse { display: none !important; }
            .d-topbar { padding: 0 10px !important; gap: 6px !important; }
            .glass-panel { max-width: 100%; }
        }
        @media (min-width: 761px) and (max-width: 1024px) {
            .d-sidebar { width: 240px; }
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen opacity-0 transition-opacity duration-500" id="mainBody">

    <div class="d-app">
        <aside class="d-sidebar" id="dSidebar"></aside>
        <div class="d-overlay" id="dOverlay" onclick="toggleSidebar(false)"></div>

        <main class="d-main" id="dMain">
            <header class="d-topbar" id="dTopbar"></header>

            <div style="padding:0 0 12px;">
                <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

                    <!-- ✅ Status bar (badge + mode subtitle) -->
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center gap-2">
                            <span id="pageBadge" class="inline-block px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-[10px] font-bold uppercase tracking-wider">Teacher View</span>
                            <span id="mode-subtitle" class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Teacher Dashboard</span>
                        </div>
                    </div>

                    <!-- Stats Cards -->
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                            <div class="text-slate-500 text-xs font-bold mb-1">นักเรียนทั้งหมด</div>
                            <div class="text-2xl font-black text-slate-800" id="stat-total">0</div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                            <div class="text-slate-500 text-xs font-bold mb-1">ประเมินแล้ว</div>
                            <div class="text-2xl font-black text-blue-600" id="stat-assessed">0</div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                            <div class="text-emerald-600 text-xs font-bold mb-1">ผล: ปกติ</div>
                            <div class="text-2xl font-black text-emerald-600" id="stat-normal">0</div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                            <div class="text-amber-500 text-xs font-bold mb-1">ผล: เสี่ยง</div>
                            <div class="text-2xl font-black text-amber-500" id="stat-risk">0</div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                            <div class="text-rose-500 text-xs font-bold mb-1">ผล: มีปัญหา</div>
                            <div class="text-2xl font-black text-rose-500" id="stat-problem">0</div>
                        </div>
                    </div>

                    <!-- ตารางรายชื่อนักเรียน -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50">
                            <h3 class="font-bold text-lg text-slate-800" id="table-title">
                                <i class="fa-solid fa-list mr-2 text-indigo-500"></i> รายชื่อนักเรียน
                            </h3>
                            <div class="flex flex-wrap gap-2 justify-end items-center">
                                <div id="adminFilters" class="hidden items-center gap-3">
                                    <div class="w-48">
                                        <label class="block text-xs font-bold text-slate-500 mb-1">เลือกชั้น</label>
                                        <select id="classroomPicker" placeholder="เลือกชั้น/ห้อง..."></select>
                                    </div>
                                </div>
                                <button onclick="exportExcel()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-sm transition-colors flex items-center">
                                    <i class="fa-solid fa-file-excel mr-2"></i> ส่งออก Excel
                                </button>
                                <button onclick="printSummaryPDF()" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-sm transition-colors flex items-center">
                                    <i class="fa-solid fa-print mr-2"></i> พิมพ์สรุป
                                </button>
                            </div>
                        </div>
                        <div class="overflow-x-auto p-4">
                            <table id="mainTable" class="w-full text-sm text-left whitespace-nowrap dataTable">
                                <thead class="bg-slate-100 text-slate-600" id="dynamicThead"></thead>
                                <tbody class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </main>
            </div>
        </main>
    </div>

    <!-- Modal จัดการแอดมิน -->
    <div id="adminManagerModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center p-6 border-b border-slate-200">
                <h3 class="text-xl font-bold text-slate-800">
                    <i class="fa-solid fa-user-shield text-indigo-500 mr-2"></i>จัดการผู้ดูแลระบบ SDQ
                </h3>
                <button onclick="closeAdminManager()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-6">
                <div class="bg-slate-50 rounded-xl p-4">
                    <h4 class="font-bold text-slate-700 mb-3"><i class="fa-solid fa-plus-circle text-emerald-500 mr-1"></i> เพิ่มผู้ดูแลใหม่</h4>
                    <div class="flex gap-3">
                        <div class="flex-1">
                            <label class="block text-xs font-bold text-slate-500 mb-1">ค้นหาครู/บุคลากร</label>
                            <select id="personnelSelect" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500">
                                <option value="">-- เลือกบุคลากร --</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="addSDQAdmin()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-all shadow-md whitespace-nowrap">
                                <i class="fa-solid fa-user-plus mr-1"></i> แต่งตั้ง
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <h4 class="font-bold text-slate-700 mb-3">
                        <i class="fa-solid fa-list-check text-indigo-500 mr-1"></i> รายชื่อผู้ดูแลปัจจุบัน
                        <span id="adminCount" class="text-sm font-normal text-slate-400 ml-2"></span>
                    </h4>
                    <div id="adminList" class="space-y-2">
                        <div class="text-center text-slate-400 py-8">
                            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>กำลังโหลด...</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-slate-200 flex justify-end">
                <button onclick="closeAdminManager()" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-all">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Modal ฟอร์มประเมินสำหรับครู -->
    <div id="teacherStepForm" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-2xl w-full mx-auto shadow-2xl relative">
            <button onclick="closeTeacherStepForm()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl z-10">&times;</button>

            <div class="text-center mb-6 pb-3 border-b border-slate-200">
                <p class="text-sm text-slate-500">แบบประเมิน SDQ (ครู)</p>
                <p class="text-xl font-bold text-amber-700" id="teacherAssessStudentName">-</p>
                <p class="text-sm text-slate-500" id="teacherAssessRoomInfo"></p>
                <p class="text-xs text-slate-400 mt-1">โปรดตอบตามความเป็นจริงในช่วง 6 เดือนที่ผ่านมา</p>
            </div>

            <div class="flex justify-between items-center mb-3">
                <span id="teacherProgressText" class="badge badge-blue text-xs">ข้อที่ 1 / 25</span>
                <span id="teacherPercentText" class="text-sm font-bold text-amber-600">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2 mb-6 overflow-hidden">
                <div id="teacherProgressBar" class="bg-gradient-to-r from-amber-500 to-orange-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <div class="min-h-[100px] flex items-center justify-center mb-6">
                <h3 id="teacherQuestionText" class="text-xl font-bold text-center text-slate-800 leading-relaxed">...</h3>
            </div>

            <div class="space-y-3 max-w-md mx-auto">
                <label class="choice-label relative block cursor-pointer group">
                    <input type="radio" name="teacherChoice" value="0" class="peer sr-only" onchange="teacherSelectAnswer(0)">
                    <div class="radio-card p-4 border-2 border-slate-200 rounded-xl text-center font-medium text-slate-700 transition-all peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-checked:text-amber-700 peer-checked:font-bold bg-white hover:border-amber-300">ไม่จริง / ไม่ใช่เลย</div>
                </label>
                <label class="choice-label relative block cursor-pointer group">
                    <input type="radio" name="teacherChoice" value="1" class="peer sr-only" onchange="teacherSelectAnswer(1)">
                    <div class="radio-card p-4 border-2 border-slate-200 rounded-xl text-center font-medium text-slate-700 transition-all peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-checked:text-amber-700 peer-checked:font-bold bg-white hover:border-amber-300">ค่อนข้างจริง / ค่อนข้างใช่</div>
                </label>
                <label class="choice-label relative block cursor-pointer group">
                    <input type="radio" name="teacherChoice" value="2" class="peer sr-only" onchange="teacherSelectAnswer(2)">
                    <div class="radio-card p-4 border-2 border-slate-200 rounded-xl text-center font-medium text-slate-700 transition-all peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-checked:text-amber-700 peer-checked:font-bold bg-white hover:border-amber-300">จริง / ใช่เลย</div>
                </label>
            </div>

            <div class="flex justify-between mt-8 pt-4 border-t border-slate-100">
                <button id="teacherBtnPrev" onclick="teacherNavQuestion(-1)" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition-colors hidden">
                    <i class="fa-solid fa-arrow-left mr-2"></i>ย้อนกลับ
                </button>
                <div class="flex-1"></div>
                <button id="teacherBtnNext" onclick="teacherNavQuestion(1)" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold transition-all shadow-md hidden">
                    ถัดไป <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
                <button id="teacherBtnSubmit" onclick="submitTeacherAssessment()" class="px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white rounded-xl font-bold transition-all shadow-md hidden">
                    <i class="fa-solid fa-paper-plane mr-2"></i> ส่งแบบประเมิน
                </button>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Core scripts -->
    <script src="dashboard_ui.js"></script>
    <script src="dashboard_sidebar.js"></script>
    <script src="dashboard_charts.js"></script>
    <script src="sdq_teacher.js"></script>

    <!-- =======================================================
         Fallback Config + Init Module Sidebar
         ======================================================= -->
    <script>
        const MODULE_KEY  = 'sdq';
        const MODULE_NAME = 'ระบบ SDQ';

        function getSDQFallbackConfig() {
            const adminRoles = ['super_admin', 'admin'];
            return {
                brand: {
                    logo: 'https://i.ibb.co/94wLv5v/WRK-PNG-200px.png',
                    name: 'SDQ System',
                    subtitle: 'ระบบคัดกรองนักเรียน'
                },
                mainMenuTitle: 'เมนูหลัก',
                mainMenuCollapsible: false,
                mainMenu: [
                    { id: 'nav-home', icon: 'fa-house', label: 'หน้าหลัก', href: 'index.html' }
                ],
                showAllDepartments: false,
                departmentsTitle: '',
                departments: [],
                moduleMenus: [
                    {
                        title: 'ระบบ SDQ',
                        sectionId: 'sec-sdq',
                        collapsible: false,
                        defaultOpen: true,
                        items: [
                            {
                                id: 'nav-sdq-teacher',
                                icon: 'fa-clipboard-question',
                                label: 'ข้อมูล SDQ',
                                href: 'sdq_teacher.html',
                                icon_bg_color: '#6366f1',
                                icon_text_color: '#ffffff'
                            },
                            {
                                id: 'nav-sdq-admin',
                                icon: 'fa-chart-line',
                                label: 'แดชบอร์ด SDQ (Admin)',
                                href: 'sdq_admin.html',
                                roles: adminRoles,
                                icon_bg_color: '#0ea5e9',
                                icon_text_color: '#ffffff'
                            },
                            {
                                id: 'nav-sdq-admin-manager',
                                icon: 'fa-user-shield',
                                label: 'จัดการแอดมิน',
                                onclick: 'openAdminManager()',
                                roles: adminRoles,
                                icon_bg_color: '#8b5cf6',
                                icon_text_color: '#ffffff'
                            }
                        ]
                    }
                ],
                footerMenuTitle: 'การตั้งค่า',
                footerCollapsible: false,
                footerMenu: [],
                logoutItem: {
                    icon: 'fa-power-off',
                    label: 'ออกจากระบบ',
                    onclick: 'logout()',
                    class: 'logout'
                },
                facebook: {
                    href: 'https://www.facebook.com/WRKOfficial',
                    icon: 'fa-brands fa-facebook',
                    label: 'ติดตามเพจโรงเรียน'
                }
            };
        }

        initModuleSidebar({
            moduleKey: MODULE_KEY,
            pageTitle: 'ระบบ SDQ สำหรับครู',
            activeId: 'nav-sdq-teacher',
            topbarButtons: [
                {
                    id: 'btnAdminMode',
                    icon: 'fa-solid fa-user-shield',
                    label: 'โหมดแอดมิน',
                    onclick: 'toggleTeacherAdminMode()',
                    class: 'hidden d-btn-mode admin',
                    title: 'สลับโหมดมุมมอง'
                }
            ],
            fallbackConfig: getSDQFallbackConfig()
        });
    </script>

</body>

</html>
