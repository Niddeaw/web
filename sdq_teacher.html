<!DOCTYPE html>
<html lang="th">
<head>
    <title>ระบบ SDQ | WRK System</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen pb-10 opacity-0 transition-opacity duration-300" id="mainBody">

    <nav class="glass-panel mx-4 mt-4 p-4 sticky top-4 z-40 flex justify-between items-center shadow-sm rounded-2xl border border-slate-200">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-200">
                <i class="fas fa-clipboard-question text-xl w-6 text-center"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-indigo-900 uppercase tracking-tight">SDQ System</h1>
                <p id="mode-subtitle" class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">กำลังโหลด...</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-3">
            <div id="roleSwitchContainer"></div>

            <div class="text-right hidden md:block mr-2 border-l pl-3 border-slate-300">
                <span id="user-display" class="block text-sm font-bold text-slate-700">กำลังโหลด...</span>
            </div>

            <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors">
                <i class="fas fa-sign-out-alt text-lg"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 mt-8 space-y-6">
        
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                <div class="text-slate-500 text-xs font-bold mb-1">นักเรียนทั้งหมด</div>
                <div class="text-2xl font-black text-slate-800" id="stat-total">0</div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                <div class="text-slate-500 text-xs font-bold mb-1">ประเมินแล้ว</div>
                <div class="text-2xl font-black text-blue-600" id="stat-assessed">0</div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                <div class="text-emerald-600 text-xs font-bold mb-1">ผล: ปกติ</div>
                <div class="text-2xl font-black text-emerald-600" id="stat-normal">0</div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                <div class="text-amber-500 text-xs font-bold mb-1">ผล: เสี่ยง</div>
                <div class="text-2xl font-black text-amber-500" id="stat-risk">0</div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                <div class="text-rose-500 text-xs font-bold mb-1">ผล: มีปัญหา</div>
                <div class="text-2xl font-black text-rose-500" id="stat-problem">0</div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50">
                <div class="flex items-center gap-2">
                    <h3 class="font-bold text-lg text-slate-800" id="table-title"><i class="fa-solid fa-list mr-2 text-indigo-500"></i> รายชื่อนักเรียน</h3>
                </div>
                
                <div class="flex flex-wrap gap-2 justify-end">
                    <div id="adminFilters" class="hidden flex items-center gap-2 mr-4">
                        <select id="filterGrade" class="px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">ทุกระดับชั้น</option>
                            <option value="1">ม.1</option><option value="2">ม.2</option><option value="3">ม.3</option>
                            <option value="4">ม.4</option><option value="5">ม.5</option><option value="6">ม.6</option>
                        </select>
                        <input type="number" id="filterRoom" placeholder="ห้อง (เช่น 1)" class="w-24 px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <button onclick="exportExcel()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-sm transition-colors flex items-center">
                        <i class="fa-solid fa-file-excel mr-2"></i> ส่งออก Excel
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto p-4">
                <table id="mainTable" class="w-full text-sm text-left whitespace-nowrap dataTable">
                    <thead class="bg-slate-100 text-slate-600" id="dynamicThead">
                        </thead>
                    <tbody class="divide-y divide-slate-100"></tbody>
                </table>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="sdq_teacher.js"></script>
</body>
</html>
