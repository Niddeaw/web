            <!-- ================= Topbar ================= -->

                <button class="d-collapse" id="collapseBtn" onclick="toggleSidebarCollapse()" title="ย่อ/ขยายเมนู">
                    <i class="fa-solid fa-angles-left"></i>

                <h2 id="pageTitle" style="margin:0;font-size:16px;font-weight:700;color:#26364a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">

                <!-- ========== ปุ่มโหมด (แสดงตามสิทธิ์) ========== -->

                    <span>หัวหน้ากลุ่มฯ</span>

                <!-- 🔵 แอดมิน -->
                <button id="btnModeAdmin" onclick="toggleRoleView()" class="hidden d-btn-mode admin" title="โหมดแอดมิน">

                <!-- 🌹 ครู -->
                <button id="btnModeTeacher" onclick="switchToTeacherMode()" class="hidden d-btn-mode teacher" title="โหมดครู">
                    <i class="fas fa-chalkboard-user"></i>

                <!-- ========== ปุ่มตั้งค่าการแสดงผล (font/density) ========== -->
                <div class="d-settings-wrap">
                    <button class="d-settings-btn" id="settingsBtn" onclick="toggleSettingsMenu()" title="ตั้งค่าการแสดงผล">

                    </button>
                    <div class="d-settings-menu" id="settingsMenu">

                        <div class="d-settings-options">
                            <button type="button" data-font="small" onclick="setFontSize('small')">เล็ก</button>
                            <button type="button" data-font="normal" onclick="setFontSize('normal')">ปกติ</button>
                            <button type="button" data-font="large" onclick="setFontSize('large')">ใหญ่</button>

                        <div class="d-settings-title">ความหนาแน่น</div>
                        <div class="d-settings-options cols-2">

            <!-- ================= เนื้อหาโมดูล ================= -->
            <div style="padding:0 0 12px;" class="space-y-6">

                <!-- ========= Section 1 ========= -->
                <section id="tab-section1" class="tab-content">

                        <!-- เนื้อหา: กรอกข้อมูลของคุณตรงนี้ -->
                        <div class="text-center text-slate-400 py-10">
                            <i class="fas fa-box-open text-4xl mb-3 text-slate-300"></i>
                            <p>เพิ่มเนื้อหาโมดูลที่นี่</p>
                        </div>
                    </div>
                </section>

                <!-- ========= Section 2 ========= -->
                <section id="tab-section2" class="tab-content hidden">
                    <div class="glass-panel p-6 rounded-2xl shadow-sm">
                        <h3 class="text-lg font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2 flex items-center gap-2">
                            <i class="fas fa-chart-line text-indigo-600"></i>
                            ส่วนที่ 2
                        </h3>

                        <div class="text-center text-slate-400 py-10">
                            <i class="fas fa-box-open text-4xl mb-3 text-slate-300"></i>

    <!-- ================= Modals ================= -->

            <div class="p-6 overflow-y-auto flex-1">

            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                <button onclick="closeMyModal()" class="px-6 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold transition">ปิด</button>
                <button onclick="saveMyModal()" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md transition">บันทึก</button>
            </div>

    <!-- ================= Scripts ================= -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- ✅ ไฟล์กลาง — ต้องโหลดก่อน script เฉพาะโมดูล -->
    <script src="dashboard_ui.js"></script>

    <!-- ✅ Script เฉพาะโมดูล -->
    <script>
        // =======================================================
        // State
        // =======================================================
        let currentUser = null;
        let currentProfile = null;
        let currentViewRole = 'teacher'; // 'teacher' | 'admin' | 'depthead'
        let isReadOnly = false;

        // =======================================================
        // Init
        // =======================================================
        $(document).ready(async function () {
            try {
                // ✅ 1. ตรวจสอบเซสชันและสิทธิ์
                const result = await checkSessionAndRole('ชื่อโมดูล', WRK_ROLES.ALLOWED);
                if (!result) return;

                const { user, personnel, role } = result;
                currentUser = user;
                currentProfile = personnel;

                // ✅ 2. ตั้งค่า UI มาตรฐาน (จาก dashboard_ui.js)
                setUserDisplayName(personnel);
                updateUserRoleLabel(role);
                renderUserAvatar(personnel);

                // ✅ 3. ตั้งค่า Role-based UI
                applyRoleUI(role);

                // ✅ 4. โหลดข้อมูลโมดูล
                await loadModuleData();

                // ✅ 5. Log การเข้าใช้งาน
                if (typeof logUserAction === 'function') {
                    await logUserAction('เข้าสู่ระบบชื่อโมดูล', 'ชื่อโมดูล');
                }

                console.log('✅ Module initialized successfully');
            } catch (err) {
                console.error('❌ Initialization error:', err);
                Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
            } finally {
                // ✅ 6. แสดงหน้าเว็บ (ลบ opacity-0) — สำคัญมาก!
                document.getElementById('mainBody').classList.replace('opacity-0', 'opacity-100');
            }
        });

        // =======================================================
        // Role UI
        // =======================================================
        function applyRoleUI(role) {
            const isAdmin = isAdminUser(role, false);
            const isSuperAdmin = role === 'super_admin';

            // ปุ่ม mode admin — แสดงเฉพาะ admin
            const btnAdmin = document.getElementById('btnModeAdmin');
            if (btnAdmin) {
                btnAdmin.classList.toggle('hidden', !isAdmin);
                btnAdmin.classList.toggle('flex', isAdmin);
            }

            // ปุ่ม settings (sidebar) — แสดงเมื่อ canManageSettings
            const btnSettings = document.getElementById('btn-settings');
            if (btnSettings) {
                const canSettings = typeof canManageSettings === 'function'
                    ? canManageSettings(role)
                    : isAdmin;
                btnSettings.classList.toggle('hidden', !canSettings);
                btnSettings.classList.toggle('flex', canSettings);
            }
        }

        // =======================================================
        // Tab Switching (ถ้ามีเมนูย่อย)
        // =======================================================
        function switchTab(tabId) {
            // ซ่อนทุก tab content
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            // แสดง tab ที่เลือก
            const target = document.getElementById('tab-' + tabId);
            if (target) target.classList.remove('hidden');

            // Active state ของเมนู
            document.querySelectorAll('.tab-nav-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + tabId);
            if (activeBtn) activeBtn.classList.add('active');

            // อัปเดต title
            const titles = {
                'section1': 'ส่วนที่ 1',
                'section2': 'ส่วนที่ 2'
            };
            const titleEl = document.getElementById('pageTitle');
            if (titleEl) titleEl.textContent = titles[tabId] || 'ชื่อโมดูล';

            // ปิด sidebar บนมือถือ
            if (window.innerWidth < 761 && typeof toggleSidebar === 'function') {
                toggleSidebar(false);
            }

            // ✅ ปรับตาราง DataTable (ถ้ามี)
            if (typeof dataTable !== 'undefined' && dataTable) {
                setTimeout(() => dataTable.columns.adjust().draw(), 100);
            }
        }

        // =======================================================
        // Mode Toggle
        // =======================================================
        function toggleRoleView() {
            if (!isAdminUser(currentUser?.role, false)) {
                Swal.fire('ไม่มีสิทธิ์', 'เฉพาะผู้ดูแลระบบเท่านั้น', 'warning');
                return;
            }

            currentViewRole = (currentViewRole === 'admin') ? 'teacher' : 'admin';
            localStorage.setItem('module_admin_mode', currentViewRole === 'admin' ? 'true' : 'false');

            if (typeof updateToggleModeUI === 'function') {
                updateToggleModeUI(currentUser.role, currentViewRole === 'admin', 'btnModeAdmin');
            }

            loadModuleData();

            Swal.fire({
                toast: true, position: 'top-end', icon: 'info',
                title: currentViewRole === 'admin' ? 'เปลี่ยนเป็นโหมดแอดมิน' : 'เปลี่ยนเป็นโหมดครู',
                showConfirmButton: false, timer: 1500
            });
        }

        function switchToTeacherMode() {
            window.location.href = 'index.html';
        }

        function switchToDeptHeadMode() {
            window.location.href = 'index.html';
        }

        // =======================================================
        // Logout (ใช้ handleLogout จาก dashboard_ui.js)
        // =======================================================
        function logout() {
            if (typeof handleLogout === 'function') return handleLogout();
            // fallback (กรณี dashboard_ui.js โหลดไม่สำเร็จ)
            Swal.fire({
                title: 'ออกจากระบบ?', icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#dc2626',
                confirmButtonText: 'ออกจากระบบ', cancelButtonText: 'ยกเลิก'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await db.auth.signOut();
                    window.location.replace('login.html');
                }
            });
        }

        // =======================================================
        // Load Module Data (แก้ไขตามโมดูล)
        // =======================================================
        async function loadModuleData() {
            // TODO: โหลดข้อมูลเฉพาะโมดูล
            // ตัวอย่าง:
            // const { data, error } = await db.from('my_table').select('*');
            // if (error) { console.error(error); return; }
            // renderMyData(data);
            console.log('📦 Loading module data...');
        }

        // =======================================================
        // Settings (ถ้ามี)
        // =======================================================
        function openSettings() {
            if (typeof canManageSettings === 'function' && !canManageSettings(currentUser?.role)) {
                Swal.fire('ไม่มีสิทธิ์', 'เฉพาะผู้ดูแลระบบเท่านั้น', 'warning');
                return;
            }
            // TODO: เปิด Modal ตั้งค่า
            Swal.fire('ตั้งค่าระบบ', 'ยังไม่พัฒนา', 'info');
        }

        // =======================================================
        // Expose global functions (สำหรับ onclick="...")
        // =======================================================
        window.switchTab = switchTab;
        window.toggleRoleView = toggleRoleView;
        window.switchToTeacherMode = switchToTeacherMode;
        window.switchToDeptHeadMode = switchToDeptHeadMode;
        window.logout = logout;
        window.openSettings = openSettings;
    </script>
</body>
