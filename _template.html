<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชื่อโมดูล | WRK System</title>

    <!-- 1. Libraries + Config กลาง -->
    <script src="core_head.js"></script>
    <script src="config.js"></script>

    <!-- 2. CSS กลาง (Mobile + Tablet รวมอยู่ใน dashboard.css แล้ว) -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">

    <!-- 3. CSS เฉพาะโมดูล -->
    <style>
        /* ==========================================================
           CSS เฉพาะโมดูล — ใส่ที่นี่
           ❌ ห้ามใส่ mobile sidebar/overlay ที่นี่ — มีใน dashboard.css แล้ว
           ========================================================== */
    </style>
</head>

<body class="text-gray-800 min-h-screen opacity-0 transition-opacity duration-500" id="mainBody">

    <div class="d-app">

        <!-- ================= Sidebar (placeholder) ================= -->
        <aside class="d-sidebar" id="dSidebar"></aside>
        <div class="d-overlay" id="dOverlay" onclick="toggleSidebar(false)"></div>

        <!-- ================= Main ================= -->
        <main class="d-main" id="dMain">

            <!-- ================= Topbar (placeholder) ================= -->
            <header class="d-topbar" id="dTopbar"></header>

            <!-- ================= เนื้อหาโมดูล ================= -->
            <div style="padding:0 0 12px;" class="space-y-6">

                <!-- ========= Section 1 ========= -->
                <section id="tab-section1" class="tab-content">
                    <div class="glass-panel p-6 rounded-2xl shadow-sm">
                        <h3 class="text-lg font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2 flex items-center gap-2">
                            <i class="fas fa-list text-indigo-600"></i>
                            ส่วนที่ 1
                        </h3>

                        <div class="text-center text-slate-400 py-10">
                            <i class="fas fa-box-open text-4xl mb-3 text-slate-300"></i>
                            <p>เพิ่มเนื้อหาโมดูลที่นี่</p>
                        </div>
                    </div>
                </section>

                <!-- ========= Section 2 ========= -->
                <section id="tab-section2" class="tab-content hidden">
                    <div class="glass-panel p-6 rounded-2xl shadow-sm">
                        <h3 class="text-lg font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2 flex items-center gap-2">
                            <i class="fas fa-chart-line text-indigo-600"></i>
                            ส่วนที่ 2
                        </h3>

                        <div class="text-center text-slate-400 py-10">
                            <i class="fas fa-box-open text-4xl mb-3 text-slate-300"></i>
                            <p>เพิ่มเนื้อหาโมดูลที่นี่</p>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <!-- ================= Libraries ================= -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- ================= Core scripts ================= -->
    <script src="dashboard_ui.js"></script>
    <script src="dashboard_sidebar.js"></script>
    <script src="dashboard_charts.js"></script>

    <!-- ================= Script เฉพาะโมดูล ================= -->
    <script src="ชื่อโมดูล.js"></script>

    <!-- =======================================================
         ✅ Fallback Config + Init Module Sidebar
         ======================================================= -->
    <script>
        // =======================================================
        // Constants (ใช้ใน fallback + ใน .js)
        // =======================================================
        const MODULE_KEY  = 'ชื่อโมดูล';           // เช่น 'attendance', 'guidance'
        const MODULE_NAME = 'ชื่อโมดูล';           // ชื่อที่แสดงบน topbar

        // =======================================================
        // ✅ Fallback Sidebar Config (ใช้เมื่อโหลด DB ไม่ได้)
        // =======================================================
        function getModuleFallbackConfig() {
            return {
                brand: {
                    logo: 'https://i.ibb.co/94wLv5v/WRK-PNG-200px.png',
                    name: 'WRK System',
                    subtitle: MODULE_NAME
                },
                mainMenuTitle: 'เมนูหลัก',
                mainMenuCollapsible: false,
                mainMenu: [
                    { id: 'nav-home', icon: 'fa-house', label: 'หน้าหลัก', href: 'index.html' }
                ],
                showAllDepartments: false,
                departmentsTitle: '',
                departments: [],
                moduleMenus: [
                    {
                        title: 'โมดูล',
                        sectionId: 'sec-module',
                        collapsible: false,
                        defaultOpen: true,
                        items: [
                            { id: 'nav-1', icon: 'fa-list', label: 'ส่วนที่ 1', onclick: "switchTab('section1')" },
                            { id: 'nav-2', icon: 'fa-chart-line', label: 'ส่วนที่ 2', onclick: "switchTab('section2')" }
                        ]
                    }
                ],
                footerMenuTitle: 'การตั้งค่า',
                footerCollapsible: false,
                footerMenu: [
                    { id: 'btn-settings', icon: 'fa-gear', label: 'ตั้งค่าระบบ', onclick: 'openSettings()', roles: ['super_admin', 'admin'] }
                ],
                logoutItem: {
                    icon: 'fa-power-off',
                    label: 'ออกจากระบบ',
                    onclick: 'logout()',
                    class: 'logout'
                },
                facebook: {
                    href: 'https://www.facebook.com/WRKOfficial',
                    icon: 'fa-brands fa-facebook',
                    label: 'ติดตามเพจโรงเรียน'
                }
            };
        }

        // =======================================================
        // ✅ Init Module Sidebar (เรียกครั้งเดียว จบ)
        // =======================================================
        initModuleSidebar({
            moduleKey: MODULE_KEY,
            pageTitle: MODULE_NAME,
            activeId: 'nav-1',
            topbarButtons: [
                {
                    id: 'btnAdminMode',
                    icon: 'fa-solid fa-user-shield',
                    label: 'โหมดแอดมิน',
                    onclick: 'toggleRoleView()',
                    class: 'hidden d-btn-mode admin',
                    title: 'สลับโหมดมุมมอง'
                }
            ],
            fallbackConfig: getModuleFallbackConfig()
        });
    </script>

</body>

</html>
