<!DOCTYPE html>
<html lang="th">

<head>
    <title>เช็คชื่อของฉัน | WRK System</title>
    <!-- 1. โหลด Library ส่วนกลางทั้งหมดผ่านไฟล์เดียว -->
    <script src="core_head.js"></script>

    <!-- 2. โหลด Script และ CSS ที่เฉพาะเจาะจงสำหรับหน้านี้เท่านั้น -->
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen text-slate-800 pb-10">
    <nav class="glass-panel mx-4 mt-4 p-4 sticky top-4 z-40 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-emerald-600 p-2.5 rounded-xl text-white shadow-lg shadow-emerald-200">
                <i class="fas fa-user-graduate text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-emerald-900 uppercase tracking-tight">My Attendance</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">ประวัติการเช็คชื่อของฉัน</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="text-right hidden md:block mr-2">
                <span id="user-display" class="block text-sm font-bold text-slate-700">กำลังโหลด...</span>
            </div>

            <button onclick="window.location.href='student_index.html'"
                class="h-10 w-10 flex items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 hover:bg-emerald-100 transition border border-emerald-200 shadow-sm"
                title="กลับหน้าหลัก">
                <i class="fas fa-house text-sm"></i>
            </button>
            <button onclick="logout()"
                class="bg-rose-50 text-rose-600 h-10 w-10 flex items-center justify-center rounded-xl hover:bg-rose-100 transition-colors shadow-sm"
                title="ออกจากระบบ">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

<main class="mx-4 mt-6 max-w-5xl md:mx-auto relative z-10">
        
        <div class="bg-white/80 backdrop-blur-xl rounded-[2rem] p-6 md:p-8 flex flex-col md:flex-row items-center gap-6 border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative overflow-hidden transition-all duration-300 hover:shadow-[0_8px_30px_rgba(16,185,129,0.08)]">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-emerald-400/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-blue-400/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <i class="fas fa-id-card absolute -right-6 -bottom-6 text-8xl text-emerald-50/50 z-0 -rotate-12"></i>

            <div class="w-28 h-28 shrink-0 rounded-[1.5rem] bg-emerald-50 text-emerald-300 flex items-center justify-center border-4 border-white shadow-lg overflow-hidden z-10 rotate-3 transition-transform hover:rotate-0 duration-300">
                <img id="student-avatar" src="" alt="Profile" class="w-full h-full object-cover hidden"
                    onerror="this.onerror=null; this.src='https://i.ibb.co/94wLv5v/WRK-PNG-200px.png';">
                <i id="student-avatar-placeholder" class="fas fa-user text-5xl"></i>
            </div>
            
            <div class="text-center md:text-left z-10">
                <p class="text-xs font-black text-emerald-500 uppercase tracking-widest mb-1 bg-emerald-50 inline-block px-3 py-1 rounded-full border border-emerald-100">ข้อมูลนักเรียน</p>
                <h2 id="student-fullname" class="text-2xl font-bold text-slate-800 mb-2 mt-2 leading-tight">กำลังโหลดข้อมูล...</h2>
                <div id="student-info" class="text-sm font-medium text-slate-500 space-y-1">
                    <p><i class="fas fa-spinner fa-spin mr-1"></i> กรุณารอสักครู่...</p>
                </div>
            </div>
            
            <div class="md:ml-auto z-10 mt-4 md:mt-0">
                <button onclick="exportToPDF()" class="px-5 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white rounded-2xl font-bold shadow-md shadow-emerald-500/20 transition-all duration-300 hover:-translate-y-1 flex items-center gap-2">
                    <i class="fas fa-file-pdf fa-bounce" style="--fa-animation-duration: 2s;"></i> บันทึก PDF
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4 mt-6 mb-8">
            <div class="bg-gradient-to-br from-emerald-50/90 to-white/90 backdrop-blur-md p-5 rounded-3xl flex flex-col items-center justify-center text-center shadow-sm border border-emerald-100 transition-all duration-300 hover:shadow-md hover:shadow-emerald-100 hover:-translate-y-1 group">
                <div class="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300">
                    <i class="fa-solid fa-check-double text-lg"></i>
                </div>
                <p class="text-[11px] text-emerald-600/70 font-bold uppercase tracking-wider mb-1">มาเรียน</p>
                <p class="text-3xl font-black text-emerald-600" id="count-present">0</p>
            </div>

            <div class="bg-gradient-to-br from-rose-50/90 to-white/90 backdrop-blur-md p-5 rounded-3xl flex flex-col items-center justify-center text-center shadow-sm border border-rose-100 transition-all duration-300 hover:shadow-md hover:shadow-rose-100 hover:-translate-y-1 group">
                <div class="w-10 h-10 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300">
                    <i class="fa-solid fa-user-xmark text-lg"></i>
                </div>
                <p class="text-[11px] text-rose-600/70 font-bold uppercase tracking-wider mb-1">ขาดเรียน</p>
                <p class="text-3xl font-black text-rose-600" id="count-absent">0</p>
            </div>

            <div class="bg-gradient-to-br from-orange-50/90 to-white/90 backdrop-blur-md p-5 rounded-3xl flex flex-col items-center justify-center text-center shadow-sm border border-orange-100 transition-all duration-300 hover:shadow-md hover:shadow-orange-100 hover:-translate-y-1 group">
                <div class="w-10 h-10 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300">
                    <i class="fa-solid fa-person-running text-lg"></i>
                </div>
                <p class="text-[11px] text-orange-600/70 font-bold uppercase tracking-wider mb-1">มาสาย</p>
                <p class="text-3xl font-black text-orange-600" id="count-late">0</p>
            </div>

            <div class="bg-gradient-to-br from-yellow-50/90 to-white/90 backdrop-blur-md p-5 rounded-3xl flex flex-col items-center justify-center text-center shadow-sm border border-yellow-100 transition-all duration-300 hover:shadow-md hover:shadow-yellow-100 hover:-translate-y-1 group">
                <div class="w-10 h-10 rounded-2xl bg-yellow-100 text-yellow-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300">
                    <i class="fa-solid fa-envelope-open-text text-lg"></i>
                </div>
                <p class="text-[11px] text-yellow-600/70 font-bold uppercase tracking-wider mb-1">ลากิจ</p>
                <p class="text-3xl font-black text-yellow-600" id="count-leave">0</p>
            </div>

            <div class="bg-gradient-to-br from-blue-50/90 to-white/90 backdrop-blur-md p-5 rounded-3xl flex flex-col items-center justify-center text-center shadow-sm border border-blue-100 transition-all duration-300 hover:shadow-md hover:shadow-blue-100 hover:-translate-y-1 group">
                <div class="w-10 h-10 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300">
                    <i class="fa-solid fa-briefcase-medical text-lg"></i>
                </div>
                <p class="text-[11px] text-blue-600/70 font-bold uppercase tracking-wider mb-1">ลาป่วย</p>
                <p class="text-3xl font-black text-blue-600" id="count-sick">0</p>
            </div>
        </div>

        <div class="bg-white/80 backdrop-blur-xl overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white rounded-[2rem] mb-10">
            <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center">
                    <i class="fas fa-history text-sm"></i>
                </div>
                <h3 class="font-bold text-slate-700 text-lg">ประวัติการเช็คชื่อทั้งหมด</h3>
            </div>
            
            <div class="overflow-x-auto min-h-[300px] p-2">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-400">
                            <th class="px-6 py-4 text-[11px] font-black uppercase tracking-[0.2em] border-b border-slate-100">วันที่</th>
                            <th class="px-6 py-4 text-[11px] font-black uppercase tracking-[0.2em] text-center border-b border-slate-100">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="history-list" class="divide-y divide-slate-50">
                        <tr>
                            <td colspan="2" class="px-6 py-24 text-center">
                                <i class="fas fa-spinner fa-spin text-4xl text-emerald-200 mb-4"></i>
                                <p class="text-slate-400 font-medium tracking-wide">กำลังดึงข้อมูลประวัติของคุณ...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="attendance_student.js"></script>
</body>

</html>
