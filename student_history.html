<!DOCTYPE html>
<html lang="th">
<head>
    <title>ประวัตินักเรียนรายคน | WRK System</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 md:p-8 text-slate-800">
    <div class="max-w-5xl mx-auto">
        <button onclick="history.back()"
            class="mb-4 text-slate-500 hover:text-blue-600 font-bold transition flex items-center gap-2 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200">
            <i class="fas fa-arrow-left"></i> กลับหน้าก่อนหน้า
        </button>

        <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-xl overflow-hidden border border-white">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-white flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-4">
                    <!-- Container รูปโปรไฟล์ : แสดงรูปหรือไอคอนตามข้อมูล avatar_students_url -->
                    <div id="avatar_container"
                        class="h-20 w-20 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center text-4xl border border-white/30 shadow-inner overflow-hidden relative">
                        <i id="st_avatar_icon" class="fas fa-user-graduate"></i>
                        <img id="st_avatar_img" src="" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl" alt="รูปโปรไฟล์">
                    </div>
                    <div>
                        <h1 id="st_name" class="text-2xl font-bold">กำลังโหลดข้อมูล...</h1>
                        <p id="st_info" class="text-blue-100 mt-1"></p>
                    </div>
                </div>
                <div class="text-center bg-white/10 px-6 py-4 rounded-2xl backdrop-blur-md border border-white/20 shadow-inner">
                    <p class="text-xs uppercase font-bold text-blue-100 tracking-wider mb-1">คะแนนปัจจุบัน</p>
                    <h2 id="st_score" class="text-5xl font-black">--</h2>
                </div>
            </div>

            <!-- Table -->
            <div class="p-6 md:p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-blue-500"></i> ประวัติการบันทึกทั้งหมด
                    </h3>
                </div>
                <div class="overflow-x-auto bg-white rounded-2xl border border-slate-100">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 text-slate-600 border-b border-slate-100">
                            <tr id="table_headers"></tr>
                        </thead>
                        <tbody id="history_body" class="divide-y divide-slate-100">
                            <tr><td colspan="7" class="p-8 text-center text-slate-400">กำลังโหลด...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Edit Modal ── -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-6 flex items-center">
                <i class="fas fa-pen mr-3 text-yellow-500"></i>แก้ไขรายการบันทึก
            </h2>
            <div class="space-y-4">
                <input type="hidden" id="edit_log_id">
                <input type="hidden" id="edit_old_evidence_url">

                <!-- เกณฑ์ -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">รายการเกณฑ์</label>
                    <select id="edit_criteria" onchange="updateEditScore()"
                        class="w-full border-2 border-slate-200 rounded-xl p-3 outline-none bg-white focus:border-yellow-500 transition"></select>
                </div>

                <!-- คะแนน -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">คะแนน (ใส่เครื่องหมาย + หรือ - ให้ถูกต้อง)</label>
                    <input type="number" id="edit_score"
                        class="w-full border-2 border-slate-200 rounded-xl p-3 outline-none text-center font-bold text-lg focus:border-yellow-500 transition">
                </div>

                <!-- รายละเอียด -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">รายละเอียดเพิ่มเติม</label>
                    <textarea id="edit_desc" rows="2"
                        class="w-full border-2 border-slate-200 rounded-xl p-3 outline-none focus:border-yellow-500 transition"></textarea>
                </div>

                <!-- ── หลักฐาน ── -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">หลักฐาน</label>

                    <!-- รูปปัจจุบัน -->
                    <div id="edit_current_evidence" class="hidden mb-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <p class="text-xs text-slate-500 mb-2 font-bold">หลักฐานปัจจุบัน:</p>
                        <img id="edit_evidence_current_img" src="" alt="หลักฐาน"
                            class="w-full max-h-48 object-contain rounded-lg border border-slate-200 mb-2 bg-white"
                            onerror="this.src=''; this.classList.add('hidden'); document.getElementById('edit_evidence_img_error').classList.remove('hidden');">
                        <div id="edit_evidence_img_error" class="hidden text-xs text-amber-600 mb-2">
                            <i class="fas fa-exclamation-triangle mr-1"></i>ไม่สามารถแสดงรูปตัวอย่างได้
                        </div>
                        <a id="edit_evidence_current_link" href="" target="_blank"
                            class="text-blue-500 text-xs underline hover:text-blue-700">
                            <i class="fas fa-external-link-alt mr-1"></i>เปิดดูรูปต้นฉบับ
                        </a>
                    </div>
                    <div id="edit_no_evidence" class="hidden mb-3">
                        <p class="text-xs text-slate-400 italic"><i class="fas fa-image mr-1"></i>ไม่มีหลักฐานแนบ</p>
                    </div>

                    <!-- ปุ่มเลือกการจัดการรูป -->
                    <div class="flex gap-2 mb-3">
                        <button id="btn_img_keep" onclick="setImageAction('keep')"
                            class="flex-1 py-2 rounded-xl text-xs font-bold border-2 border-slate-200 text-slate-600 bg-white transition">
                            <i class="fas fa-lock mr-1"></i>คงเดิม
                        </button>
                        <button id="btn_img_replace" onclick="setImageAction('replace')"
                            class="flex-1 py-2 rounded-xl text-xs font-bold border-2 border-slate-200 text-slate-600 bg-white transition">
                            <i class="fas fa-sync-alt mr-1"></i>เปลี่ยนรูป
                        </button>
                        <button id="btn_img_remove" onclick="setImageAction('remove')"
                            class="flex-1 py-2 rounded-xl text-xs font-bold border-2 border-slate-200 text-slate-600 bg-white transition hidden">
                            <i class="fas fa-trash mr-1"></i>ลบรูป
                        </button>
                    </div>

                    <!-- อัปโหลดรูปใหม่ (แสดงเมื่อ action = replace) -->
                    <div id="edit_new_image_section" class="hidden">
                        <input type="file" id="edit_evidence_file" accept="image/*"
                            class="w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-green-50 file:text-green-600 hover:file:bg-green-100 cursor-pointer border-2 border-dashed border-green-300 rounded-xl p-2">
                        <img id="edit_evidence_preview" src=""
                            class="hidden w-full max-h-48 object-contain rounded-xl border border-slate-200 mt-2">
                    </div>
                </div>

                <!-- ปุ่มบันทึก/ยกเลิก -->
                <div class="flex gap-3 pt-4">
                    <button onclick="closeEditModal()"
                        class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-gray-600 hover:bg-gray-200 transition">
                        ยกเลิก
                    </button>
                    <button onclick="saveEditLog()"
                        class="flex-1 py-3 rounded-xl bg-yellow-500 text-white font-bold hover:bg-yellow-600 shadow-md transition">
                        <i class="fas fa-save mr-2"></i>บันทึกการแก้ไข
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const stId = urlParams.get('id');

        let currentLogs = [];
        let criteriaList = [];
        let currentUserId = null;
        let isAdmin = false;
        let isSuperAdmin = false;
        let systemConfig = null;
        let editImageAction = 'keep';

        $(document).ready(async () => {
            if (!stId) return history.back();
            await loadSystemConfig();
            await checkRole();
            await loadCriteria();
            loadHistory();

            $('#edit_evidence_file').on('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = e => $('#edit_evidence_preview').attr('src', e.target.result).removeClass('hidden');
                    reader.readAsDataURL(file);
                } else {
                    $('#edit_evidence_preview').addClass('hidden');
                }
            });
        });

        async function loadSystemConfig() {
            const { data } = await db.from('behavior_system_config').select('*').eq('id', 1).maybeSingle();
            systemConfig = data || null;
        }

        function getFileIdFromUrl(url) {
            if (!url) return null;
            const m = url.match(/\/d\/([-\w]+)/) || url.match(/[?&]id=([-\w]+)/);
            return m ? m[1] : null;
        }

        function getDriveImageUrl(url) {
            if (!url) return null;
            const fileId = getFileIdFromUrl(url);
            if (!fileId) return url;
            return `https://lh5.googleusercontent.com/d/${fileId}`;
        }

        async function checkRole() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.replace('index.html'); return; }

            currentUserId = session.user.id;
            const { data: profile } = await db.from('core_personnel').select('*').eq('id', session.user.id).single();
            if (!profile) return;

            if (profile.role === 'super_admin') {
                isSuperAdmin = true;
                isAdmin = true;
            } else {
                const { data: sInfo } = await db.from('core_school_info').select('current_academic_year').single();
                if (sInfo?.current_academic_year) {
                    const { data: disc } = await db.from('core_discipline_heads')
                        .select('id').eq('personnel_id', session.user.id)
                        .eq('academic_year', sInfo.current_academic_year).maybeSingle();
                    if (disc) isAdmin = true;
                }
                if (!isAdmin) {
                    const { data: grade } = await db.from('behavior_grade_heads')
                        .select('id').eq('teacher_id', session.user.id).maybeSingle();
                    if (grade) isAdmin = true;
                }
            }

            let headers = `
                <th class="p-4 font-bold">วันที่/เวลา</th>
                <th class="p-4 font-bold">รายการ</th>
                <th class="p-4 font-bold">รายละเอียด</th>
                <th class="p-4 text-center font-bold">คะแนน</th>
                <th class="p-4 text-center font-bold">หลักฐาน</th>
                <th class="p-4 font-bold">ผู้บันทึก/แก้ไขล่าสุด</th>`;
            if (isAdmin) headers += `<th class="p-4 text-center font-bold">จัดการ</th>`;
            $('#table_headers').html(headers);
        }

        async function loadCriteria() {
            const { data } = await db.from('behavior_criteria').select('*');
            if (data) criteriaList = data;
        }

        async function loadHistory() {
            const { data: student, error } = await db.from('core_students').select(`
                *,
                behavior_logs ( *, behavior_criteria ( title, category ), core_personnel ( first_name, last_name ) ),
                student_enrollments ( core_classrooms ( grade_level, room_number ) )
            `).eq('id', stId).single();

            if (error) { $('#st_name').text('เกิดข้อผิดพลาด'); return; }

            if (student) {
                // ⭐ อัปเดตรูปโปรไฟล์
                const avatarUrl = student.avatar_students_url;
                if (avatarUrl) {
                    $('#st_avatar_img').attr('src', avatarUrl).removeClass('hidden');
                    $('#st_avatar_icon').addClass('hidden');
                } else {
                    $('#st_avatar_img').addClass('hidden');
                    $('#st_avatar_icon').removeClass('hidden');
                }

                $('#st_name').text(`${student.prefix || ''}${student.first_name} ${student.last_name}`);
                const cls = student.student_enrollments?.[0]?.core_classrooms;
                const room = cls ? `ม.${cls.grade_level}/${cls.room_number}` : 'ยังไม่จัดห้อง';
                $('#st_info').text(`เลขประจำตัว: ${student.student_id_card || '-'} | ชั้น ${room}`);

                let total = 100;
                let html = '';
                const colSpan = isAdmin ? 7 : 6;

                if (student.behavior_logs?.length > 0) {
                    currentLogs = student.behavior_logs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                    currentLogs.forEach(log => {
                        total += log.score_change;

                        const dateDisplay = new Date(log.created_at).toLocaleDateString('th-TH', {
                            year: '2-digit', month: 'short', day: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        }) + ' น.';

                        const scoreClass = log.score_change > 0 ? 'text-green-600 bg-green-50/50'
                            : log.score_change < 0 ? 'text-red-600 bg-red-50/50'
                                : 'text-slate-400 bg-slate-50';

                        const imgUrl = getDriveImageUrl(log.evidence_url);
                        const evidenceHtml = log.evidence_url
                            ? `<a href="${log.evidence_url}" target="_blank"
                                  class="flex flex-col items-center gap-1 text-blue-500 hover:text-blue-700 font-bold underline">
                                   <img src="${imgUrl}" alt="หลักฐาน"
                                        class="h-12 w-12 object-cover rounded-lg border border-slate-200 bg-slate-100"
                                        onerror="this.src=''; this.outerHTML='<i class=\'fas fa-image text-blue-400 text-xl\'></i>';">
                                   <span class="text-xs">ดูรูป</span>
                               </a>`
                            : '<span class="text-slate-300">-</span>';

                        const recorder = log.core_personnel
                            ? `${log.core_personnel.first_name} ${log.core_personnel.last_name}`
                            : '-';

                        html += `<tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-4 text-slate-500 text-xs whitespace-nowrap">${dateDisplay}</td>
                            <td class="p-4 font-bold text-slate-700">${log.behavior_criteria?.title || '-'}</td>
                            <td class="p-4 text-slate-500 text-xs">${log.description || '-'}</td>
                            <td class="p-4 text-center font-black text-lg ${scoreClass}">
                                ${log.score_change > 0 ? '+' : ''}${log.score_change}
                            </td>
                            <td class="p-4 text-center">${evidenceHtml}</td>
                            <td class="p-4 text-xs text-slate-500 font-medium">${recorder}</td>`;

                        if (isAdmin) {
                            html += `<td class="p-4 text-center whitespace-nowrap">
                                <button onclick="openEditModal('${log.id}')"
                                    class="text-slate-400 hover:text-yellow-600 bg-slate-50 hover:bg-yellow-50 px-2 py-1 rounded-lg transition mr-1" title="แก้ไข">
                                    <i class="fas fa-pen"></i>
                                </button>`;
                            if (isSuperAdmin) {
                                html += `<button onclick="deleteLog('${log.id}')"
                                    class="text-slate-400 hover:text-red-600 bg-slate-50 hover:bg-red-50 px-2 py-1 rounded-lg transition" title="ลบถาวร">
                                    <i class="fas fa-trash"></i>
                                </button>`;
                            }
                            html += `</td>`;
                        }
                        html += `</tr>`;
                    });
                }

                $('#st_score').text(total);
                $('#history_body').html(html || `<tr><td colspan="${colSpan}" class="p-8 text-center text-slate-400">ไม่พบประวัติการบันทึกความประพฤติ</td></tr>`);
            }
        }

        function setImageAction(action) {
            editImageAction = action;

            const base = 'border-slate-200 text-slate-600 bg-white';
            $('#btn_img_keep, #btn_img_replace, #btn_img_remove')
                .removeClass('border-blue-500 bg-blue-500 border-green-500 bg-green-500 border-red-500 bg-red-500 text-white')
                .addClass(base);

            if (action === 'keep') {
                $('#btn_img_keep').removeClass(base).addClass('border-blue-500 bg-blue-500 text-white');
                $('#edit_new_image_section').addClass('hidden');
            } else if (action === 'replace') {
                $('#btn_img_replace').removeClass(base).addClass('border-green-500 bg-green-500 text-white');
                $('#edit_new_image_section').removeClass('hidden');
                $('#edit_evidence_file').val('');
                $('#edit_evidence_preview').addClass('hidden');
            } else if (action === 'remove') {
                $('#btn_img_remove').removeClass(base).addClass('border-red-500 bg-red-500 text-white');
                $('#edit_new_image_section').addClass('hidden');
            }
        }

        async function trashDriveFile(url) {
            if (!url || !systemConfig?.gas_url) return;
            const fileId = getFileIdFromUrl(url);
            if (!fileId) return;
            try {
                await fetch(systemConfig.gas_url, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'trash', fileId })
                });
            } catch (err) {
                console.warn('Trash file error:', err);
            }
        }

        function openEditModal(logId) {
            const log = currentLogs.find(l => l.id === logId);
            if (!log) return;

            $('#edit_log_id').val(log.id);
            $('#edit_old_evidence_url').val(log.evidence_url || '');
            $('#edit_score').val(log.score_change);
            $('#edit_desc').val(log.description || '');
            $('#edit_evidence_img_error').addClass('hidden');

            let html = '<option value="">-- เลือกรายการ --</option>';
            criteriaList.forEach(c => {
                const sel = c.id === log.criteria_id ? 'selected' : '';
                const score = c.category === 'negative' ? -c.default_score : c.default_score;
                html += `<option value="${c.id}" data-score="${score}" ${sel}>${c.title} (${score > 0 ? '+' : ''}${score})</option>`;
            });
            $('#edit_criteria').html(html);

            if (log.evidence_url) {
                $('#edit_current_evidence').removeClass('hidden');
                $('#edit_no_evidence').addClass('hidden');
                $('#edit_evidence_current_img')
                    .attr('src', getDriveImageUrl(log.evidence_url))
                    .removeClass('hidden');
                $('#edit_evidence_current_link').attr('href', log.evidence_url);
                $('#btn_img_remove').removeClass('hidden');
            } else {
                $('#edit_current_evidence').addClass('hidden');
                $('#edit_no_evidence').removeClass('hidden');
                $('#btn_img_remove').addClass('hidden');
            }

            setImageAction('keep');
            $('#editModal').removeClass('hidden').addClass('flex');
        }

        function updateEditScore() {
            $('#edit_score').val($('#edit_criteria option:selected').data('score'));
        }

        function closeEditModal() {
            $('#editModal').addClass('hidden').removeClass('flex');
            $('#edit_evidence_file').val('');
            $('#edit_evidence_preview').addClass('hidden');
        }

        async function saveEditLog() {
            const logId = $('#edit_log_id').val();
            const criteriaId = $('#edit_criteria').val();
            const score = parseInt($('#edit_score').val());
            const desc = $('#edit_desc').val();
            const oldUrl = $('#edit_old_evidence_url').val();

            if (!criteriaId || isNaN(score))
                return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');

            let finalImageUrl = oldUrl || null;

            if (editImageAction === 'replace') {
                const fileInput = $('#edit_evidence_file')[0].files[0];
                if (!fileInput)
                    return Swal.fire('แจ้งเตือน', 'กรุณาเลือกรูปภาพใหม่', 'warning');
                if (!systemConfig?.gas_url || !systemConfig?.drive_folder_id)
                    return Swal.fire('ตั้งค่าไม่สมบูรณ์', 'ยังไม่ได้ตั้งค่าการเชื่อมต่อ Google Drive', 'error');

                if (oldUrl) {
                    Swal.fire({ title: 'กำลังลบรูปเก่า...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                    await trashDriveFile(oldUrl);
                }

                try {
                    Swal.fire({ title: 'กำลังอัปโหลดรูปใหม่...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                    const resizedBlob = await resizeImage(fileInput);
                    const base64Data = await blobToBase64(resizedBlob);

                    const response = await fetch(systemConfig.gas_url, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'upload',
                            base64: base64Data,
                            fileName: `behavior_edit_${logId}_${Date.now()}.jpg`,
                            folderId: systemConfig.drive_folder_id
                        })
                    });
                    const resData = await response.json();
                    if (resData.status === 'success') finalImageUrl = resData.url;
                    else throw new Error(resData.message);
                } catch (err) {
                    return Swal.fire('อัปโหลดรูปไม่สำเร็จ', err.message, 'error');
                }

            } else if (editImageAction === 'remove') {
                if (oldUrl) {
                    Swal.fire({ title: 'กำลังลบรูปหลักฐาน...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                    await trashDriveFile(oldUrl);
                }
                finalImageUrl = null;
            }

            Swal.fire({ title: 'กำลังจัดเก็บข้อมูล...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

            const { error } = await db.from('behavior_logs').update({
                criteria_id: criteriaId,
                score_change: score,
                description: desc,
                evidence_url: finalImageUrl,
                recorder_id: currentUserId
            }).eq('id', logId);

            if (!error) {
                Swal.fire({ icon: 'success', title: 'แก้ไขสำเร็จ', timer: 1500, showConfirmButton: false });
                closeEditModal();
                loadHistory();
            } else {
                Swal.fire('ผิดพลาด', error.message, 'error');
            }
        }

        async function deleteLog(logId) {
            const log = currentLogs.find(l => l.id === logId);

            const { isConfirmed } = await Swal.fire({
                title: 'ลบรายการนี้ถาวร?',
                html: `<p class="text-slate-600">รายการจะถูก<b class="text-red-600">ลบออกจากระบบถาวร</b></p>
                       ${log?.evidence_url ? '<p class="text-xs text-amber-600 mt-2"><i class="fas fa-exclamation-triangle mr-1"></i>รูปหลักฐานจะถูกย้ายไปถังขยะ Drive</p>' : ''}`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                confirmButtonText: '<i class="fas fa-trash mr-1"></i> ลบถาวร',
                cancelButtonText: 'ยกเลิก'
            });

            if (!isConfirmed) return;

            Swal.fire({ title: 'กำลังดำเนินการ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

            if (log?.evidence_url) await trashDriveFile(log.evidence_url);

            const { error } = await db.from('behavior_logs').delete().eq('id', logId);

            if (!error) {
                Swal.fire({ icon: 'success', title: 'ลบรายการสำเร็จ', timer: 1500, showConfirmButton: false });
                loadHistory();
            } else {
                Swal.fire('ผิดพลาด', error.message, 'error');
            }
        }

        async function resizeImage(file, maxWidth = 1000) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        canvas.toBlob(resolve, 'image/jpeg', 0.8);
                    };
                };
            });
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
            });
        }
    </script>
