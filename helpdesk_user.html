<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ศูนย์ช่วยเหลือและแจ้งปัญหา | WRK System</title>
    <script src="core_head.js"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-800 h-screen flex flex-col opacity-0 transition-opacity duration-300" id="mainBody">

    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center z-10 sticky top-0 shadow-sm">
        <div class="flex items-center gap-4">
            <div class="rounded-xl p-1.5 shadow-sm shrink-0 bg-blue-50">
                <i class="fa-solid fa-comment-dots text-blue-600 text-xl"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">ติดต่อผู้ดูแลระบบ</h2>
                <p class="text-xs text-gray-500">ฝากข้อความ แจ้งปัญหาการใช้งาน หรือข้อสอบถามต่างๆ</p>
            </div>
        </div>
        <button id="backToHomeBtn" class="text-sm font-bold text-gray-500 hover:text-blue-600 transition-colors" title="กลับหน้าหลัก">
            <i class="fa-solid fa-house mr-1"></i> กลับหน้าหลัก
        </button>
    </header>

    <main class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto p-4 gap-4">
        <div class="w-1/3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h3 class="font-bold text-gray-700"><i class="fa-solid fa-history mr-2 text-slate-500"></i>ประวัติการติดต่อ</h3>
                <button onclick="openNewTicketModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg shadow-sm transition-colors" title="สร้างเรื่องใหม่">
                    <i class="fa-solid fa-plus mr-1"></i> สร้างเรื่องใหม่
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-2" id="userTicketList">
                <div class="text-center py-8 text-gray-400 text-sm">กำลังโหลดประวัติ...</div>
            </div>
        </div>

        <div class="flex-1 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 flex flex-col overflow-hidden relative">
            <div id="chatHeader" class="p-4 border-b border-gray-100 bg-gray-50 hidden">
                <div class="flex justify-between items-center">
                    <div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full mb-1 inline-block" id="activeStatus"></span>
                        <h3 class="font-bold text-gray-800 text-base" id="activeTopic">หัวข้อเรื่อง</h3>
                    </div>
                </div>
            </div>

            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-gray-400 p-6 text-center">
                <i class="fa-solid fa-headset text-5xl mb-3 text-gray-300"></i>
                <h4 class="font-bold text-gray-700 mb-1">ยินดีต้อนรับสู่ศูนย์ช่วยเหลือ</h4>
                <p class="text-sm max-w-xs">คุณสามารถเลือกเรื่องที่เคยแจ้งไว้ทางซ้ายมือ หรือกดปุ่ม "สร้างเรื่องใหม่" เพื่อส่งข้อความถึงแอดมิน</p>
            </div>

            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4 hidden bg-slate-50/50"></div>

            <div id="replyBox" class="p-4 border-t border-gray-200 bg-white hidden">
                <form onsubmit="sendMessage(event)" class="flex gap-2 items-end">
                    <div class="flex-1">
                        <textarea id="userMessage" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-blue-500 resize-none transition-colors" placeholder="พิมพ์ข้อความที่ต้องการส่ง... (ใส่อิโมจิ 😊 หรือวางลิงก์ 🔗 ได้เลย)"></textarea>
                    </div>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white h-[50px] px-6 rounded-xl font-bold shadow-sm transition-colors shrink-0" title="ส่งข้อความ">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="helpdesk_user.js"></script>
</body>
</html>
